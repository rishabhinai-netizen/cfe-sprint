<script id="DATA" type="application/json">{"meta":{"examDays":39,"studyDaysPerWeek":6,"passMark":75,"sections":{"s1":{"name":"Fraud Schemes & Financial Crimes","q":120,"mins":150,"weight":"~38%"},"s2":{"name":"Fraud Investigations & Legal Issues","q":120,"mins":150,"weight":"~38%"},"s3":{"name":"Fraud Prevention & Deterrence","q":70,"mins":90,"weight":"~24%"}},"gapPack":true},"plan":[{"d":1,"sec":"s1","title":"Accounting & financial-statement fraud","topics":["t1"],"quiz":"q_d1"},{"d":2,"sec":"s1","title":"FSF scheme families & frequency","topics":["t2"],"quiz":"q_d2"},{"d":3,"sec":"s1","title":"Cash receipts: skimming vs larceny","topics":["t3"],"quiz":"q_d3"},{"d":4,"sec":"s1","title":"Fraudulent disbursements","topics":["t4"],"quiz":"q_d4"},{"d":5,"sec":"s1","title":"Inventory, corruption & conflicts","topics":["t5"],"quiz":"q_d5"},{"d":6,"sec":"s1","title":"Bank, loan & real-estate fraud","topics":["t6"],"quiz":"q_d6"},{"d":7,"sec":"s1","title":"Money laundering & AML","topics":["t7"],"quiz":"q_d7"},{"d":8,"sec":"s1","title":"Payment, cyber, consumer & Section 1 drill","topics":["t11","t8"],"quiz":"q_d8"},{"d":9,"sec":"s2","title":"Planning a fraud examination","topics":["t12"],"quiz":"q_d9"},{"d":10,"sec":"s2","title":"Law: elements & burdens of proof","topics":["t13"],"quiz":"q_d10"},{"d":11,"sec":"s2","title":"Key statutes: SOX, RICO, FCA, FCPA","topics":["t14b"],"quiz":"q_d11"},{"d":12,"sec":"s2","title":"Rights & basic evidence law","topics":["t14"],"quiz":"q_d12"},{"d":13,"sec":"s2","title":"Collecting & digital evidence","topics":["t15"],"quiz":"q_d13"},{"d":14,"sec":"s2","title":"Interview theory & question types","topics":["t16"],"quiz":"q_d14"},{"d":15,"sec":"s2","title":"Admission-seeking & deception","topics":["t17"],"quiz":"q_d15"},{"d":16,"sec":"s2","title":"Tracing assets, Benford & net worth","topics":["t18"],"quiz":"q_d16"},{"d":17,"sec":"s2","title":"Court, testifying, reports & Law drill","topics":["t19","t20"],"quiz":"q_d17"},{"d":18,"sec":"s3","title":"Financial crime & criminology","topics":["t21"],"quiz":"q_d18"},{"d":19,"sec":"s3","title":"Detection reality: tips & hotlines","topics":["t21b"],"quiz":"q_d19"},{"d":20,"sec":"s3","title":"Governance & management duties","topics":["t22"],"quiz":"q_d20"},{"d":21,"sec":"s3","title":"Auditors, COSO & internal controls","topics":["t23"],"quiz":"q_d21"},{"d":22,"sec":"s3","title":"Risk assessment, ethics & CFE Code","topics":["t24","t25"],"quiz":"q_d22"},{"d":23,"sec":"mock","title":"Mock Exam — Section 1","topics":[],"quiz":"mock_s1"},{"d":24,"sec":"mock","title":"Mock Exam — Section 2","topics":[],"quiz":"mock_s2"},{"d":25,"sec":"mock","title":"Mock Exam — Section 3 + final review","topics":[],"quiz":"mock_s3"},{"d":26,"sec":"s1","title":"GAP · Data & IP theft","topics":["g1"],"quiz":"q_g1"},{"d":27,"sec":"s1","title":"GAP · Identity theft","topics":["g2"],"quiz":"q_g2"},{"d":28,"sec":"s1","title":"GAP · Financial institution fraud","topics":["g3"],"quiz":"q_g3"},{"d":29,"sec":"s1","title":"GAP · Securities fraud","topics":["g4"],"quiz":"q_g4"},{"d":30,"sec":"s1","title":"GAP · Payment fraud (cheques & cards)","topics":["g5"],"quiz":"q_g5"},{"d":31,"sec":"s1","title":"GAP · Insurance fraud","topics":["g6"],"quiz":"q_g6"},{"d":32,"sec":"s1","title":"GAP · Health care fraud","topics":["g7"],"quiz":"q_g7"},{"d":33,"sec":"s1","title":"GAP · Consumer fraud & scams","topics":["g8"],"quiz":"q_g8"},{"d":34,"sec":"s1","title":"GAP · Bankruptcy fraud","topics":["g9"],"quiz":"q_g9"},{"d":35,"sec":"s1","title":"GAP · Tax fraud","topics":["g10"],"quiz":"q_g10"},{"d":36,"sec":"s1","title":"GAP · Cyberfraud","topics":["g11"],"quiz":"q_g11"},{"d":37,"sec":"s1","title":"GAP · Government & procurement fraud","topics":["g12"],"quiz":"q_g12"},{"d":38,"sec":"s1","title":"GAP · Cross-chapter trap drill","topics":[],"quiz":"q_traps"},{"d":39,"sec":"mock","title":"FULL MOCK · 100Q exam simulation","topics":[],"quiz":"mock_full_s1"}],"lessons":{"t1":{"sec":"s1","title":"Accounting foundations & financial-statement fraud (FSF)","day":1,"body":[{"h":"The essentials"},{"p":"Under <em>accrual</em> accounting, revenue is recognized when it is <strong>earned</strong> and expenses when <strong>incurred</strong> — not when cash moves. Almost all financial-statement fraud lives in that timing gap. Keep the equation in mind: <strong>Assets = Liabilities + Owners' equity</strong>; every fraudulent entry must still balance, which is why fraudsters force offsets somewhere."},{"p":"FSF is the <strong>deliberate misrepresentation of a company's financial condition</strong> through intentional misstatement or omission to deceive users. It is the <strong>least frequent but most costly</strong> occupational-fraud category. It crosses from 'aggressive accounting' into fraud when there is a <em>material</em> misstatement plus <em>intent to deceive</em> users who rely on the statements."},{"h":"Why it happens & how it's detected"},{"ul":["<strong>Motive:</strong> hit earnings/analyst targets, trigger bonuses, prop up a share price, or hide a decline.","<strong>Vertical (common-size) analysis</strong> — each line as a % of a base (sales for P&L, total assets for balance sheet). Best for spotting an abnormal COGS-to-sales or margin shift.","<strong>Horizontal analysis</strong> — % change line-by-line across periods.","<strong>Ratio analysis</strong> — receivable/inventory turnover, current ratio, gross margin."]},{"key":"Capitalizing a routine expense (booking a repair as a fixed asset) <strong>overstates assets AND overstates net income</strong>, because the expense is improperly deferred off the income statement. This exact mechanic is tested repeatedly."},{"h":"Red-flag cluster"},{"p":"Revenue growing faster than operating cash flow; receivables growing faster than sales; recurring 'one-time' items; a dominant CEO/CFO who overrides controls. (Stable operating cash flow funding dividends is a sign of health, <em>not</em> a red flag — a classic EXCEPT trap.)"},{"case":"<strong>Telecom — capacity swaps:</strong> two carriers sell each other equal network capacity at inflated prices, each booking the inflow as revenue while burying the outflow as a capital asset. Result: fictitious revenue + capitalized expense in one move. Red flag — large round-number transactions with a single counterparty near quarter-end."},{"case":"<strong>Software — channel stuffing:</strong> a vendor ships far more product to distributors than they can sell, with a quiet right-of-return, booking it all as revenue to hit the quarter. Red flag — a Q4 sales spike followed by Q1 returns and bloated distributor inventory."},{"eye":"Examiner's eye: when revenue rises but operating cash flow lags, follow the receivables. Genuine sales convert to cash; fictitious ones pile up as 'uncollected' balances."}]},"t2":{"sec":"s1","title":"The five FSF scheme families & where they hide","day":2,"body":[{"h":"Memorise these five — questions give a scenario and ask which family"},{"table":[["Family","What happens / tell"],["Fictitious revenue","Sales to fake or phantom customers; sham related-party sales."],["Timing differences","Real revenue/expense in the wrong period (channel stuffing, premature recognition)."],["Concealed liabilities & expenses","Omitting payables, warranty/litigation reserves; capitalizing operating costs."],["Improper disclosures","Omitting related parties, contingencies, subsequent events, going-concern doubt."],["Improper asset valuation","Inflating inventory, receivables, or fixed assets; not writing down impaired assets."]]},{"key":"'December sales booked in November' = <strong>timing difference</strong> (real sale, wrong period). 'Failing to record warranty/litigation reserves' = <strong>concealed liabilities</strong>. 'Sales to a shell customer that doesn't exist' = <strong>fictitious revenue</strong>. The distinction is the whole game."},{"h":"Frequency vs cost — the inverse law"},{"p":"Across all occupational fraud: <strong>asset misappropriation</strong> is most frequent but lowest median loss; <strong>financial statement fraud</strong> is least frequent but highest median loss; <strong>corruption</strong> sits in between. Expect at least one question on this ranking."},{"case":"<strong>Retail/distribution — bill-and-hold:</strong> a manufacturer 'sells' goods but holds them in its own warehouse, booking revenue though the customer hasn't taken delivery or accepted risk. Tell — revenue recognized while inventory physically stays put and shipping docs are missing."},{"case":"<strong>Manufacturing — cookie-jar reserves:</strong> in good years management over-accrues reserves, then quietly releases them in weak years to smooth earnings. Tell — reserve balances that move opposite to business conditions."},{"eye":"Examiner's eye: improper disclosure fraud leaves no number wrong on the face of the statements — it hides in the notes. Always read related-party and subsequent-events footnotes against the transaction data."}]},"t3":{"sec":"s1","title":"Cash-receipts schemes: skimming vs cash larceny","day":3,"body":[{"h":"The distinction the exam loves"},{"key":"<strong>Skimming = theft of cash BEFORE it is recorded (off-book).</strong> No audit trail, because the sale/receipt was never entered. <strong>Cash larceny = theft AFTER it is recorded (on-book).</strong> A discrepancy appears between the records and the cash on hand (a drawer shortage)."},{"p":"So if an employee rings 'no sale' and pockets the cash → <strong>skimming</strong> (nothing recorded). If a cashier removes cash from a sale already recorded, creating a drawer shortage → <strong>cash larceny</strong>."},{"h":"Lapping — the signature concealment"},{"p":"<strong>Lapping</strong> hides skimmed receivables: steal Customer A's payment, then post Customer B's later payment to A's account, then cover B with C — rolling the shortfall forward indefinitely. The classic tell is <strong>customer complaints that payments were misapplied or posted late</strong>. Independent reconciliation and customer confirmations break it."},{"h":"Prevention"},{"p":"<strong>Segregation of duties</strong> is the core control: whoever receives cash must not also record and reconcile it. Add surprise cash counts, independent bank reconciliations, and matching recorded sales to register tapes."},{"case":"<strong>Casino — the cage & the rail:</strong> a cage cashier voids legitimate chip redemptions and keeps the cash before it's logged — off-book skimming. Casinos counter with the 'eye in the sky', mandatory dual control at the cage, and reconciling the drop box to logged transactions."},{"case":"<strong>Restaurant/bar — the unrung drink:</strong> a bartender serves cash customers without ringing the sale, pocketing the money and keeping pour counts plausible. Tell — pour/usage variance: liquor consumed exceeds recorded sales."},{"case":"<strong>Charity/collections — offering skimming:</strong> a volunteer counts cash donations alone and removes a cut before any record exists. Tell — donation income that doesn't track attendance or pledge data."},{"eye":"Examiner's eye: skimming's defining weakness for the fraudster is that it caps how much they can take — once a sale is unrecorded, they can't easily inflate it. Larceny leaves a trail; skimming leaves a gap. Look for what's missing, not just what's wrong."}]},"t4":{"sec":"s1","title":"Fraudulent disbursements: the on-book payouts","day":4,"body":[{"h":"The essentials"},{"p":"Disbursement schemes are <strong>on-book</strong>: the company's own funds leave through its accounting system on fraudulent documentation. These are the most common occupational frauds. Five families:"},{"table":[["Scheme","Core mechanism"],["Billing","Shell-company invoices, personal purchases, inflated/duplicate invoices. Most common & costly."],["Payroll","Ghost employees, falsified hours/commissions, inflated pay rates."],["Expense reimbursement","Mischaracterized, overstated, fictitious, or duplicate claims."],["Check & payment tampering","Forged maker/endorsement, altered payee, authorized-maker abuse."],["Register disbursement","False refunds and false voids — a RECORDED transaction to justify removing cash."]]},{"key":"<strong>Shell vs pass-through:</strong> a pure shell bills for goods/services never delivered; a <strong>pass-through (turnaround)</strong> actually buys real goods then resells them to the employer at an inflated markup. (So 'pass-through delivers nothing' is FALSE.)"},{"key":"<strong>Register disbursement ≠ skimming.</strong> A false refund is a <em>recorded</em> fraudulent transaction used to pull cash — the recorded entry is the giveaway. Skimming records nothing."},{"h":"Detecting the big ones"},{"ul":["<strong>Ghost employees:</strong> distribute paychecks in person and reconcile to active-HR records — no real person claims a ghost's check.","<strong>Check tampering</strong> is unique: the fraudster prepares or alters the instrument itself, not just the supporting document.","<strong>Expense mischaracterization:</strong> a genuine personal purchase reported as business (e.g., a personal laptop as 'client supplies')."]},{"case":"<strong>Construction — over-billing & fake subs:</strong> a project manager sets up a shell 'subcontractor' and approves invoices for work never performed, buried in a large project's cost codes. Tell — a vendor with a PO box, no website, and invoices always just under the approval threshold."},{"case":"<strong>Healthcare payroll — the ghost nurse:</strong> a supervisor keeps a terminated nurse 'active' and redirects the pay to a controlled account. Tell — an employee with no badge-ins, no benefits enrollment, and direct deposit to an account shared with another employee."},{"eye":"Examiner's eye: billing schemes are the highest-frequency, highest-cost disbursement fraud — your VendorRecon territory. The fastest screens are duplicate-invoice tests, round-dollar invoices, vendors whose address matches an employee's, and invoices clustered just below approval limits."}]},"t5":{"sec":"s1","title":"Inventory theft, corruption & conflicts of interest","day":5,"body":[{"h":"Non-cash asset misappropriation"},{"p":"Two routes: <strong>misuse</strong> (borrowing assets — low loss, hard to prove damages) and <strong>larceny</strong> (outright theft). <strong>Shrinkage</strong> — the unaccounted-for reduction in inventory — is the primary red flag; fraudsters keep it within 'normal' ranges to avoid scrutiny. <strong>Physical padding</strong> (stacking empty cartons during a count) fakes quantity on hand."},{"h":"The four forms of corruption"},{"table":[["Form","Essence"],["Bribery","A thing of value to INFLUENCE a business decision (includes kickbacks)."],["Illegal gratuity","A reward for a decision ALREADY made — no prior intent to influence."],["Economic extortion","The DEMAND side — an employee demands payment to decide in the payer's favour."],["Conflict of interest","An undisclosed economic/personal interest in a transaction."]]},{"key":"<strong>Bribery vs illegal gratuity</strong> turns entirely on timing/intent: bribery influences a <em>future</em> decision; an illegal gratuity rewards a <em>past</em> one. A <strong>kickback</strong> is a vendor returning part of an overbilling to the employee who steered the deal. A <strong>conflict of interest</strong> becomes fraud when the interest is <em>undisclosed</em> and divided loyalty harms the employer."},{"h":"Bid-rigging (procurement collusion)"},{"ul":["<strong>Complementary (cover) bids</strong> — deliberately high bids to fake competition.","<strong>Bid suppression</strong> — agreeing not to bid.","<strong>Bid rotation</strong> — taking turns being the low bidder.","<strong>Market division</strong> — splitting territories/customers."]},{"case":"<strong>Casino — chip walking & comp abuse:</strong> a host with an undisclosed stake in a junket operator steers high-roller comps and rebates to that operator. Undisclosed interest + steering = conflict of interest layered with kickbacks."},{"case":"<strong>Public works — the paving cartel:</strong> three contractors rotate who wins each municipal contract, submitting cover bids for the others. Tell — the same firms always bid, margins are suspiciously uniform, and the 'winner' rotates predictably."},{"case":"<strong>Retail procurement — the slotting kickback:</strong> a category buyer awards premium shelf space to a supplier who funds the buyer's personal credit card. Tell — a mid-tier supplier consistently winning against stronger competitors."},{"eye":"Examiner's eye: corruption is detected far more by tips and relationship analysis than by the books — the transaction often looks normal. Map employee-vendor connections, lifestyle changes, and exclusive-dealing patterns."}]},"t6":{"sec":"s1","title":"Financial-institution, loan & real-estate fraud","day":6,"body":[{"h":"Directly your ICICI HFC world"},{"p":"Bank fraud clusters around embezzlement, loan fraud, real-estate fraud, new-account fraud and wire fraud. The <strong>Basel Committee on Banking Supervision</strong> sets global <em>prudential</em> standards (sound risk management) — distinct from FATF, which sets AML standards."},{"h":"Loan fraud — the high-value core"},{"ul":["<strong>Nominee / straw-borrower loan</strong> — loan in a front person's name for the real party's benefit (evades exposure limits, hides risk).","<strong>Loans to nonexistent borrowers</strong> and <strong>air loans</strong> (wholly fictitious property/borrower).","<strong>Double-pledged collateral</strong>; <strong>false applications</strong> (income/asset/occupancy misrepresentation).","<strong>Reciprocal loans</strong> between insiders to hide losses; <strong>construction draw fraud</strong>."]},{"key":"<strong>Appraisal (valuation) fraud</strong> — inflating a property's value to justify a larger mortgage — is your ValuGuard domain. Distinguish it from an <strong>air loan</strong>, which is on a property/borrower that doesn't exist at all."},{"h":"Anti-bribery law you must know"},{"p":"The U.S. <strong>FCPA</strong> prohibits bribing <em>foreign officials</em> to obtain or retain business and requires accurate books & records plus internal accounting controls. The UK Bribery Act is broader (covers private bribery and 'failure to prevent')."},{"case":"<strong>Mortgage — the straw buyer ring:</strong> an organizer recruits people with clean credit to 'buy' inflated properties using a corrupt appraiser; loans fund, proceeds are split, and the straws walk away — the loans default. Tell — multiple loans, same appraiser, same closing agent, owner-occupancy claims that don't match utility records."},{"case":"<strong>Trade finance — the phantom shipment:</strong> a borrower draws on a letter of credit using forged bills of lading for goods never shipped. Tell — shipping documents that don't reconcile to vessel/port records."},{"eye":"Examiner's eye: insider involvement multiplies loss. The most damaging bank frauds pair an outsider's false application with an insider who waves it through — so test the approver, not just the applicant."}]},"t7":{"sec":"s1","title":"Money laundering & anti-money-laundering","day":7,"body":[{"h":"The three stages — memorise cold"},{"table":[["Stage","What happens"],["Placement","Dirty cash enters the system (deposits, structuring/smurfing, cash-intensive fronts)."],["Layering","Complex transfers obscure the source (shells, wire chains, cross-border movement)."],["Integration","'Clean' funds re-enter the economy as legitimate-looking assets (property, business, luxury)."]]},{"key":"Order: <strong>Placement → Layering → Integration.</strong> <strong>Structuring (smurfing)</strong> — breaking cash into sub-threshold deposits to dodge reporting — is a <em>placement</em>-stage red flag, and is an offence in itself <em>even if the cash is from a legal source</em>, because the intent is to defeat reporting. This is exactly the self-transfer / sub-threshold signal your StaffLens flags."},{"h":"International framework"},{"ul":["<strong>FATF</strong> — issues the 40 Recommendations; the global AML/CFT standard-setter.","<strong>Egmont Group</strong> — links national Financial Intelligence Units; <strong>Wolfsberg</strong> principles; <strong>Basel</strong> guidance.","KYC/CDD, enhanced due diligence for high-risk customers, currency-transaction and suspicious-activity reporting."]},{"p":"Maps cleanly to India's <strong>PMLA</strong>: placement/layering/integration is the same language — but answer the exam in <em>FATF/BSA</em> framing."},{"case":"<strong>Casino laundering:</strong> a launderer buys chips with dirty cash, gambles minimally, then cashes out asking for a casino cheque — 'clean' winnings. Counters: chip-purchase logging, cash-transaction reporting, and 'minimal-play cash-out' alerts."},{"case":"<strong>Trade-based laundering:</strong> over- or under-invoicing exports moves value across borders disguised as trade. Tell — invoice prices wildly off market for the goods described."},{"case":"<strong>Crypto layering:</strong> funds are split across wallets, run through mixers/tumblers, then consolidated and off-ramped. Tell — rapid many-hop transfers with no economic purpose."},{"eye":"Examiner's eye: structuring is about <em>intent to evade a threshold</em>, not the amount. Many small, just-under-limit, round-number deposits across branches or days is the pattern — amount alone never proves it."}]},"t8":{"sec":"s1","title":"Payment, identity, cyber, consumer & tax fraud","day":8,"body":[{"h":"Payment fraud"},{"ul":["<strong>Check kiting</strong> — exploiting the <em>float</em> (clearing delay) between two banks by passing checks against insufficient funds to fake a balance.","Payment-card fraud (skimming, card-not-present), electronic/P2P fraud, alternative currencies."]},{"h":"Identity theft & cyberfraud"},{"ul":["<strong>Synthetic identity theft</strong> — combine a real (stolen) ID number with a fabricated name/DOB to create a new identity. Distinct from <strong>account takeover</strong> (hijacking an existing account).","<strong>Business email compromise (BEC)</strong> — impersonate an executive/vendor by email to redirect a payment. Heavily emphasised in the 2026 blueprint.","Malware (ransomware, keyloggers), phishing/spear-phishing, the CIA triad (Confidentiality, Integrity, Availability)."]},{"h":"Consumer schemes & tax"},{"key":"<strong>Ponzi</strong> pays 'returns' from new investors' money (no real returns). <strong>Pyramid</strong> derives income chiefly from <em>recruitment</em>, not product sales. <strong>Tax evasion is illegal and requires willful intent</strong> to defeat tax; <strong>tax avoidance is lawful</strong> minimization. The willfulness/legality line is the tested point."},{"case":"<strong>Banking — the BEC wire:</strong> 'CEO' emails the AP clerk near closing on a Friday: urgent confidential acquisition, wire to this new account, don't call me. Tell — urgency + secrecy + a new beneficiary + a spoofed look-alike domain. Control: out-of-band callback verification on any change of payment details."},{"case":"<strong>Insurance — staged accident ring:</strong> organized crews stage collisions and file inflated injury claims through complicit clinics and lawyers. Tell — same clinic, same attorney, soft-tissue injuries, identical treatment counts across unrelated 'victims'."},{"case":"<strong>Elder fraud — the romance/advance-fee combo:</strong> a victim is groomed online, then asked for fees to release a fictitious fortune. Tell — escalating wire requests to overseas accounts, secrecy from family."},{"eye":"Examiner's eye: BEC and kiting both exploit timing and trust, not broken controls. The defence is procedural — verification callbacks for payment changes, and monitoring inter-bank float and rapid in-out account activity."}]},"t11":{"sec":"s1","title":"Section 1 fast-recognition drill","day":8,"body":[{"h":"Classify any cash scenario in one pass"},{"key":"Was it recorded? <strong>No → skimming.</strong> Recorded, then stolen → <strong>cash larceny.</strong> Paid out through the system on fake docs → <strong>fraudulent disbursement</strong> (then sub-classify: billing / payroll / expense / check / register)."},{"h":"Rapid tells"},{"ul":["'No-sale' rung, cash pocketed → skimming.","Customer A credited with B's payment → lapping.","Fake vendor, no goods → shell-company billing.","Real goods resold to employer at markup → pass-through.","Recorded false refund → register disbursement.","Empty cartons at the count → physical padding.","Reward after the award, no prior deal → illegal gratuity (not bribery).","Sub-threshold deposits → structuring (placement)."]},{"eye":"Examiner's eye: most wrong answers are the <em>adjacent</em> scheme. Classify first from the facts, then confirm against the options — don't let a tempting near-miss pull you off."}]},"t12":{"sec":"s2","title":"Planning & conducting a fraud examination","day":9,"body":[{"h":"What it is (and isn't)"},{"p":"A fraud examination is a <strong>methodology for resolving a specific allegation from inception to disposition</strong> — gathering evidence, taking statements, writing reports, testifying. It is <em>not</em> an audit: audits are recurring and general; examinations are specific and allegation-driven."},{"h":"The fraud theory approach"},{"ol":["<strong>Analyze</strong> available data.","<strong>Create a hypothesis</strong> (assume a worst-case scenario from the data).","<strong>Test</strong> the hypothesis against evidence.","<strong>Refine / amend</strong> as new facts emerge."]},{"key":"Two golden rules: conduct the exam <strong>general → specific</strong>, and interview <strong>least-culpable → most-culpable</strong>, so you reach the prime suspect last, armed with evidence."},{"h":"Predication — the gate"},{"p":"<strong>Predication</strong> is the totality of circumstances that would lead a reasonable, professionally trained person to believe a fraud has occurred, is occurring, or will occur. <strong>No examination — and no admission-seeking interview or covert operation — begins without it.</strong> Mere suspicion isn't predication; 'fishing expeditions' violate the standard."},{"case":"<strong>Manufacturing tip:</strong> an anonymous hotline call says a plant manager is steering scrap-metal sales to his cousin's yard below market. Combined with falling scrap revenue, that's predication — enough for a reasonable professional to open an exam, starting general (scrap process) before specific (the manager)."},{"eye":"Examiner's eye: write down your predication before you act. If you can't articulate why a reasonable professional would suspect fraud, you're not ready to start — and a defence lawyer will say so later."}]},"t13":{"sec":"s2","title":"The law related to fraud: elements, burdens & systems","day":10,"body":[{"h":"The four common-law elements of fraud"},{"p":"(1) a <strong>material false statement</strong>, (2) <strong>knowledge</strong> of its falsity, (3) victim <strong>reliance</strong>, and (4) resulting <strong>damages</strong>. Memorise these four — they recur across the section."},{"h":"Burden of proof — the #1 Law trap"},{"key":"Lowest → highest: <strong>preponderance of the evidence</strong> ('more likely than not', civil) → <strong>clear and convincing</strong> → <strong>beyond a reasonable doubt</strong> (criminal). Criminal = state prosecutes, punishment; civil = private party, remedies/damages."},{"h":"Legal systems"},{"ul":["<strong>Common law</strong> — judge-made precedent, adversarial (US/UK/India framework).","<strong>Civil law</strong> — codified statutes, inquisitorial.","<strong>Parallel proceedings</strong> — civil and criminal can run at once; manage self-incrimination and discovery conflicts."]},{"case":"<strong>Cross-border bank fraud:</strong> the same conduct triggers a criminal case (state, beyond a reasonable doubt) and a civil recovery suit by the bank (preponderance). The lower civil bar is why a defendant can be acquitted criminally yet still lose the civil case."},{"warn":"This is your self-identified weak area. Drill the burden ladder and the four elements until automatic — they anchor most Law questions."},{"eye":"Examiner's eye: 'material' and 'reliance' do real work. A false statement nobody relied on, or one too trivial to matter, often fails the legal test even when it feels dishonest."}]},"t14b":{"sec":"s2","title":"Key statutes: SOX, RICO, False Claims Act, FCPA","day":11,"body":[{"h":"The statutes the exam tests (in their framing)"},{"ul":["<strong>Sarbanes-Oxley (SOX)</strong> — CEO/CFO certification of financials, stronger governance, whistleblower protection, criminal penalties for document destruction.","<strong>RICO</strong> — targets a <em>pattern of racketeering activity</em>; powerful criminal penalties and civil treble damages.","<strong>False Claims Act</strong> — fraud against the government; allows <strong>qui tam</strong> suits where a private 'relator' (whistleblower) sues on the government's behalf and shares any recovery.","<strong>Mail & wire fraud</strong> — broad federal hooks needing a scheme to defraud plus use of mail/wires.","<strong>FCPA</strong> — foreign bribery plus books-and-records and internal-control provisions."]},{"key":"Match the trigger word: 'pattern of racketeering' → RICO; 'whistleblower sues for the government and shares recovery' → qui tam / False Claims Act; 'CEO certifies the financials' → SOX; 'bribing a foreign official' → FCPA."},{"case":"<strong>Healthcare — qui tam:</strong> a billing clerk discovers systematic Medicare upcoding and files a qui tam suit; the government intervenes and the relator shares the recovery. This whistleblower channel surfaces a large share of government-fraud cases."},{"case":"<strong>Corporate — SOX document destruction:</strong> after a subpoena, staff shred engagement files. The shredding itself is a separate SOX offence, independent of the underlying fraud."},{"eye":"Examiner's eye: these statutes are tested as recognition, not litigation. Lock the one-line trigger for each; you rarely need the sub-sections."}]},"t14":{"sec":"s2","title":"Rights during investigations & basic evidence law","day":12,"body":[{"h":"Public vs private power"},{"p":"Constitutional criminal protections (4th/5th Amendment, Miranda) primarily restrain <strong>government</strong> action. A <strong>private employer is not required to give Miranda warnings</strong> before interviewing an employee — though employment law, contracts and policies still apply. (<strong>Garrity</strong>: public employees can't be forced to self-incriminate on threat of firing; <strong>Weingarten</strong>: union reps in investigatory interviews.)"},{"h":"Forms & weight of evidence"},{"table":[["Type","Meaning"],["Testimonial","Statements under oath."],["Real / physical","Tangible objects."],["Documentary","Documents, records, writings."],["Demonstrative","Charts/models that explain other evidence."]]},{"key":"<strong>Direct evidence</strong> proves a fact without inference (an eyewitness who saw the act). <strong>Circumstantial evidence</strong> requires an inference (fingerprints). <strong>Most fraud cases are built largely on circumstantial evidence — and that is fully valid and admissible.</strong> So 'fraud needs direct evidence' is FALSE."},{"h":"Admissibility, privilege, custody"},{"ul":["Relevant, material, competent evidence is admissible; hearsay generally excluded (with exceptions).","<strong>Attorney-client privilege</strong> and <strong>work-product doctrine</strong> protect materials — run exams under counsel to preserve them.","<strong>Chain of custody</strong> must be unbroken; a documented gap can render evidence inadmissible."]},{"case":"<strong>Procurement case:</strong> the only proof a manager rigged bids is circumstantial — his sister owns the winning vendor, bids were opened early, and prices track his emails. No eyewitness, yet the inference chain is strong enough to prove the case."},{"eye":"Examiner's eye: juries are taught that circumstantial evidence is not 'weaker' than direct — a fingerprint can be more reliable than a nervous eyewitness. Build the inference chain tightly and document custody at every step."}]},"t15":{"sec":"s2","title":"Collecting & handling evidence (incl. digital forensics)","day":13,"body":[{"h":"Document collection rules"},{"ul":["Obtain <strong>originals</strong> where possible; if copies, document why.","Maintain a <strong>chain-of-custody / evidence control log</strong>; handle minimally to preserve fingerprints, indented writing, ink/paper dating.","<strong>Never write on or annotate the original</strong> — it destroys evidentiary integrity."]},{"h":"Digital forensics (heavily weighted in 2026)"},{"ol":["<strong>Preserve</strong> — image the drive with a write-blocker; never work on the original.","Maintain <strong>chain of custody</strong> for digital media just like physical evidence.","<strong>Analyze the forensic copy</strong> — recover deleted files, metadata, logs.","<strong>Document</strong> tools and <strong>hash values</strong> (MD5/SHA)."]},{"key":"A <strong>matching hash value</strong> proves the forensic image is bit-for-bit identical to the original and unaltered — establishing integrity for court. Always analyze the <em>image</em>, never the original device. Cloud and mobile forensics are explicitly in the new blueprint."},{"case":"<strong>IP theft — the departing engineer:</strong> before resigning, an engineer mass-copies designs to a USB drive. Examiners image his laptop (write-blocked), hash it, and recover USB-insertion artifacts and deleted file remnants — all from the copy, preserving the original for court."},{"eye":"Examiner's eye: the moment you boot a suspect's original device, you change it — last-access times, temp files, logs. That single mistake can get your best evidence thrown out. Image first, always."}]},"t16":{"sec":"s2","title":"Interview theory & question typology","day":14,"body":[{"h":"The five question types — in order"},{"ol":["<strong>Introductory</strong> — build rapport, give a reason for the interview, get a commitment to cooperate (never accuse here).","<strong>Informational</strong> — open → closed → leading; gather the facts.","<strong>Closing</strong> — confirm facts, seek new info, maintain goodwill.","<strong>Assessment</strong> — establish credibility / detect deception (only when needed).","<strong>Admission-seeking</strong> — only when there is reasonable certainty of guilt."]},{"key":"Sequence is a guaranteed point: <strong>Introductory → Informational → Closing → Assessment → Admission-seeking.</strong> The last two are used only when warranted."},{"h":"Question forms"},{"ul":["<strong>Open</strong> — invites a narrative ('Tell me what happened').","<strong>Closed</strong> — specific, often yes/no.","<strong>Leading</strong> — contains its own answer ('You were in the vault that night, weren't you?'); used to confirm.","Avoid double-negative and overly complex questions."]},{"p":"<strong>Inhibitors</strong> of communication (ego threat, etiquette, trauma, forgetting) block disclosure; <strong>facilitators</strong> (recognition, sympathy, altruistic appeals) encourage it. The interviewer manages these deliberately. Conduct interviews privately, one subject at a time, documented."},{"case":"<strong>Banking interview:</strong> investigating teller cash shortages, the examiner opens with rapport and a neutral reason ('reconciling some discrepancies'), uses open questions to let the teller narrate the day, and only narrows to leading questions once the timeline contradicts the logs."},{"eye":"Examiner's eye: the introductory phase isn't small talk — it sets whether the subject cooperates. Accuse too early and you lose the informational gold you haven't mined yet."}]},"t17":{"sec":"s2","title":"Admission-seeking interviews & assessing deception","day":15,"body":[{"h":"When to use it"},{"p":"Only with <strong>reasonable certainty of guilt</strong>, conducted privately by an interviewer of suitable standing, after adequate predication. The goal is a voluntary, truthful confession."},{"h":"The sequence (high-yield)"},{"ol":["<strong>Direct accusation</strong> — stated with confidence, not as a question.","Observe reaction; repeat the accusation.","<strong>Interrupt denials</strong> — stop them before they harden (a firm denial is harder to retract).","<strong>Establish a rationalization</strong> (a morally acceptable theme) to lower resistance.","Diffuse alibis; display real evidence as needed.","<strong>Alternative question</strong> — two incriminating choices, one more face-saving ('Did you plan this, or did it just happen?').","Obtain a benchmark admission, then escalate to a full confession.","Obtain a <strong>signed written statement</strong>."]},{"key":"The <strong>alternative question</strong> is the pivotal technique. Interrupting denials before they entrench is equally tested."},{"warn":"A signed statement is in the <strong>subject's own words</strong>, with dates, approximate amounts, intent, and an acknowledgment of voluntariness. <strong>Never promise leniency or non-prosecution</strong> — it can void the confession and exceeds your authority."},{"case":"<strong>Retail — the sweethearting cashier:</strong> with CCTV and POS data already proving under-ringing for friends, the examiner accuses directly, interrupts the first denial, offers a face-saving theme ('Were you trying to help struggling friends, or just careless?'), and secures a written statement in the cashier's own words."},{"eye":"Examiner's eye: no single verbal or non-verbal cue proves deception. Clusters matter — answering a question with a question, over-qualifying, selective memory, character testimony ('I'd never do that'). Treat cues as signals to probe, never as proof."}]},"t18":{"sec":"s2","title":"Tracing assets, data analysis & sources of information","day":16,"body":[{"h":"Tracing financial transactions"},{"ul":["<strong>Direct method</strong> — follow specific transactions through the records ('follow the money').","Indirect / circumstantial methods when records are incomplete:"]},{"table":[["Method","Logic"],["Net worth method","Asset increases + living expenses − funds from known sources = likely illicit income. The headline indirect method."],["Bank deposits method","Total deposits − transfers/known sources = understated income."],["Expenditures method","Funds spent vs reported income."]]},{"key":"The <strong>net worth method</strong> is the most tested tracing technique: an unexplained rise in net worth plus living expenses, less funds from known legitimate sources, points to hidden/illicit income."},{"h":"Data analysis — Benford's Law"},{"key":"In naturally occurring amounts, leading digit <strong>1 appears ~30.1%</strong> of the time, declining to ~4.6% for 9. Deviations flag possible manipulation. It applies to <strong>natural numbers</strong> (invoice/payment amounts), <strong>not</strong> assigned/sequential numbers (phone, account, ID, badge numbers)."},{"case":"<strong>Public-official case:</strong> a clerk earning a modest salary buys two flats and a luxury car in three years. The net worth method quantifies the gap between lifestyle and known income — the core of a disproportionate-assets case (and a familiar PMLA pattern)."},{"case":"<strong>AP fraud — Benford screen:</strong> running Benford's on a year of vendor payments shows a spike in amounts beginning '48' and '49' — clustering just under a ₹50,000 approval limit, exposing split invoices."},{"eye":"Examiner's eye: Benford flags <em>where to look</em>, not guilt. A deviation is a lead; pair it with duplicate-payment and just-under-threshold tests before drawing conclusions."}]},"t19":{"sec":"s2","title":"Court actions, testifying & report writing","day":17,"body":[{"h":"Civil vs criminal & parallel proceedings"},{"ul":["Criminal: charging → arraignment → trial → verdict → appeal (beyond a reasonable doubt).","Civil: complaint → discovery → trial → judgment/remedies (preponderance).","<strong>Parallel proceedings</strong> run both at once — manage self-incrimination and discovery carefully."]},{"h":"Testifying — lay vs expert"},{"key":"A <strong>lay witness</strong> testifies to facts personally observed; an <strong>expert witness</strong> (once qualified by the court) may give <strong>opinions within their expertise</strong>. On cross-examination, stay within expertise, concede what's genuinely true, don't advocate — and <strong>never express an opinion on the legal guilt or innocence</strong> of the accused. That's for the trier of fact."},{"h":"Report writing"},{"ul":["Accurate, clear, impartial, relevant, timely. Report <strong>facts</strong>, not conclusions of law or guilt.","Common mistakes: stating legal conclusions, opining on guilt, editorializing, omitting <strong>exculpatory</strong> evidence.","To protect privilege, conduct the investigation <strong>at the direction of counsel</strong>.","A <strong>covert operation</strong> needs adequate predication and a <em>written memorandum</em> of its basis and objectives before it begins."]},{"case":"<strong>Expert on the stand:</strong> asked point-blank 'So the defendant is guilty?', the examiner answers within bounds: 'My analysis shows ₹2.1 crore moved to accounts he controlled; whether that is criminal is for the court.' Findings, not a guilt verdict."},{"eye":"Examiner's eye: a report that editorializes or buries exculpatory facts hands the defence its cross-examination. Write every line as if it will be read aloud to the jury — because it might be."}]},"t20":{"sec":"s2","title":"Section 2 consolidation — Law & investigation drill","day":17,"body":[{"h":"The highest-failure checklist"},{"key":"(1) burden-of-proof ladder, (2) four elements of fraud, (3) direct vs circumstantial, (4) chain of custody & hash integrity, (5) interview sequence, (6) admission-seeking steps & the alternative question, (7) net worth method & Benford scope, (8) never opine on guilt."},{"h":"Rapid tells"},{"ul":["'More likely than not' → preponderance → civil.","Eyewitness saw it → direct; everything inferred → circumstantial.","Two incriminating choices offered → alternative question.","Unexplained wealth + living costs − known income → net worth method.","Leading-digit distribution on invoice amounts → Benford's Law.","Examiner asked if defendant is 'guilty' → improper; opine only within expertise.","Pattern of racketeering → RICO; whistleblower sues for the government → qui tam/FCA."]},{"eye":"Examiner's eye: if you remember nothing else from Section 2 — predication before you start, general-to-specific, least-to-most-culpable, preserve chain of custody, and never declare guilt."}]},"t21":{"sec":"s3","title":"Understanding financial crime & criminology","day":18,"body":[{"h":"Definitions"},{"ul":["<strong>White-collar crime</strong> (Sutherland) — crime by a person of respectability and high social status in the course of their occupation.","<strong>Occupational fraud</strong> — using one's occupation for personal enrichment by misusing the employer's resources.","<strong>Organizational crime</strong> — offences committed by/for the organization itself."]},{"h":"The Fraud Triangle (Cressey) — the foundation of the whole exam"},{"key":"<strong>Pressure</strong> (a non-shareable financial problem) + <strong>Opportunity</strong> (a way to commit and conceal) + <strong>Rationalization</strong> (justifying it). Remove any leg and fraud is less likely. This is the single most-tested concept."},{"h":"Extensions"},{"ul":["<strong>Fraud Diamond</strong> — adds <strong>Capability</strong> (the person's position/skills/confidence to pull it off).","<strong>Fraud Scale</strong> (Albrecht) — pressure, opportunity, personal integrity.","<strong>Differential association</strong> (Sutherland) — fraud is <em>learned</em> behaviour, including its techniques and rationalizations, through association with others."]},{"h":"Occupational-fraud data (Report to the Nations)"},{"p":"By frequency/cost: <strong>asset misappropriation</strong> (most frequent, lowest median loss) → <strong>corruption</strong> → <strong>financial statement fraud</strong> (least frequent, highest median loss). <strong>Tips are the #1 detection method.</strong> Longer schemes and higher perpetrator authority drive larger losses."},{"case":"<strong>The trusted controller:</strong> a 20-year controller with gambling debts (pressure), sole control of payments and reconciliations (opportunity), telling himself he's 'just borrowing' (rationalization), and the system knowledge to hide it (capability). All four legs — the textbook long-running, high-authority, high-loss case."},{"eye":"Examiner's eye: organizations can only really control <em>opportunity</em> — they can't fix an employee's debts or beliefs. That's why segregation of duties and monitoring matter so much: they attack the one leg you can remove."}]},"t21b":{"sec":"s3","title":"Detection reality: tips, hotlines & the numbers","day":19,"body":[{"h":"How fraud is actually caught"},{"key":"<strong>Tips are consistently the #1 detection method</strong> — well ahead of internal audit or external audit. Many tips come from employees, which is why a <strong>reporting hotline</strong> is one of the most effective anti-fraud controls: organizations with hotlines detect fraud <strong>faster</strong> and suffer <strong>lower losses</strong>."},{"p":"This reframes prevention: the cheapest high-impact control is usually a well-run, well-publicised, anonymous reporting channel — not another layer of audit."},{"case":"<strong>Hospitality chain:</strong> after launching an anonymous multilingual hotline with poster campaigns in back-of-house areas, a regional manager's kickback scheme surfaces within weeks via a line cook's tip — something three years of audits had missed."},{"eye":"Examiner's eye: a hotline only works if staff trust it. Anonymity, non-retaliation, multiple channels (phone/web), and visible follow-through are what convert awareness into usable tips."}]},"t22":{"sec":"s3","title":"Corporate governance & management's responsibilities","day":20,"body":[{"h":"Who governs"},{"ul":["Board (especially <strong>independent directors</strong> and the <strong>audit committee</strong>), management, internal & external auditors, regulators, shareholders.","The <strong>audit committee</strong> oversees financial reporting, internal control, and the external auditor — a key anti-fraud governance body."]},{"h":"Management's fraud-related duties"},{"key":"<strong>Management — not the auditors — is primarily responsible</strong> for designing and maintaining internal controls and for preventing and detecting fraud. (So 'external auditors bear primary responsibility for controls' is FALSE.) Management also owns an effective compliance & ethics program and document-retention policies."},{"h":"Tone at the top"},{"p":"<strong>Tone at the top</strong> is the ethical climate leadership sets by example and messaging. A weak tone is the strongest cultural fraud-risk factor — controls underneath a corrupt leadership rarely hold."},{"case":"<strong>The override case:</strong> a company has textbook controls on paper, but a dominant CEO routinely tells staff to 'just book it, I'll explain later.' The control design is irrelevant once leadership normalises override — exactly what governance and the audit committee exist to check."},{"eye":"Examiner's eye: when assessing a control environment, watch what leaders <em>tolerate</em>, not what the policy manual says. Culture is revealed by the exceptions people are allowed to make."}]},"t23":{"sec":"s3","title":"Auditors' responsibilities & internal controls (COSO)","day":21,"body":[{"h":"Types of auditors"},{"ul":["<strong>External</strong> — opinion on the financial statements; <em>reasonable</em> (not absolute) assurance they're free of material misstatement, including from fraud.","<strong>Internal</strong> — evaluate and improve governance, risk and control; report to the audit committee.","<strong>Government</strong> — compliance and performance audits."]},{"key":"An unqualified ('clean') opinion provides <strong>reasonable, not absolute, assurance</strong>. It is <strong>not a guarantee that no fraud exists</strong> — a classic distractor."},{"h":"COSO Internal Control — five components"},{"table":[["Component","Essence"],["Control environment","Foundation: integrity, ethical values, tone at the top, governance."],["Risk assessment","Identify and analyze risks to objectives."],["Control activities","Approvals, reconciliations, segregation of duties."],["Information & communication","Capture and share relevant information."],["Monitoring activities","Ongoing and separate evaluations of control effectiveness."]]},{"key":"<strong>Five</strong> components; the <strong>control environment</strong> is the foundation. ('Fraud prosecution' is NOT a COSO component — a common trap.)"},{"h":"Control types"},{"ul":["<strong>Preventive</strong> (stop it — prior authorization, segregation of duties) vs <strong>Detective</strong> (find it — reconciliations, surprise audits, exception reports) vs <strong>Corrective</strong>.","<strong>Segregation of duties</strong> separates authorization, recording, and custody. Its absence is the most-cited control weakness."]},{"case":"<strong>Small-business reality:</strong> a 12-person firm can't fully segregate duties, so one bookkeeper authorizes, records, and reconciles. The compensating control is owner review of the bank statement <em>before</em> the bookkeeper sees it — a preventive/detective mix that attacks the opportunity leg."},{"eye":"Examiner's eye: classify a control by <em>when</em> it acts. Prior authorization stops the payment (preventive); a reconciliation finds it afterward (detective). The exam loves this timing distinction."}]},"t24":{"sec":"s3","title":"Fraud risk assessment, risk management, ethics & the CFE Code","day":22,"body":[{"h":"Fraud risk assessment (FRA)"},{"key":"Assess <strong>inherent</strong> risk first (before controls), then apply mitigating controls to reach <strong>residual</strong> risk. Prioritize by <strong>likelihood × significance (impact)</strong>. An FRA is <strong>periodic and ongoing</strong> — not a one-time checkbox — and must respond to changes in the business."},{"h":"Fraud risk management & third parties"},{"ul":["COSO/ACFE principles: governance, risk assessment, prevention & detection controls, investigation & corrective action, monitoring.","<strong>Third-party fraud risk</strong> — vendor/customer due diligence, ongoing monitoring, contractual audit rights (your VendorRecon / DMA-scoring domain).","Most effective controls per ACFE: reporting hotlines, anti-fraud training, code of conduct, proactive data monitoring."]},{"h":"Ethics & the ACFE / CFE Code"},{"key":"Two Code duties tested almost every sitting: (1) a member shall <strong>never express an opinion on the legal guilt or innocence</strong> of any person; (2) a member shall obtain evidence providing a <strong>reasonable basis</strong> for any opinion rendered. Also: maintain confidentiality, avoid undisclosed conflicts, and remember that <strong>legal does not always mean ethical</strong>."},{"case":"<strong>Vendor onboarding:</strong> a procurement team scores new suppliers on red flags (shell-company markers, PO-box addresses, name-match to employees) before approval — an FRA applied to third-party risk, attacking opportunity before a single invoice is paid."},{"eye":"Examiner's eye: an FRA that's filed and forgotten is worse than none — it creates false comfort. The value is in the refresh: new products, new vendors, new systems each open new fraud paths."}]},"t25":{"sec":"s3","title":"Fraud prevention programs & professional ethics","day":22,"body":[{"h":"What an effective program contains"},{"ul":["<strong>Proactive elements:</strong> anti-fraud policy, code of conduct, ethics training, hotlines/whistleblower mechanisms, surprise audits, proactive data monitoring, a positive work environment.","Detection-by-tip dominance is why <strong>hotlines</strong> are emphasised — they speed detection and cut losses."]},{"h":"Ethics for fraud examiners"},{"p":"Distinguish morality, ethics, and legality — an act can be <strong>legal yet unethical</strong>. Apply professional skepticism and objectivity; avoid undisclosed conflicts of interest; hold to standards beyond the legal minimum."},{"eye":"Examiner's eye: prevention isn't one control — it's a system where tone, training, hotlines, and monitoring reinforce each other. Any single control fails; the layered program is what deters."}]},"g1":{"sec":"s1","title":"Theft of data & intellectual property","day":26,"body":[{"h":"The essentials"},{"p":"<strong>Competitive intelligence</strong> is the <em>lawful</em> collection and analysis of public information about competitors. <strong>Espionage</strong> is obtaining that information through <em>illegal or unethical</em> means. The line is the <em>method</em>, not the information. Reading a rival's public filings, patents, job ads, and trade-show handouts is intelligence. Bribing their engineer, hacking their server, or lying about who you are to get it is espionage."},{"p":"A <strong>trade secret</strong> must satisfy three tests: it has <em>independent economic value</em> from not being generally known, it is <em>not readily ascertainable</em> by proper means, and the owner took <strong>reasonable measures to keep it secret</strong>. That third element is the one companies fail — and the one exam questions hinge on. If the owner left it unprotected, it is not a trade secret at law, however valuable it was."},{"key":"Trade secret = economic value from secrecy + not readily ascertainable + reasonable protective measures. Fail any one and the claim dies."},{"h":"How information is actually lost"},{"ul":["<strong>Insiders</strong> — the largest single source. Departing employees taking client lists, source code, formulas.","<strong>Social engineering</strong> — pretexting a receptionist or help desk into disclosure.","<strong>Physical</strong> — dumpster diving, stolen laptops, unattended documents, shoulder surfing.","<strong>Electronic</strong> — network intrusion, malware, unsecured cloud storage, USB exfiltration.","<strong>Open sources</strong> — an aggregation of individually harmless public facts that together reveal a secret.","<strong>Surveillance</strong> — wiretapping, hidden recorders, telephoto photography of a plant."]},{"p":"<strong>Favourite targets</strong> of intelligence professionals are not the executives. They are the people with access but without security training: salespeople (who love to talk about the pipeline), engineers at conferences, secretaries and admin staff, and — above all — <em>disgruntled or departing employees</em>."},{"case":"<strong>Case file — the resignation that wasn't sudden.</strong> A polymer firm's lead chemist resigns on a Friday and joins a rival on Monday. IT review shows that over the preceding eleven weeks he ran unusually large after-hours file transfers to a personal cloud account, and printed the master formula binder twice. Nothing was stolen physically. The forensic tell is <em>the ramp-up before the resignation</em> — data exfiltration is almost always visible in the 60–90 days preceding a departure, which is exactly why exit procedures that begin on the last day are useless. Note the firm's exposure: had it never required NDAs or marked the formula confidential, it would have no trade-secret claim at all, no matter how obvious the theft."},{"h":"Prevention & detection"},{"ul":["Non-disclosure and non-compete agreements at <em>hire</em>, re-acknowledged at exit.","Classification and marking of confidential material — this is the 'reasonable measures' evidence.","Need-to-know access control; log and alert on bulk downloads.","Exit interviews that ask directly about retained materials and return of devices.","Electronic countersurveillance sweeps for bugs in sensitive meeting rooms."]},{"eye":"Examiner's eye: if the question asks whether an act was espionage or legitimate intelligence, ignore how valuable the information was and look only at <em>how it was obtained</em>. Deception, trespass, bribery, or interception = espionage. Public sources, however cleverly aggregated = intelligence, and lawful."}]},"g2":{"sec":"s1","title":"Identity theft","day":27,"body":[{"h":"The essentials"},{"p":"Identity theft is the wrongful obtaining and use of another person's <strong>identifying information</strong> for fraud. It is best understood in two stages: (1) <em>acquisition</em> of the data, and (2) <em>use</em> of it. Exam questions almost always test which stage a described act belongs to, and which <em>type</em> of scheme it became."},{"h":"Types of identity theft — memorise the distinctions"},{"ul":["<strong>Financial identity theft</strong> — using the identity to obtain credit, goods, or services. The most common.","<strong>Criminal identity theft</strong> — giving the victim's name to police on arrest. The victim discovers it via a warrant or a failed background check.","<strong>Identity cloning</strong> — the thief <em>lives</em> as the victim, assuming the identity wholesale rather than monetising it once.","<strong>Medical identity theft</strong> — using the identity to obtain treatment or drugs. Uniquely dangerous because it corrupts the victim's <em>medical record</em>.","<strong>Synthetic identity theft</strong> — a <em>fabricated</em> identity built from real fragments (often a real but unused SSN combined with a false name and DOB). No single victim complains, so it survives far longer.","<strong>Child identity theft</strong> — a minor's clean, unmonitored identity; typically undiscovered for years, until the child first applies for credit."]},{"key":"Synthetic identity theft is the highest-growth and hardest-to-detect variety precisely because there is <em>no natural victim</em> to raise the alarm. Traditional identity theft has a person who notices; synthetic has none."},{"h":"How the data is stolen"},{"ul":["<strong>Phishing</strong> (mass email), <strong>spear phishing</strong> (targeted at a named individual), <strong>vishing</strong> (voice), <strong>smishing</strong> (SMS).","<strong>Pretexting</strong> — a fabricated scenario to extract data ('I'm from your bank's fraud team').","<strong>Skimming</strong> — a card-reading device on an ATM or POS terminal (distinguish this from cash-receipts skimming — the exam will try this trap).","<strong>Dumpster diving</strong>, <strong>mail theft</strong>, <strong>shoulder surfing</strong>.","<strong>Data breaches</strong> and insider theft of customer databases.","<strong>Pharming</strong> — DNS redirection to a spoofed site even though the victim typed the correct address."]},{"case":"<strong>Case file — the mortgage that belonged to nobody.</strong> A lender's fraud unit finds a borrower with a thin but clean file: valid SSN, three years of credit history, a modest card paid perfectly, no derogatory marks — and no employment that can be verified beyond a single pay stub. The SSN traces to a child. This is a <em>synthetic</em> identity in the 'nurturing' phase: the fraudster built credit patiently for years, then applied for a large loan intending to <strong>bust out</strong> — max every line and vanish. The red flag was never a bad record; it was an <em>implausibly thin but perfect</em> one, with no verifiable physical footprint."},{"h":"Response — the correct order"},{"ul":["Place a <strong>fraud alert</strong> / freeze with the credit bureaus.","Report to the relevant national authority and obtain a report — this is what creditors require.","File a police report.","Notify affected creditors <em>in writing</em>; close and reissue compromised accounts.","Retain copies of every communication."]},{"eye":"Examiner's eye: 'skimming' means two entirely different things in this manual. In cash receipts it is <em>off-book theft before recording</em>. In identity theft it is a <em>card-data capture device</em>. Read the surrounding facts, not the word."}]},"g3":{"sec":"s1","title":"Financial institution fraud","day":28,"body":[{"h":"The essentials"},{"p":"This chapter is your professional home ground, but the exam frames it in US/international terms. Learn the ACFE's <em>names</em> for schemes you already investigate daily."},{"h":"Embezzlement & insider schemes"},{"ul":["<strong>False accounting entries</strong> — debiting a customer account, crediting the insider's.","<strong>Unauthorised withdrawals</strong> and <strong>unauthorised disbursement of funds to outsiders</strong>.","<strong>Paying personal expenses from bank funds</strong>; <strong>theft of physical property</strong>.","<strong>Moving money to shell/suspense accounts</strong>, then out."]},{"h":"Loan fraud — the highest-yield block"},{"ul":["<strong>Loans to non-existent borrowers</strong> — fictitious loan proceeds taken by the insider.","<strong>Sham loans with kickbacks</strong>; <strong>linked financing</strong> (loan proceeds cycle back to buy the lender's own stock or property at inflated value).","<strong>Double-pledging collateral</strong> — the same asset secures multiple loans at different lenders.","<strong>Reciprocal loan arrangements</strong> — two insiders at different banks lend to each other's interests to conceal.","<strong>Daisy chain</strong> — a group passes an asset among themselves at escalating prices to inflate value before pledging.","<strong>Construction loan fraud</strong> — draws requested for work not performed; overstated percentage of completion.","<strong>Credit-data blocking / false loan applications</strong> — falsified income, employment, or asset documentation."]},{"key":"<strong>Linked financing</strong>: large deposits are offered to a bank <em>on condition</em> that it makes a loan to a designated party. The deposit is the bait; the bad loan is the payoff."},{"h":"Real estate fraud"},{"ul":["<strong>Appraisal fraud</strong> — inflated valuation to support an oversized loan. (Your ValuGuard territory.)","<strong>Air loans</strong> — no property, no borrower, no collateral. Pure fabrication.","<strong>Property flipping</strong> — buy, fraudulently appraise high, resell quickly to a straw buyer.","<strong>Straw buyer</strong> — a person who lends their name and credit for a fee; the true purchaser stays hidden.","<strong>Equity skimming</strong> — take title, collect rents, never service the mortgage, let it foreclose.","<strong>Fraudulent foreclosure rescue</strong> — a distressed owner is induced to sign over title."]},{"h":"Other institution schemes"},{"ul":["<strong>New account fraud</strong> — an account opened with a false or stolen identity, used to deposit stolen or counterfeit instruments.","<strong>Advance-fee fraud</strong> — a fee demanded for a loan or windfall that never arrives.","<strong>Letter-of-credit fraud</strong> — forged or fictitious LCs, or presentation of falsified shipping documents.","<strong>Wire transfer fraud</strong> — dishonest bank employee, false authorisation, or intercepted instructions.","<strong>Account takeover</strong> — an existing legitimate account seized via credential theft.","<strong>Inside/outside frauds</strong> — an employee colluding with an outsider; the classic and hardest case."]},{"case":"<strong>Case file — the daisy chain.</strong> Four related parties buy a warehouse for 400,000, then sell it among themselves in three quick arm's-length-looking transactions at 700,000, 1.1m, and 1.6m. The last owner pledges it to a bank as collateral for a 1.3m loan, using the most recent sale as the comparable. The bank's appraiser saw a genuine recent sale at 1.6m and had no reason to doubt it. The tell was never the appraisal — it was the <em>transaction velocity between related parties with no improvement to the asset</em>. Value cannot quadruple in six months with no capital works. Always trace the chain of title, not just the last price."},{"eye":"Examiner's eye: distinguish <em>who</em> is defrauding <em>whom</em>. Embezzlement = insider steals <em>from</em> the bank. Loan fraud = borrower (or insider colluding) obtains funds the bank would not otherwise lend. New-account and advance-fee = outsiders using the bank as an instrument. The scheme name follows the direction of the theft."}]},"g4":{"sec":"s1","title":"Securities fraud","day":29,"body":[{"h":"The essentials"},{"p":"A <strong>security</strong> is broader than 'a share'. Under the classic <em>Howey</em> test, an investment contract exists where there is (1) an <strong>investment of money</strong>, (2) in a <strong>common enterprise</strong>, (3) with an <strong>expectation of profits</strong>, (4) derived <strong>predominantly from the efforts of others</strong>. That last element is decisive: if the investor's own labour drives the return, it is not a security."},{"key":"Howey: money + common enterprise + expectation of profit + profits from the efforts of OTHERS. The orange grove sold with a management contract was a security; the grove sold alone was not."},{"h":"The scheme catalogue"},{"ul":["<strong>Ponzi scheme</strong> — earlier investors paid from <em>later investors' principal</em>. There is no real underlying investment. It collapses when redemptions exceed new money.","<strong>Pyramid scheme</strong> — returns come from <em>recruiting</em>. Distinguish from a lawful MLM: a pyramid's compensation is driven by recruitment, not by retail sale of a real product to end users.","<strong>Pump and dump</strong> — accumulate a thinly traded stock, hype it (spam, boiler room, false press), sell into the retail buying, price collapses.","<strong>Insider trading</strong> — trading on <em>material, non-public</em> information in breach of a duty. Both elements matter: information that is non-public but immaterial, or material but public, is not enough.","<strong>Churning</strong> — a broker over-trades a client's account to generate commissions. Requires control over the account plus excessive trading given the client's objectives.","<strong>Front running</strong> — the broker trades ahead of a large client order it knows is coming.","<strong>Boiler room</strong> — high-pressure telephone sales of dubious or non-existent securities.","<strong>Unsuitable recommendations</strong> — a product mismatched to the client's risk profile, age, or objectives."]},{"case":"<strong>Case file — Ponzi or pyramid?</strong> A promoter sells 'agricultural bonds' promising 3% monthly. Investors receive their 3% for fourteen months. No farm exists; each payment comes from new subscriptions. This is a <strong>Ponzi</strong> — the investor is <em>passive</em> and paid from later principal. Change one fact: investors are told they must each enrol two more investors to qualify for payouts. Now it is a <strong>pyramid</strong> — return depends on <em>recruitment by the investor</em>. The money mechanics look identical; the classification turns on <em>where the return is said to come from</em>."},{"h":"Red flags"},{"ul":["Consistent, smooth returns regardless of market conditions — real markets are not smooth.","Returns well above market with claimed low risk.","Secrecy about strategy, or a strategy 'too complex to explain'.","Difficulty withdrawing; pressure to reinvest.","Unregistered products, unlicensed sellers, self-custody of assets, no independent auditor."]},{"eye":"Examiner's eye: Ponzi = passive investors paid from later investors' <em>principal</em>. Pyramid = investors paid for <em>recruiting</em>. Both are unsustainable, but the exam wants the mechanism, not the outcome."}]},"g5":{"sec":"s1","title":"Payment fraud: cheques, cards & e-payments","day":30,"body":[{"h":"Cheque fraud"},{"ul":["<strong>Forged maker</strong> — the <em>signature of the drawer</em> is forged. The cheque is stolen blank and signed.","<strong>Forged endorsement</strong> — a genuine cheque, made out to a real payee, is stolen and the <em>payee's</em> endorsement is forged.","<strong>Altered cheque</strong> — a genuine, properly signed cheque whose <em>payee or amount</em> has been changed.","<strong>Counterfeit cheque</strong> — the instrument itself is fabricated.","<strong>Cheque kiting</strong> — exploiting the <em>float</em> between two or more accounts at different banks, writing cheques against uncollected funds to create fictitious balances.","<strong>Cheque tampering</strong> — an <em>employee</em> converting the employer's own cheques (this is the fraudulent-disbursement scheme from your earlier study — note it appears in both chapters)."]},{"key":"Forged maker = the <em>drawer's</em> signature is fake. Forged endorsement = the <em>payee's</em> signature is fake, and the cheque itself was genuine. This single distinction is tested almost every sitting."},{"h":"Cheque kiting — how to spot it"},{"ul":["Frequent deposits and withdrawals with nearly identical amounts.","A pattern of deposits from, and withdrawals to, <em>the same set of accounts</em> at other banks.","Heavy activity in a low-balance account; frequent enquiries about the available balance.","A rising volume of deposited items drawn on the account holder's own other accounts.","The classic mathematical tell: <em>average daily float greatly exceeds average ledger balance</em>."]},{"h":"Payment card fraud"},{"ul":["<strong>Counterfeit / cloned</strong> cards from skimmed track data.","<strong>Card-not-present (CNP)</strong> — online or phone use of stolen numbers. Now the dominant form.","<strong>Lost / stolen</strong> card use; <strong>never-received issue (NRI)</strong> — intercepted in the mail.","<strong>Account takeover</strong> — the fraudster changes the address, then reports the card lost and has a replacement sent.","<strong>Bust-out</strong> — build a good payment record, then max all lines and disappear.","<strong>Merchant / factoring fraud</strong> — a complicit merchant processes fraudulent charges, or launders another merchant's transactions through its own account.","<strong>Carding</strong> — testing stolen numbers with small transactions before a large one."]},{"h":"E-payments & alternative currencies"},{"ul":["<strong>Business email compromise (BEC)</strong> — spoofed or hijacked email directing a payment to a fraudster's account. Test: was the <em>account detail change</em> verified out-of-band?","<strong>P2P payment fraud</strong> — irrevocable transfers induced by deception; no chargeback rights.","<strong>Cryptocurrency</strong> — pseudonymous, irreversible, and cross-border, which is why it is a laundering and ransom vector. Note it is <em>pseudonymous, not anonymous</em>: the blockchain is a permanent public ledger and is traceable at the on/off ramps."]},{"case":"<strong>Case file — the kite that flew for nine months.</strong> A small distributor holds accounts at Bank A and Bank B. Each Monday it deposits a 90,000 cheque drawn on B into A, and on Tuesday a 95,000 cheque drawn on A into B — each covering the other, each slightly larger. Neither account ever holds real money; the balances are pure float. It collapsed only when Bank A shortened its clearing window by one day. The detection signal was available for months: <em>deposits and withdrawals in matched pairs, between the same two accounts, with amounts escalating</em>. No single transaction looked wrong."},{"eye":"Examiner's eye: kiting <em>creates value out of float</em> — the fraud is the timing gap, not the instrument. If the fact pattern involves two banks and matched round-trip cheques, it is kiting, whatever else it is dressed as."}]},"g6":{"sec":"s1","title":"Insurance fraud","day":31,"body":[{"h":"The essentials"},{"p":"Classify insurance fraud by <em>who</em> commits it. The exam's answer options are usually built along this axis: the <strong>policyholder/claimant</strong>, the <strong>agent/broker</strong>, the <strong>insurer itself</strong>, or an <strong>internal employee</strong>."},{"h":"Agent & broker fraud"},{"ul":["<strong>Premium diversion</strong> — the agent collects premium and never remits it to the insurer. The most common agent fraud; the insured discovers it only on making a claim and finding no policy.","<strong>Fictitious payees / phantom policies</strong> — policies written on non-existent people to earn commission.","<strong>Churning</strong> — inducing replacement of policies to generate fresh commissions, to the client's detriment.","<strong>Sliding</strong> — adding coverage the client did not ask for and did not knowingly agree to.","<strong>Twisting</strong> — misrepresenting facts to persuade a client to switch insurers.","<strong>Fraudulent underwriting</strong> — misstating risk facts on the application to secure a lower premium."]},{"key":"Churning = replacing a policy <em>within</em> the same insurer for commission. Twisting = inducing a switch <em>to another</em> insurer by misrepresentation. Sliding = charging for coverage the client never agreed to."},{"h":"Claimant fraud by line of business"},{"ul":["<strong>Vehicle</strong> — <em>staged accidents</em> (deliberate collisions, often with a 'swoop and squat' set-up), <em>owner give-ups</em> (the owner arranges the theft or destruction of their own vehicle), inflated repair estimates, phantom passengers claiming injury.","<strong>Property</strong> — arson for profit (look for over-insurance, financial distress, removal of valuables before the fire), inflated inventories of destroyed contents, claims for items never owned.","<strong>Life</strong> — <em>false death claims</em> (faked death, or 'pseudocide'), murder for proceeds, <em>fraudulent applications</em> concealing terminal illness, forged beneficiary changes.","<strong>Liability</strong> — slip-and-fall staging, exaggerated soft-tissue injury (hard to disprove, hence popular).","<strong>Workers' compensation</strong> — <strong>this is the big one for the exam</strong> (see below)."]},{"h":"Workers' compensation fraud — know these four"},{"ul":["<strong>Premium fraud (by the employer)</strong> — understating payroll, misclassifying employees into lower-risk categories, or misrepresenting the claims history to reduce premium.","<strong>Claimant fraud</strong> — a non-existent injury, an injury sustained <em>off the job</em> reported as work-related, or malingering long after recovery.","<strong>Organised fraud</strong> — a ring of a lawyer, a doctor (a 'capper' or 'runner' recruits claimants), and the claimant, generating fabricated medical bills.","<strong>Agent fraud</strong> — collecting premium for a policy never placed."]},{"case":"<strong>Case file — the fire that told on itself.</strong> A struggling furniture retailer suffers a total-loss fire on a Sunday night. Red flags stack: the policy limit was <em>doubled eleven weeks earlier</em>; the business had three months of unpaid suppliers; the fire began in two separate, unconnected points (a physical impossibility for an accident); and the CCTV recorder — which the owner insisted was 'always on' — was removed the previous Friday. Note the pattern: <em>motive (distress) + opportunity (recent over-insurance) + physical evidence inconsistent with accident</em>. Arson-for-profit cases are almost always proven on the <em>financial</em> record, not the fire scene."},{"h":"Detection"},{"ul":["Claim filed shortly after policy inception or after a limit increase.","Claimant is over-eager to settle, or unusually familiar with claims terminology and procedure.","No police or fire report where one would be expected; pressure against involving authorities.","Injuries that are subjective and unverifiable; the same doctor/lawyer recurring across unrelated claims.","Post-dated or backdated documents; receipts that are too neat, sequential, or from a single source."]},{"eye":"Examiner's eye: 'the claim came shortly after a coverage increase' and 'the same medical provider appears on unrelated claims' are the two facts the ACFE plants most often. When you see either, the answer is an organised or premeditated scheme, not opportunism."}]},"g7":{"sec":"s1","title":"Health care fraud","day":32,"body":[{"h":"The essentials"},{"p":"Health care fraud is largely a <strong>billing</strong> fraud. The service is the cover; the claim form is the instrument. Classify by actor: <em>provider</em>, <em>medical staff</em>, <em>institution</em>, <em>patient</em>, <em>insurer</em>, or <em>employee/agent</em>."},{"h":"Provider billing schemes — learn these names exactly"},{"ul":["<strong>Upcoding</strong> — billing for a <em>more expensive</em> procedure or a higher level of service than was actually performed. The single most tested term in this chapter.","<strong>Unbundling (fragmentation)</strong> — splitting one bundled procedure into its component parts and billing each separately, to collect more than the bundled rate.","<strong>Phantom billing / billing for services not rendered</strong> — the service never happened at all.","<strong>Duplicate billing</strong> — the same service billed twice, or to two payers.","<strong>Overutilisation</strong> — medically unnecessary services, tests, or admissions performed to generate billings.","<strong>Ping-ponging</strong> — referring a patient among several practitioners in the same clinic, each billing a consultation.","<strong>Gang visits / family ganging</strong> — billing for services to multiple family members when only one was seen, or a nursing-home 'round' billed as individual visits.","<strong>Steering</strong> — pushing patients toward an entity in which the provider has an undisclosed interest (self-referral).","<strong>DRG creep</strong> — an institution systematically coding admissions into higher-reimbursing diagnosis groups."]},{"key":"<strong>Upcoding</strong> = charging for a <em>bigger</em> service than performed. <strong>Unbundling</strong> = charging <em>separately</em> for parts of one service. Both inflate the claim, but the mechanism differs — and the exam will offer both as options."},{"h":"Kickbacks & self-referral"},{"p":"Kickbacks in health care are structurally identical to the corruption schemes you already know, but the payer is a reimbursement system rather than a purchaser. Watch for: payments for patient referrals; 'consulting' or 'medical director' fees far above fair market value; free or below-cost rent or equipment; sham research grants; and waiver of patient co-payments (which removes the patient's only price signal and is itself an inducement)."},{"h":"Fraud by other actors"},{"ul":["<strong>Patient</strong> — doctor shopping for prescriptions, lending an insurance card, staging or exaggerating injury, forging prescriptions.","<strong>Institution</strong> — cost-report fraud (padding allowable costs), false certifications of medical necessity, fraud in special-care facilities (billing for care not given to residents who cannot complain).","<strong>Insurer</strong> — selling non-existent or unlicensed health plans, wrongful and systematic claim denial, failing to remit premiums.","<strong>Employee claims fraud</strong> — false claims filed by employees under a group plan.","<strong>Electronic claims fraud</strong> — automated submission of fraudulent claims at volume; a single compromised provider ID can generate thousands."]},{"case":"<strong>Case file — fifteen-minute days.</strong> An audit of a physician's claims shows he billed a mean of 14.2 hours of face-to-face patient contact per working day, including a Tuesday on which the claim data implies 26 hours. No individual claim was implausible; each described an ordinary consultation at an ordinary rate. The fraud was invisible at the transaction level and obvious in the <em>aggregate</em>. This is why health care fraud is a <strong>data-analytics</strong> discipline:
