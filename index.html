oductory → informational → closing → admission-seeking"],"a":0,"e":"Proper order: <strong>Introductory → Informational → Closing → Assessment → Admission-seeking</strong>. The last two are used only when warranted."},"s2n17":{"sec":"s2","t":"“You were in the vault on the night of the 4th, weren’t you?” is an example of which question type?","o":["Open question","Leading question","Assessment question","Introductory question"],"a":1,"e":"A question that suggests its own answer is a <strong>leading question</strong>, used mainly to confirm facts already known."},"s2n18":{"sec":"s2","t":"An admission-seeking interview is appropriate ONLY when:","o":["The subject asks for it","There is reasonable certainty of the subject’s guilt","No other witnesses are available","The auditor recommends it"],"a":1,"e":"Admission-seeking interviews require <strong>reasonable certainty of guilt</strong>, conducted privately by an interviewer of suitable standing. They are never the opening move."},"s2n19":{"sec":"s2","t":"In an admission-seeking interview, the examiner offers: “Did you take the money to cover your daughter’s medical bills, or was it just to keep up with expenses?” This technique is the:","o":["Benchmark admission","Alternative question","Direct accusation","Diffusing of alibis"],"a":1,"e":"Presenting two incriminating choices (one more face-saving) to move the subject toward admitting is the <strong>alternative question</strong>."},"s2n20":{"sec":"s2","t":"When a guilty subject begins to voice a denial during an admission-seeking interview, the skilled interviewer should:","o":["Allow the denial to be fully and firmly stated","Interrupt and delay the denial before it hardens","Immediately end the interview","Threaten prosecution"],"a":1,"e":"Interviewers <strong>interrupt denials</strong> before they entrench, because a firmly voiced denial is psychologically harder for the subject to later retract."},"s2n21":{"sec":"s2","t":"A signed confession statement should include all of the following EXCEPT:","o":["The approximate dates and amounts","An acknowledgment that it was made voluntarily","A promise by the examiner that the subject won’t be prosecuted","The subject’s own description of the act and intent"],"a":2,"e":"Examiners must <strong>never promise non-prosecution or leniency</strong> — it can void the confession and is beyond their authority. Valid statements use the subject’s own words, with dates, amounts, intent, and a voluntariness acknowledgment."},"s2n22":{"sec":"s2","t":"An examiner reconstructs a subject’s income by computing: increase in net worth + living expenses − funds from known legitimate sources. This is the:","o":["Bank deposits method","Net worth method","Percentage markup method","Source and application of funds ratio"],"a":1,"e":"That formula is the <strong>net worth method</strong> — the headline indirect tracing technique for inferring unreported/illicit income."},"s2n23":{"sec":"s2","t":"Under Benford’s Law, the leading digit 1 is expected approximately how often in a large set of natural numbers?","o":["About 11%","About 30%","About 5%","About 50%"],"a":1,"e":"Leading digit 1 appears about <strong>30.1%</strong> of the time, declining to ~4.6% for 9. Big departures from this curve can flag manipulation."},"s2n24":{"sec":"s2","t":"On cross-examination, a fraud examiner serving as an expert should:","o":["Advocate forcefully for the side that retained her","Offer an opinion on the defendant’s legal guilt","Stay within her expertise and concede points that are genuinely true","Refuse to answer difficult questions"],"a":2,"e":"An expert remains <strong>objective, stays within expertise, and concedes what is true</strong>. She must <em>not</em> opine on legal guilt/innocence or act as an advocate."},"s2n25":{"sec":"s2","t":"A fraud examination report should:","o":["State a legal conclusion that the suspect is guilty","Present facts and findings impartially, avoiding opinions on guilt","Omit any evidence favorable to the suspect","Use persuasive, emotionally charged language"],"a":1,"e":"Reports must be <strong>accurate, impartial, and fact-based</strong>, must not opine on guilt, and must not omit exculpatory evidence. They have to withstand scrutiny in court."},"s2n26":{"sec":"s2","t":"Civil and criminal proceedings arising from the same fraudulent conduct run at the same time. These are:","o":["Double jeopardy","Parallel proceedings","Class actions","Interlocutory appeals"],"a":1,"e":"<strong>Parallel proceedings</strong> require careful coordination (self-incrimination exposure, discovery conflicts, timing)."},"s2n27":{"sec":"s2","t":"To best preserve attorney-client privilege and work-product protection over an internal investigation, the examiner should:","o":["Publish interim findings to all staff","Conduct the work at the direction of legal counsel","Share working papers with the suspect","Avoid documenting anything"],"a":1,"e":"Running the investigation <strong>at the direction of counsel</strong> supports privilege and work-product claims over investigative materials."},"s2n28":{"sec":"s2","t":"TRUE or FALSE: Most fraud cases can be proven only with direct evidence; circumstantial evidence is generally inadmissible.","o":["True","False"],"a":1,"e":"<strong>False.</strong> Most fraud cases are built largely on <em>circumstantial</em> evidence, which is fully admissible. Fraud is usually concealed, so direct evidence is rare."},"s2n29":{"sec":"s2","t":"Which is a legitimate purpose of the introductory phase of an interview?","o":["Accusing the subject of the fraud","Establishing rapport and a basis for the interview, and seeking a commitment to cooperate","Obtaining a signed confession","Presenting the alternative question"],"a":1,"e":"The <strong>introductory</strong> phase establishes rapport, provides a reason for the interview, and secures cooperation — it does not accuse or seek admissions."},"s2n30":{"sec":"s2","t":"Before launching a covert operation, the examiner should FIRST:","o":["Notify the suspect","Commit the basis and objectives of the operation to a written memorandum","Promise immunity to informants","Skip predication to preserve secrecy"],"a":1,"e":"A covert operation must rest on <strong>adequate predication and a written memorandum</strong> stating its basis, expected information, and known suspects. Predication is never skipped."},"s3n1":{"sec":"s3","t":"Donald Cressey’s research produced which model, and what are its three legs?","o":["Fraud Diamond — pressure, opportunity, capability","Fraud Triangle — pressure, opportunity, rationalization","Fraud Scale — pressure, opportunity, integrity","Routine activity — offender, target, guardian"],"a":1,"e":"Cressey gave us the <strong>Fraud Triangle: pressure (a non-shareable financial problem) + opportunity + rationalization</strong>. It is the single most-tested concept on the exam."},"s3n2":{"sec":"s3","t":"Which element does the Fraud Diamond add to the Fraud Triangle?","o":["Greed","Capability","Collusion","Concealment"],"a":1,"e":"The <strong>Fraud Diamond adds capability</strong> — the individual’s position, skills, and confidence to commit and conceal the act."},"s3n3":{"sec":"s3","t":"Edwin Sutherland is credited with defining which concept?","o":["Occupational fraud","White-collar crime","The fraud triangle","Routine activity theory"],"a":1,"e":"Sutherland coined <strong>white-collar crime</strong>: crime committed by a person of respectability and high social status in the course of their occupation."},"s3n4":{"sec":"s3","t":"Per the ACFE’s Report to the Nations, occupational fraud is MOST often initially detected by:","o":["External audit","Tips","Management review","Law enforcement notification"],"a":1,"e":"<strong>Tips</strong> are consistently the leading detection method, which is why reporting hotlines rank among the most effective anti-fraud controls."},"s3n5":{"sec":"s3","t":"TRUE or FALSE: External auditors, not management, bear primary responsibility for designing and maintaining a company’s internal controls.","o":["True","False"],"a":1,"e":"<strong>False.</strong> <strong>Management</strong> owns the design and operation of internal controls and is primarily responsible for preventing and detecting fraud. Auditors provide assurance, not the controls."},"s3n6":{"sec":"s3","t":"Which governance body has direct oversight of financial reporting, internal control, and the relationship with the external auditor?","o":["The compensation committee","The audit committee","The nominating committee","The treasury function"],"a":1,"e":"The <strong>audit committee</strong> (ideally independent directors) oversees financial-reporting integrity, internal control, and the external auditor."},"s3n7":{"sec":"s3","t":"‘Tone at the top’ is BEST described as:","o":["The number of controls in place","The ethical climate set by leadership’s example and messaging","The frequency of audits","The size of the internal audit budget"],"a":1,"e":"<strong>Tone at the top</strong> is the ethical environment leadership models. A weak tone is the strongest cultural fraud-risk factor."},"s3n8":{"sec":"s3","t":"How many components comprise the COSO Internal Control–Integrated Framework, and which is the foundation?","o":["Five components; control activities is the foundation","Five components; the control environment is the foundation","Three components; monitoring is the foundation","Seven components; risk assessment is the foundation"],"a":1,"e":"COSO has <strong>five components</strong>, and the <strong>control environment</strong> (integrity, ethics, tone at the top, governance) is the foundation for the rest."},"s3n9":{"sec":"s3","t":"Which is NOT one of the five COSO components?","o":["Risk assessment","Control activities","Fraud prosecution","Monitoring activities"],"a":2,"e":"<strong>Fraud prosecution</strong> is not a COSO component. The five are: control environment, risk assessment, control activities, information & communication, and monitoring activities."},"s3n10":{"sec":"s3","t":"Separating authorization, recording, and custody of an asset among different people is which control?","o":["Reconciliation","Segregation of duties","Independent monitoring","Risk assessment"],"a":1,"e":"<strong>Segregation of duties</strong> splits authorization, recording, and custody so no single person controls an entire transaction. Its absence is the most-cited control weakness."},"s3n11":{"sec":"s3","t":"A surprise reconciliation that detects a fraud after it has occurred is which type of control?","o":["Preventive","Detective","Corrective","Compensating"],"a":1,"e":"A control that <strong>finds</strong> a problem after the fact (reconciliations, audits, exception reports) is a <strong>detective</strong> control. Preventive controls stop it before it happens."},"s3n12":{"sec":"s3","t":"TRUE or FALSE: An unqualified (‘clean’) audit opinion guarantees the financial statements contain no fraud.","o":["True","False"],"a":1,"e":"<strong>False.</strong> An audit provides <em>reasonable</em>, not absolute, assurance. A clean opinion is not a guarantee that no fraud exists — a classic distractor."},"s3n13":{"sec":"s3","t":"In a fraud risk assessment, the risk that exists BEFORE considering any mitigating controls is called:","o":["Residual risk","Inherent risk","Detection risk","Control risk"],"a":1,"e":"<strong>Inherent risk</strong> is assessed first (before controls); after applying mitigating controls you arrive at <strong>residual risk</strong>."},"s3n14":{"sec":"s3","t":"Which two dimensions are typically combined to prioritize identified fraud risks?","o":["Cost and revenue","Likelihood and significance (impact)","Frequency and seniority","Materiality and timing"],"a":1,"e":"Fraud risks are prioritized by <strong>likelihood × significance (impact)</strong>, focusing resources on the most probable and damaging schemes."},"s3n15":{"sec":"s3","t":"All of the following are among the MOST effective anti-fraud controls in ACFE research EXCEPT:","o":["A reporting hotline","Anti-fraud training and a code of conduct","Proactive data monitoring/analysis","Eliminating the internal audit function"],"a":3,"e":"<strong>Eliminating internal audit weakens</strong> the control environment. Hotlines, training/code of conduct, and proactive data monitoring are consistently among the most effective controls."},"s3n16":{"sec":"s3","t":"Under the ACFE Code of Professional Ethics, a CFE shall:","o":["Express an opinion on legal guilt when confident","Never express an opinion on the legal guilt or innocence of any person","Accept any engagement regardless of conflicts","Withhold material findings from the client"],"a":1,"e":"A core CFE Code duty is to <strong>never express an opinion on the legal guilt or innocence</strong> of any person — that determination belongs to the trier of fact."},"s3n17":{"sec":"s3","t":"The CFE Code requires that any professional opinion rendered be supported by:","o":["The client’s instructions","A reasonable evidential basis","A majority vote of the team","The examiner’s personal conviction"],"a":1,"e":"A CFE must obtain evidence providing a <strong>reasonable basis</strong> for any opinion. Unsupported or speculative opinions breach the Code."},"s3n18":{"sec":"s3","t":"Which statement about legality and ethics is correct?","o":["If it’s legal, it’s automatically ethical","An act can be legal yet unethical","Law and ethics are identical","Only illegal acts can be unethical"],"a":1,"e":"<strong>Legal does not always mean ethical.</strong> Examiners must distinguish morality, ethics, and legality and hold to professional standards beyond the legal minimum."},"s3n19":{"sec":"s3","t":"A reporting hotline is associated with which outcomes in ACFE studies?","o":["Slower detection and higher losses","Faster detection and lower losses","No measurable effect","Higher losses but faster detection"],"a":1,"e":"Organizations with hotlines tend to detect fraud <strong>faster and with lower losses</strong>, because tips are the leading detection channel."},"s3n20":{"sec":"s3","t":"TRUE or FALSE: A fraud risk assessment should be performed once and then treated as a permanent record.","o":["True","False"],"a":1,"e":"<strong>False.</strong> An FRA must be <strong>periodic and ongoing</strong>, refreshed as the business, personnel, and risk environment change — not a one-time checkbox."},"s3n21":{"sec":"s3","t":"Differential association theory explains fraud primarily as:","o":["A purely genetic predisposition","Learned behavior acquired through interaction with others who rationalize it","A random act with no social cause","A failure of accounting software"],"a":1,"e":"<strong>Differential association</strong> (Sutherland) holds that criminal behavior, including the techniques and rationalizations, is <em>learned</em> through association with others."},"s3n22":{"sec":"s3","t":"Which control is PREVENTIVE rather than detective?","o":["Bank reconciliation","Surprise audit","Requiring authorization before a payment is made","Exception reporting after the fact"],"a":2,"e":"<strong>Requiring prior authorization</strong> stops an improper payment before it happens — a preventive control. Reconciliations, surprise audits, and exception reports detect issues after the fact."},"gq1":{"sec":"s1","t":"A firm's analyst compiles a rival's public patent filings, job postings, and trade-show handouts to deduce its next product. This is:","o":["Corporate espionage, because the conclusion was confidential","Theft of trade secrets","Misappropriation of intangible assets","Lawful competitive intelligence"],"a":3,"e":"The line between intelligence and espionage is the <strong>method</strong>, not the value of what is learned. All sources here were public and lawfully obtained. Aggregating public data into a valuable conclusion remains lawful competitive intelligence."},"gq2":{"sec":"s1","t":"A company sues a former employee for stealing its 'secret' pricing formula. The formula was stored on an open shared drive, never marked confidential, and no NDA existed. The trade-secret claim most likely fails because:","o":["The owner did not take reasonable measures to keep it secret","Pricing formulas can never be trade secrets","The employee had authorised access","The formula had no independent economic value"],"a":0,"e":"A trade secret requires three elements: independent economic value from secrecy, not readily ascertainable, and <strong>reasonable measures to maintain secrecy</strong>. The third element fails here. Value is irrelevant if the owner never protected it."},"gq3":{"sec":"s1","t":"Which is the LARGEST source of proprietary information loss for most organisations?","o":["Foreign intelligence services","Dumpster diving by competitors","Network intrusion by external hackers","Insiders, particularly departing employees"],"a":3,"e":"Insiders — especially <strong>departing or disgruntled employees</strong> — are the largest source. They already hold legitimate access, which is why exit procedures and pre-departure access monitoring matter more than perimeter security."},"gq4":{"sec":"s1","t":"An investigator reviewing a departed engineer's activity should focus on which window?","o":["The final day of employment only","The period after the employee joined the competitor","The first month of employment","The 60–90 days preceding the resignation"],"a":3,"e":"Data exfiltration almost always shows a <strong>ramp-up in the weeks before departure</strong> — bulk downloads, after-hours access, printing. Exit procedures that begin on the last day are too late to detect anything."},"gq5":{"sec":"s1","t":"A fraudster telephones a company's help desk claiming to be a senior manager locked out of his account, and persuades staff to reset the password. This is BEST described as:","o":["Pretexting (social engineering)","Pharming","A buffer overflow","Skimming"],"a":0,"e":"<strong>Pretexting</strong> is inventing a scenario or false identity to induce disclosure. It is a form of social engineering. No technical exploit was used — the vulnerability was human."},"gq6":{"sec":"s1","t":"A fraudster builds a credit profile using a real but unused national ID number combined with a fabricated name and date of birth. No real person's identity is fully assumed. This is:","o":["Medical identity theft","Criminal identity theft","Synthetic identity theft","Identity cloning"],"a":2,"e":"<strong>Synthetic identity theft</strong> fabricates an identity from real fragments plus invented details. Because no single individual is fully victimised, no one complains — making it the hardest variety to detect and the fastest-growing."},"gq7":{"sec":"s1","t":"A victim discovers the theft only when an arrest warrant is issued in her name for an offence she did not commit. This is:","o":["Child identity theft","Financial identity theft","Criminal identity theft","Synthetic identity theft"],"a":2,"e":"<strong>Criminal identity theft</strong> occurs when the thief gives the victim's identity to law enforcement upon arrest. Discovery typically comes through a warrant, a failed background check, or a licence suspension."},"gq8":{"sec":"s1","t":"Why is MEDICAL identity theft uniquely dangerous to the victim beyond financial loss?","o":["It always involves a larger monetary amount","It corrupts the victim's medical record, risking wrong treatment","It cannot be reported to authorities","It permanently destroys the victim's credit score"],"a":1,"e":"The thief's diagnoses, blood type, allergies and treatments merge into the victim's file. A future clinician may rely on <strong>corrupted medical data</strong> — a physical risk, not merely a financial one."},"gq9":{"sec":"s1","t":"Which correctly describes PHARMING?","o":["Redirecting a victim to a spoofed site even though they typed the correct address","Capturing card data at an ATM","Voice calls impersonating a bank","A mass email inviting the victim to click a link"],"a":0,"e":"<strong>Pharming</strong> poisons DNS resolution so the correct URL resolves to a fraudulent server. It defeats the standard advice to 'type the address yourself', which is why it is more dangerous than phishing."},"gq10":{"sec":"s1","t":"A bank employee debits customer accounts and credits an account she controls, disguising the entries as fee adjustments. This is:","o":["Advance-fee fraud","Embezzlement via false accounting entries","New account fraud","Loan fraud"],"a":1,"e":"An insider stealing <em>from</em> the institution using <strong>false accounting entries</strong> is embezzlement. The direction of the theft — insider taking bank/customer funds — sets the classification."},"gq11":{"sec":"s1","t":"A depositor offers a bank a large deposit on the condition that it grant a loan to a designated third party. This is:","o":["Double-pledging collateral","Reciprocal loan arrangement","Linked financing","Daisy chain"],"a":2,"e":"<strong>Linked financing</strong>: the deposit is the inducement, the improvident loan is the payoff. Distinguish from a reciprocal arrangement (two insiders at different banks lending to each other's interests)."},"gq12":{"sec":"s1","t":"Related parties sell the same warehouse among themselves three times in six months at escalating prices, then pledge it at the inflated value. This is:","o":["A straw purchase","A daisy chain","An air loan","Equity skimming"],"a":1,"e":"A <strong>daisy chain</strong> passes an asset among conspirators at rising prices to manufacture a comparable value before pledging. The tell is transaction velocity between related parties with no improvement to the asset."},"gq13":{"sec":"s1","t":"A loan is made against a property that does not exist, to a borrower who does not exist. This is:","o":["An air loan","A construction loan draw scheme","Property flipping","Equity skimming"],"a":0,"e":"An <strong>air loan</strong> has no property, no borrower and no collateral — the entire file is fabricated, often supported by a fake appraisal and a fake employer answering a real phone."},"gq14":{"sec":"s1","t":"An individual lends her name and credit to a mortgage application for a fee, while another party is the true purchaser. She is:","o":["A straw buyer","A nominee director","A capper","A money mule"],"a":0,"e":"A <strong>straw buyer</strong> allows their identity and credit to be used so the real purchaser remains concealed. Common in flipping schemes and in concealing an ineligible or disqualified true buyer."},"gq15":{"sec":"s1","t":"A party takes title to a property, collects rent from tenants, but never services the mortgage, allowing foreclosure. This is:","o":["Appraisal fraud","Linked financing","Property flipping","Equity skimming"],"a":3,"e":"<strong>Equity skimming</strong> extracts the income stream from a property while stripping the lender of its security through non-payment."},"gq16":{"sec":"s1","t":"Under the Howey test, which element is MOST often decisive in determining that an arrangement is a security?","o":["That money was invested","That profits are expected predominantly from the efforts of others","That the investment is registered","That a written contract exists"],"a":1,"e":"The <strong>'efforts of others'</strong> element is the usual battleground. If the investor's own labour generates the return, it is not an investment contract — which is how the orange-grove-with-management-contract became a security while the bare grove did not."},"gq17":{"sec":"s1","t":"Investors are paid consistent monthly returns funded entirely from the principal of newer investors. There is no underlying trading. This is:","o":["A pump and dump","A pyramid scheme","A Ponzi scheme","Churning"],"a":2,"e":"A <strong>Ponzi</strong> pays passive investors from later investors' <em>principal</em>. Distinguish from a pyramid, where returns depend on the investor's own <em>recruiting</em> activity."},"gq18":{"sec":"s1","t":"What distinguishes an unlawful pyramid scheme from a lawful multi-level marketing business?","o":["Pyramids are always international","Pyramid compensation flows from recruitment rather than retail sales to genuine end users","Pyramids sell no product at all","MLMs never require an entry fee"],"a":1,"e":"Many pyramids do have a nominal product — that is the disguise. The test is <strong>where the money comes from</strong>: recruitment and inventory loading (unlawful) versus genuine retail sales to end consumers (lawful)."},"gq19":{"sec":"s1","t":"A broker with discretionary authority executes far more trades than the client's objectives warrant, generating large commissions. This is:","o":["Unsuitability","Insider trading","Churning","Front running"],"a":2,"e":"<strong>Churning</strong> requires control over the account plus trading excessive in light of the client's objectives, driven by commission generation."},"gq20":{"sec":"s1","t":"A trader learns of a merger from the target's CFO and buys shares before announcement. For insider trading, BOTH of which elements must be present?","o":["The information is material AND non-public","The stock is listed AND liquid","The trader is an employee AND a shareholder","The trade is profitable AND large"],"a":0,"e":"The information must be <strong>material</strong> (a reasonable investor would consider it important) <strong>and non-public</strong>, and traded in breach of a duty. Non-public but trivial, or material but already public, fails."},"gq21":{"sec":"s1","t":"A promoter accumulates a thinly traded stock, promotes it through spam and false press releases, then sells into the resulting retail demand. This is:","o":["A boiler room","Market division","Front running","A pump and dump"],"a":3,"e":"<strong>Pump and dump</strong>. Thin liquidity is essential — it lets a modest amount of hype move the price sharply, and lets the promoter's exit crash it."},"gq22":{"sec":"s1","t":"A brokerage firm executes its own trade in a stock immediately before filling a large client order it knows will move the price. This is:","o":["Insider trading","Sliding","Churning","Front running"],"a":3,"e":"<strong>Front running</strong> is trading ahead of a known client order to profit from the price impact that order will cause."},"gq23":{"sec":"s1","t":"Which is the STRONGEST red flag of a Ponzi scheme?","o":["The manager is a licensed broker","The fund is audited annually","The fund invests in listed equities","Returns are consistently smooth and positive regardless of market conditions"],"a":3,"e":"Real markets are volatile. <strong>Implausibly smooth returns across all market conditions</strong> indicate the returns are being manufactured rather than earned. Madoff's near-flat return line was the signal ignored for years."},"gq24":{"sec":"s1","t":"A departing employee copies the client list to a personal drive. The company had NDAs, marked the list confidential, and restricted access. The company's trade-secret claim is:","o":["Weak, because client lists are public information","Strong only if the employee sold the list","Strong, because all three trade-secret elements are satisfied","Weak, because the employee had authorised access"],"a":2,"e":"Value from secrecy, not readily ascertainable, and <strong>reasonable protective measures taken</strong> — all three elements are met. Authorised access does not license misappropriation, and no sale is required."},"gq25":{"sec":"s1","t":"A cheque is stolen blank from a chequebook and the account holder's signature is forged. This is a:","o":["Forged maker","Counterfeit cheque","Forged endorsement","Altered cheque"],"a":0,"e":"<strong>Forged maker</strong> — the <em>drawer's</em> signature is forged. Contrast forged endorsement, where the cheque was genuinely signed by the drawer but the <em>payee's</em> signature is forged."},"gq26":{"sec":"s1","t":"A genuine, properly signed cheque payable to a supplier is intercepted in the mail and signed over by the thief. This is a:","o":["Concealed cheque","Forged endorsement","Forged maker","Counterfeit cheque"],"a":1,"e":"<strong>Forged endorsement</strong>. The drawer's signature is authentic; the fraud is in the <em>payee's</em> signature. This distinction is tested almost every sitting."},"gq27":{"sec":"s1","t":"A business holds accounts at two banks and writes matched cheques between them each week against uncollected funds, creating fictitious balances. This is:","o":["Structuring","Cheque tampering","Cheque kiting","Lapping"],"a":2,"e":"<strong>Cheque kiting</strong> exploits the <em>float</em> — the delay between deposit and collection — to create balances that do not exist. It requires two or more accounts, usually at different banks."},"gq28":{"sec":"s1","t":"Which is the classic quantitative indicator of cheque kiting on an account?","o":["A single very large deposit","Average daily float greatly exceeding the average ledger balance","Frequent cash withdrawals under the reporting threshold","A high number of overdraft fees"],"a":1,"e":"Kiting inflates float without real money. When <strong>float dwarfs the ledger balance</strong>, the account is running on uncollected funds — the mathematical signature of a kite."},"gq29":{"sec":"s1","t":"A fraudster changes the cardholder's address, then reports the card lost so a replacement is sent to the new address. This is:","o":["Carding","A bust-out","Never-received issue (NRI)","Account takeover"],"a":3,"e":"<strong>Account takeover</strong>: the fraudster seizes an <em>existing legitimate account</em>. The address change is the enabling step. Distinguish from NRI, where a genuinely issued card is intercepted without any takeover."},"gq30":{"sec":"s1","t":"A cardholder makes small purchases, pays reliably for months to raise limits, then maxes every line and disappears. This is:","o":["A bust-out","Carding","Factoring","Skimming"],"a":0,"e":"A <strong>bust-out</strong> spends the <em>creditworthiness</em> that was patiently built. The good payment history is not an anomaly — it is the investment phase of the fraud."},"gq31":{"sec":"s1","t":"A complicit merchant processes another (unauthorised) merchant's card transactions through its own account for a fee. This is:","o":["Churning","Sliding","Carding","Factoring"],"a":3,"e":"Merchant <strong>factoring</strong> (or laundering) launders transactions through a legitimate merchant account, letting a business that could not obtain its own processing facility accept cards."},"gq32":{"sec":"s1","t":"An accounts payable clerk receives an email, apparently from the CEO, directing an urgent wire to a new supplier account. This is BEST prevented by:","o":["Limiting all wires to under a threshold","Out-of-band verification of any change to payment details","Stronger email spam filters","Requiring the CEO to use encrypted email"],"a":1,"e":"Business email compromise defeats technical filters because the email may come from a genuinely compromised account. The control that works is <strong>out-of-band verbal verification</strong> of any new or changed bank detail, on a number obtained independently."},"gq33":{"sec":"s1","t":"Which statement about cryptocurrency in fraud investigation is CORRECT?","o":["It is fully anonymous and untraceable","It is pseudonymous; the blockchain is a permanent public ledger traceable at on/off ramps","It cannot be used for money laundering","Transactions are always reversible"],"a":1,"e":"Crypto is <strong>pseudonymous, not anonymous</strong>. Every transaction is permanently recorded. The investigative leverage is at the <em>exchange on/off ramps</em>, where KYC links a wallet to a person."},"gq34":{"sec":"s1","t":"An insurance agent collects premiums from clients and never remits them to the insurer. This is:","o":["Twisting","Churning","Premium diversion","Sliding"],"a":2,"e":"<strong>Premium diversion</strong> is the most common agent fraud. The insured typically discovers it only when a claim is made and no policy exists."},"gq35":{"sec":"s1","t":"An agent misrepresents facts to induce a client to cancel a policy with one insurer and buy from another. This is:","o":["Premium diversion","Sliding","Twisting","Churning"],"a":2,"e":"<strong>Twisting</strong> = misrepresentation inducing a switch to a <em>different</em> insurer. <strong>Churning</strong> = replacement <em>within the same</em> insurer. Both generate fresh commission; the exam distinguishes them by whether the insurer changes."},"gq36":{"sec":"s1","t":"An agent adds coverage the client never requested and was not told about, and charges for it. This is:","o":["Churning","Sliding","Twisting","Fraudulent underwriting"],"a":1,"e":"<strong>Sliding</strong> is the surreptitious addition of unrequested coverage. The client's consent is absent, not merely uninformed."},"gq37":{"sec":"s1","t":"An owner arranges for his own vehicle to be stolen or destroyed to claim insurance. This is:","o":["An owner give-up","A phantom passenger claim","Sliding","A staged accident"],"a":0,"e":"An <strong>owner give-up</strong> is the deliberate disposal, concealment or destruction of one's own insured vehicle to claim the proceeds — often when the owner is upside-down on the loan."},"gq38":{"sec":"s1","t":"Which combination of facts MOST strongly suggests arson for profit?","o":["The fire occurred at night and the alarm failed","The building was uninsured and destroyed","The business was financially distressed, the policy limit was recently increased, and the fire had multiple unconnected origin points","The owner was not present and the property was old"],"a":2,"e":"Arson-for-profit is proved on the <strong>financial record plus physical inconsistency</strong>: motive (distress), opportunity (recent over-insurance), and evidence incompatible with accident (multiple origin points cannot occur accidentally)."},"gq39":{"sec":"s1","t":"An employer understates its payroll and misclassifies high-risk workers into low-risk categories. This is:","o":["Workers' compensation premium fraud","Workers' compensation claimant fraud","Organised workers' compensation fraud","Agent fraud"],"a":0,"e":"<strong>Premium fraud</strong> is committed by the <em>employer</em> against the insurer, by misstating payroll, job classifications, or claims history to reduce premium. Note the perpetrator: employer, not employee."},"gq40":{"sec":"s1","t":"A ring consisting of a lawyer, a doctor, and recruiters ('cappers') generates fabricated injury claims and medical bills. This is:","o":["Claimant fraud","Organised workers' compensation fraud","Premium fraud","Twisting"],"a":1,"e":"<strong>Organised fraud</strong> involves a coordinated ring — typically a recruiter who supplies claimants, a complicit medical provider who documents injuries, and a lawyer who prosecutes the claims."},"gq41":{"sec":"s1","t":"Which claim-level fact is the STRONGEST single indicator of premeditated insurance fraud?","o":["The claim was filed by post","The claim was filed shortly after the policy was written or the limits increased","The claim is for a large amount","The claimant retained a lawyer"],"a":1,"e":"A claim arriving <strong>shortly after inception or a limit increase</strong> suggests the coverage was procured <em>for</em> the loss. This is one of the two facts the ACFE plants most often."},"gq42":{"sec":"s1","t":"A physician bills a routine 10-minute consultation using the code for a comprehensive 45-minute examination. This is:","o":["Unbundling","Upcoding","Ping-ponging","Phantom billing"],"a":1,"e":"<strong>Upcoding</strong> = billing for a <em>higher-value</em> service than was actually rendered. The service happened; the code overstates it."},"gq43":{"sec":"s1","t":"A laboratory bills separately for each component of a panel of tests normally reimbursed as a single bundled procedure. This is:","o":["Unbundling (fragmentation)","Overutilisation","Upcoding","Duplicate billing"],"a":0,"e":"<strong>Unbundling</strong> splits one reimbursable unit into parts to collect more than the bundled rate. Contrast upcoding, which inflates the <em>level</em> of a single service."},"gq44":{"sec":"s1","t":"A clinic refers each patient to three colleagues in the same practice, each of whom bills a consultation, without clinical need. This is:","o":["DRG creep","Steering","Ping-ponging","Unbundling"],"a":2,"e":"<strong>Ping-ponging</strong> passes a patient among practitioners so that each may bill, without medical justification for the referrals."},"gq45":{"sec":"s1","t":"A hospital systematically codes admissions into higher-reimbursing diagnosis groups than the patients' conditions warrant. This is:","o":["DRG creep","Unbundling","Ping-ponging","Cost-report fraud"],"a":0,"e":"<strong>DRG creep</strong> is institutional upcoding at the level of diagnosis-related groups — systematically drifting admissions into better-paying categories."},"gq46":{"sec":"s1","t":"Why is routine waiver of patient co-payments treated as a fraud indicator?","o":["It reduces the provider's revenue","It violates data protection rules","It is always illegal in every jurisdiction","It removes the patient's only price signal and operates as an inducement"],"a":3,"e":"The co-payment exists to make the patient <em>care</em> what is billed. Waiving it routinely removes that check and functions as a <strong>kickback to the patient</strong> to accept unnecessary services."},"gq47":{"sec":"s1","t":"Analysis shows a physician billed an average of 14 hours of face-to-face patient contact per working day, though no single claim was implausible. This illustrates that health care fraud is best detected by:","o":["Interviewing each patient individually","Auditing the insurer's payment system","Data analytics comparing aggregate provider behaviour against peer norms","Reviewing the physician's qualifications"],"a":2,"e":"The fraud was invisible at the transaction level and obvious in the <strong>aggregate</strong>. Building an implied working day and benchmarking against specialty peers surfaces outliers that claim-by-claim review never will."},"gq48":{"sec":"s1","t":"A pharmaceutical company pays a physician a 'medical director' fee far above fair market value, and the physician's prescriptions of its drug rise sharply. This is BEST characterised as:","o":["Overutilisation","A kickback disguised as a consulting fee","Upcoding","A legitimate consulting arrangement"],"a":1,"e":"Payment <strong>above fair market value</strong> with a corresponding change in referral or prescribing behaviour is the classic disguised kickback. The label on the payment is irrelevant; the substance controls."},"gq49":{"sec":"s1","t":"A victim of an earlier investment scam is contacted by a 'recovery bureau' that knows exactly how much he lost, and asks a fee to recover it. This is:","o":["Factoring","A legitimate recovery service","A reload / recovery-room scheme","An advance-fee loan scam"],"a":2,"e":"<strong>Reloading</strong> — returning to a known victim for a second bite. Knowledge of the original loss is evidence of <em>connection to the first fraud</em>, not of legitimacy. Sucker lists are bought and sold."},"gq50":{"sec":"s1","t":"A telemarketer demands payment by gift card for an urgent tax debt, insisting the victim tell no one. The strongest indicator of fraud here is:","o":["The caller had an accent","The call was unsolicited","The amount was large","The demand for an irrevocable payment method combined with an appeal to secrecy"],"a":3,"e":"<strong>Irrevocable payment (gift card, wire, crypto) plus enforced secrecy</strong> is the signature. No revenue authority demands gift cards, and the secrecy exists solely to prevent intervention by a bank or family member."},"gq51":{"sec":"s1","t":"Which statement about victims of consumer fraud is MOST consistent with ACFE research?","o":["Only the poorly educated are victimised","Fraud victimisation is evenly distributed across all groups","The elderly are the most frequently victimised group in all categories","The elderly tend to suffer higher losses per incident, while younger online-active consumers report fraud more frequently"],"a":3,"e":"Frequency and severity are <strong>different measures</strong>. Older victims hold more assets and are targeted for larger sums; younger, more digitally exposed consumers report incidents more often. An option asserting the elderly are most <em>frequently</em> victimised is a trap."},"gq52":{"sec":"s1","t":"A scheme requires each participant to buy a large inventory of product they cannot realistically resell, and pays them chiefly for enrolling others. This is:","o":["An unlawful pyramid scheme","A Ponzi scheme","A chain letter","A lawful multi-level marketing business"],"a":0,"e":"<strong>Inventory loading</strong> plus recruitment-driven compensation is the definitive tell of an unlawful pyramid. The product exists but is a device; the money comes from recruits, not end users."},"gq53":{"sec":"s1","t":"A business builds a solid credit record, orders large volumes of inventory on credit, sells it quickly for cash below cost, diverts the proceeds, then files for bankruptcy. This is:","o":["Concealment of assets","A fraudulent preference","A petition mill","A bust-out"],"a":3,"e":"A <strong>bust-out</strong> — planned insolvency. The credit history was itself the asset being liquidated. The detectable moment is the <em>surge in credit purchases</em>, not the eventual filing."},"gq54":{"sec":"s1","t":"Which is the MOST COMMON form of bankruptcy fraud?","o":["Petition mills","Embezzlement by the trustee","Concealment of assets","Bust-out"],"a":2,"e":"<strong>Concealment of assets</strong> — omitting assets from the schedules, or transferring them to relatives or shells before filing — is the most common. Bust-out is the most heavily <em>tested</em>, but concealment is the most frequent."},"gq55":{"sec":"s1","t":"In a bankruptcy, who is responsible for collecting and liquidating estate assets and investigating the debtor's affairs?","o":["The examiner","The trustee","The largest secured creditor","The debtor in possession"],"a":1,"e":"The <strong>trustee</strong> administers the estate. An <em>examiner</em> is appointed to investigate where fraud or mismanagement is suspected but does not administer the estate — do not conflate the two roles."},"gq56":{"sec":"s1","t":"A debtor transfers a property to his brother two months before filing for bankruptcy, for no consideration. This is BEST described as:","o":["A fraudulent transfer / concealment of assets","A petition mill","A lawful estate plan","A preference to a secured creditor"],"a":0,"e":"A transfer for <strong>no consideration</strong> to an insider shortly before filing is a fraudulent transfer designed to place the asset beyond creditors' reach. Trustees have powers to avoid such transfers."},"gq57":{"sec":"s1","t":"Which of these red flags points MOST directly to a planned bust-out rather than genuine business failure?","o":["The business lost its largest customer","Credit purchases tripled across many suppliers in one quarter, with goods sold below cost for cash","The business had declining margins for three years","Management had no succession plan"],"a":1,"e":"Genuine failure shows gradual deterioration. A <strong>sudden surge in credit orders followed by below-cost cash liquidation</strong> is the signature of a bust-out — nobody buys more inventory than ever before while genuinely collapsing."},"gq58":{"sec":"s1","t":"A taxpayer uses a complex but fully disclosed structure that lawfully reduces her liability. This is:","o":["A fraudulent transfer","Wilful blindness","Tax evasion","Tax avoidance"],"a":3,"e":"<strong>Avoidance</strong> is lawful arrangement of affairs; <strong>evasion</strong> requires unlawfulness and concealment. Full disclosure is inconsistent with evasion, however aggressive the structure."},"gq59":{"sec":"s1","t":"Which element distinguishes criminal tax evasion from an honest error?","o":["The size of the underpayment","Whether a professional prepared the return","Wilfulness — voluntary, intentional violation of a known legal duty","Whether the taxpayer is a company"],"a":2,"e":"<strong>Wilfulness</strong> is the element. Negligence, a genuine mistake, or a good-faith misreading of a complex provision is not evasion. Evasion also requires an <em>affirmative act</em>, not mere omission."},"gq60":{"sec":"s1","t":"An examiner computes a subject's assets minus liabilities across years, adds living expenses, and subtracts known reported income to impute unreported income. This is:","o":["The expenditures method","The net worth method","Benford's Law analysis","The bank deposits method"],"a":1,"e":"The <strong>net worth method</strong> — an indirect method used where direct evidence of unreported income is unavailable. An unexplained increase in wealth plus living costs, less known sources, is imputed income."},"gq61":{"sec":"s1","t":"A fraudster files a tax return in a victim's name to capture the refund. The victim typically discovers this when:","o":["Their employer notifies them","The tax authority telephones","Their own genuine return is rejected as a duplicate filing","A creditor reports it"],"a":2,"e":"<strong>Stolen-identity refund fraud</strong> surfaces when the real taxpayer files and the system rejects it — a return already exists for that identity. Speed is the fraudster's whole advantage."},"gq62":{"sec":"s1","t":"A virus and a worm differ in that:","o":["A virus encrypts data; a worm deletes it","A virus requires a host file and user action to spread; a worm self-propagates without either","A worm is always more damaging","A worm attaches to a host file; a virus does not"],"a":1,"e":"<strong>Virus needs a host and a user. A worm needs neither.</strong> If the fact pattern says it spread across the network without anyone opening anything, it is a worm."},"gq63":{"sec":"s1","t":"A systems administrator plants code that will delete production servers if his employee ID disappears from the payroll database. This is:","o":["A rootkit","Ransomware","A Trojan horse","A logic bomb"],"a":3,"e":"A <strong>logic bomb</strong> is dormant code triggered by a <em>condition</em> — here, the author's own termination. It is the archetypal disgruntled-privileged-insider weapon."},"gq64":{"sec":"s1","t":"Which statement about a DDoS attack is CORRECT?","o":["It steals confidential data by overwhelming the server","It compromises availability rather than confidentiality; no data is exfiltrated","It requires physical access to the server","It always installs ransomware"],"a":1,"e":"DDoS attacks <strong>availability</strong>. It denies service; it does not exfiltrate data. An option describing 'stealing data by flooding a server with traffic' is wrong on the mechanism."},"gq65":{"sec":"s1","t":"A program disguises itself as legitimate software, does not self-replicate, and opens a backdoor once installed. This is:","o":["A worm","A logic bomb","A Trojan horse","A botnet"],"a":2,"e":"A <strong>Trojan horse</strong> relies on <em>disguise</em>, not replication. The user installs it willingly, believing it to be something else."},"gq66":{"sec":"s1","t":"A fraudster diverts fractions of a cent from thousands of interest calculations into his own account. This is:","o":["The salami technique","A logic bomb","Skimming","Lapping"],"a":0,"e":"The <strong>salami technique</strong> slices amounts too small to be individually noticed. Rounding fractions is the classic implementation — individually invisible, collectively substantial."},"gq67":{"sec":"s1","t":"Which is the MOST effective initial vector for network intrusion in practice?","o":["Buffer overflows","Brute-force password attacks","Social engineering","Zero-day exploits"],"a":2,"e":"<strong>Social engineering</strong> remains the dominant vector. Technology is rarely the weak point; people are. This is why security awareness training outperforms most technical spend."},"gq68":{"sec":"s1","t":"Specifications for a government tender are written to match one vendor's product catalogue so precisely that no competitor can qualify. This occurs at which phase, and is called what?","o":["Award phase; sole-source abuse","Performance phase; change-order abuse","Presolicitation phase; bid tailoring (specification fraud)","Solicitation phase; bid rigging"],"a":2,"e":"<strong>Bid tailoring occurs in the presolicitation phase</strong>, when specifications are written. Bid rigging occurs later, during solicitation and evaluation. The exam distinguishes these by <em>when</em> they happen."},"gq69":{"sec":"s1","t":"Four contractors agree that each will take a turn submitting the lowest bid on successive contracts. This is:","o":["Bid suppression","Market division","Bid rotation","Complementary bidding"],"a":2,"e":"<strong>Bid rotation</strong> — the conspirators take turns winning, on a schedule. The statistical tell is a suspiciously regular cycle of winners across tenders."},"gq70":{"sec":"s1","t":"Competitors submit deliberately high bids they never intend to win, so that the favoured bidder appears to have won a competitive process. This is:","o":["Bid rotation","Complementary (cover) bidding","Bid suppression","Defective pricing"],"a":1,"e":"<strong>Complementary bidding</strong> — the most common collusion form. The losing bidders are <em>participants, not victims</em>; their bids exist solely to manufacture the appearance of competition."},"gq71":{"sec":"s1","t":"Competitors agree not to submit bids at all, leaving the field to the designated winner. This is:","o":["Bid tailoring","Complementary bidding","Bid rotation","Bid suppression"],"a":3,"e":"<strong>Bid suppression</strong> — competitors withdraw or abstain entirely, rather than submitting cover bids."},"gq72":{"sec":"s1","t":"A contractor wins with a very low bid, then recovers its margin through a stream of inflated change orders. This is:","o":["Cost mischarging","Product substitution","Defective pricing","Change-order abuse"],"a":3,"e":"<strong>Change-order abuse</strong>. The detection pattern is distinctive: <em>an abnormally low winning bid followed by an abnormally high volume of changes</em>. Together, they indicate the low bid was never the real price."},"gq73":{"sec":"s1","t":"A supplier delivers components of a lower grade than specified while invoicing for the specified grade. This is:","o":["Progress-payment fraud","Product substitution","Defective pricing","Cost mischarging"],"a":1,"e":"<strong>Product substitution</strong> — a post-award performance-phase scheme. The contract is genuine; the delivered goods are not what was promised."},"gq74":{"sec":"s1","t":"A contractor charges costs incurred on a fixed-price job to a cost-plus government contract. This is:","o":["Bid tailoring","Product substitution","Cost mischarging","Defective pricing"],"a":2,"e":"<strong>Cost mischarging</strong> — allocating costs to the contract that reimburses them, typically shifting from a fixed-price to a cost-reimbursement contract."},"gq75":{"sec":"s1","t":"An official awards a contract to a company in which he holds an undisclosed interest, but receives no bribe or payment. Has a violation occurred?","o":["No, because there was no payment","Only if the contract underperformed","No, provided the price was fair","Yes — a conflict of interest requires only the undisclosed interest, not a payment"],"a":3,"e":"A <strong>conflict of interest need not involve any payment</strong>. The undisclosed interest is itself the violation. This distinguishes it from bribery, which requires a corrupt payment."},"gq76":{"sec":"s1","t":"Across eleven tenders, the same four firms bid, the winner rotates cyclically, and losing bids cluster consistently 18–22% above the winner. The strongest inference is:","o":["The specifications were too demanding","The procurement officer is inefficient","The market has only four capable firms","Collusive bidding — the uniform losing margins are statistically implausible among genuine competitors"],"a":3,"e":"Genuine competitors' estimates <strong>scatter</strong>; conspirators' do not. A consistent losing margin plus a rotating winner is the statistical fingerprint of complementary bidding combined with bid rotation."},"gx1":{"sec":"s1","t":"A cashier takes cash from a customer and never enters the sale in the register. Separately, an ATM has a device fitted that captures card data. Both are called 'skimming'. Which statement is correct?","o":["Both require recording the transaction first","They are the same scheme in different settings","Cash-receipts skimming is off-book theft BEFORE recording; identity-theft skimming is a card-data capture device — unrelated schemes sharing a name","Both are forms of larceny"],"a":2,"e":"The manual uses 'skimming' in <strong>two unrelated senses</strong>. In asset misappropriation it means <em>off-book theft before recording</em> (no audit trail). In identity theft it means a <em>card-reading device</em>. Read the facts, never the word."},"gx2":{"sec":"s1","t":"A promoter pays existing investors from new investors' principal AND requires each investor to recruit two more to qualify for payouts. This is BEST classified as:","o":["A hybrid — Ponzi mechanics with a pyramid recruitment requirement","Neither; it is securities fraud only","Purely a Ponzi scheme","Purely a pyramid scheme"],"a":0,"e":"The money mechanics are Ponzi (paid from later principal), but the <em>stated source of return</em> is recruitment, which is the pyramid element. Real schemes blend them. The exam tests whether you identify the mechanism, not the label."},"gx3":{"sec":"s1","t":"Which pair is MOST commonly confused, and what is the single distinguishing fact?","o":["Forged maker vs forged endorsement — one involves cheques, one does not","Ponzi vs pyramid — one is larger","Upcoding vs unbundling — one is legal, the other is not","Upcoding vs unbundling — one inflates the level of service, the other splits one service into parts"],"a":3,"e":"<strong>Upcoding</strong> bills a <em>higher-level</em> service than performed. <strong>Unbundling</strong> bills <em>separately for the parts</em> of one bundled service. Both inflate the claim; the mechanism differs, and both appear as options in the same question."},"gx4":{"sec":"s1","t":"An employee steals blank company cheques and forges the CFO's signature. Which TWO chapters of the manual does this scheme appear in?","o":["Fraudulent disbursements (cheque tampering) and payment fraud (forged maker)","Financial statement fraud and corruption","Money laundering and tax fraud","Bankruptcy and securities fraud"],"a":0,"e":"The same act is a <strong>cheque tampering</strong> scheme (fraudulent disbursements, viewed as occupational fraud) and a <strong>forged maker</strong> scheme (payment fraud, viewed as an instrument fraud). The classification depends on the lens the question adopts."},"gx5":{"sec":"s1","t":"A business deposits cash from an illegitimate source into a legitimate high-cash-turnover business it owns, mixing it with real receipts. Separately, another business writes matched cheques between two banks against uncollected funds. These are, respectively:","o":["Both money laundering","Commingling (money laundering — integration via a front business) and cheque kiting","Both cheque fraud","Kiting and structuring"],"a":1,"e":"The first is <strong>laundering through a cash-intensive front</strong> — the fraud is concealing origin. The second is <strong>kiting</strong> — the fraud is manufacturing balances from float. Both involve moving money between accounts, but the <em>purpose</em> differs entirely."},"gx6":{"sec":"s1","t":"A bidder submits a deliberately high bid it does not want to win. A different bidder pays the procurement officer to reveal competitors' prices. These are:","o":["Both conflicts of interest","Complementary bidding and bribery/bid-data leakage respectively","Both bid rigging","Both bid tailoring"],"a":1,"e":"<strong>Complementary bidding</strong> is horizontal collusion <em>among bidders</em>. <strong>Bid-data leakage via bribery</strong> is vertical corruption <em>between a bidder and an official</em>. Different actors, different schemes, often present together."},"gx7":{"sec":"s1","t":"An official's brother-in-law owns a firm that wins a contract. No money changes hands and the price was competitive. The official did not disclose the relationship. This is:","o":["A conflict of interest, which is complete on non-disclosure regardless of loss or payment","Bribery","Economic extortion","Nothing — no loss occurred"],"a":0,"e":"<strong>No payment and no loss are required.</strong> The failure to disclose the interest is the violation. Candidates routinely get this wrong by looking for harm — the offence is the undisclosed conflict itself."},"gx8":{"sec":"s1","t":"A vendor demands a payment from a company, threatening to withhold a critical supply if refused. Compare: a purchasing agent demands a payment from a vendor, threatening to award elsewhere. These are respectively:","o":["Economic extortion in both cases — the party with power demands payment under threat","Kickback and conflict of interest","Bribery and economic extortion","Bribery and bribery"],"a":0,"e":"<strong>Economic extortion</strong> is defined by <em>demand under threat</em> by the party holding power. Bribery is an <em>offer</em> to influence. The direction of initiation is the test: who demanded, and under what threat."},"gx9":{"sec":"s1","t":"Which of the following is NOT a form of asset misappropriation?","o":["Billing schemes","Expense reimbursement fraud","Skimming","Financial statement fraud"],"a":3,"e":"<strong>Financial statement fraud</strong> is its own branch of the fraud tree, alongside asset misappropriation and corruption. It is the <em>least frequent but most costly</em> category. Asset misappropriation is the most frequent but least costly."},"gx10":{"sec":"s1","t":"Rank the three branches of occupational fraud by FREQUENCY (most to least):","o":["Corruption, asset misappropriation, financial statement fraud","Financial statement fraud, corruption, asset misappropriation","Asset misappropriation, corruption, financial statement fraud","Asset misappropriation, financial statement fraud, corruption"],"a":2,"e":"<strong>Frequency: asset misappropriation > corruption > financial statement fraud.</strong> <em>Median loss runs in exactly the reverse order.</em> The most common fraud is the cheapest; the rarest is the most expensive. Expect this inversion to be tested."},"gx11":{"sec":"s1","t":"A shell company is set up by an employee to invoice her employer for services never rendered. A different employee alters a genuine supplier invoice to increase the amount. These are:","o":["Both expense reimbursement schemes","A billing scheme and a corruption scheme","Both cheque tampering","Both billing schemes — shell company scheme and altered/overbilling scheme"],"a":3,"e":"Both are <strong>billing schemes</strong> (fraudulent disbursements). The shell-company variant is the most costly billing scheme; the altered-invoice / pass-through variant exploits a genuine vendor relationship."},"gx12":{"sec":"s1","t":"A construction company requests draws for work not yet performed. A different company bills a government client for a completion stage not reached. These are:","o":["Construction loan fraud (financial institution) and progress-payment fraud (procurement) — same mechanism, different victim","Both financial institution fraud","Both product substitution","Both procurement fraud only"],"a":0,"e":"The <strong>mechanism is identical</strong> — billing for uncompleted work. The chapter it falls under depends on the <em>victim</em>: a lender (construction loan fraud) or a government/commercial buyer (progress-payment fraud)."},"gx13":{"sec":"s1","t":"Which statement about the fraud triangle is CORRECT?","o":["It requires pressure, opportunity, and rationalisation — all three","Opportunity is the element the fraudster controls","It requires only pressure and opportunity","Rationalisation occurs only after the fraud is discovered"],"a":0,"e":"Cressey's triangle: <strong>pressure (motive), opportunity, and rationalisation</strong> — all three. Note that <em>opportunity is the only element the organisation can control</em>, which is why internal controls target it."},"gx14":{"sec":"s1","t":"A worm spreads across a corporate network overnight. Separately, an employee opens an email attachment that infects his machine only. These are respectively:","o":["Both viruses","Both worms","A Trojan and a worm","A worm (self-propagating, no user action) and a virus (host file + user action)"],"a":3,"e":"<strong>Self-propagation without user action = worm.</strong> <strong>Requires a host file and user execution = virus.</strong> The overnight network-wide spread with nobody at their desk is the definitive worm signature."},"gx15":{"sec":"s1","t":"A company's policy limit was increased eight weeks before a total-loss fire. Its inventory records were destroyed in that fire. The examiner should FIRST:","o":["Reconstruct the financial position from external sources — suppliers, bank, tax filings, insurer's own prior submissions","Accept that the records are unavailable and close the file","Wait for the fire investigator's report before doing anything","Interview the owner and rely on his account"],"a":0,"e":"<strong>Destroyed records are themselves evidence.</strong> Reconstruct externally: suppliers hold purchase records, banks hold statements, tax authorities hold filings, and the insurer holds the pre-loss submission. Arson-for-profit is proven on the financial record, not the fire scene."},"gx16":{"sec":"s1","t":"An examiner finds a provider's claims imply 26 hours of patient contact on one day. Before alleging fraud, the examiner should:","o":["Verify the data — check for duplicate submissions, billing under a shared or stolen provider ID, and clerical coding errors","Suspend all payments to the provider","Report to police immediately","Interview the provider under caution"],"a":0,"e":"An impossible number is a <strong>lead, not a conclusion</strong>. A stolen or shared provider ID, a duplicate feed, or a coding error can produce the same anomaly. Predication requires a reasonable basis — verify the data before alleging."},"gx17":{"sec":"s1","t":"Which is the SINGLE most important reason synthetic identity fraud evades detection longer than traditional identity theft?","o":["There is no real victim to notice and complain","It only occurs online","It involves larger sums","It is always committed by insiders"],"a":0,"e":"Traditional identity theft has a <strong>human victim who eventually notices</strong> and raises the alarm. A synthetic identity belongs to nobody — nobody checks its statements, nobody disputes its charges. That absence is its entire defence."},"gx18":{"sec":"s1","t":"A lender's file shows a borrower with a thin but flawless credit history, a single unverifiable pay stub, and an SSN that traces to a child. The MOST likely scheme is:","o":["A straw buyer","A synthetic identity approaching a bust-out","An air loan","Equity skimming"],"a":1,"e":"An <strong>implausibly thin but perfect</strong> profile with no verifiable physical footprint, on an SSN belonging to a minor, is a nurtured synthetic identity — built patiently, about to be <strong>busted out</strong>. The red flag is not a bad record; it is the absence of a real one."},"gx19":{"sec":"s1","t":"Which of the following would NOT support a trade-secret claim?","o":["The information had economic value because it was secret","Employees signed NDAs and the material was marked confidential","The information was extremely valuable but freely posted on the company's public website","Access was restricted on a need-to-know basis"],"a":2,"e":"Information that is <strong>publicly available is not a trade secret</strong>, however valuable. Value alone never establishes the claim — the owner's protective measures and the information's non-public character do."},"gx20":{"sec":"s1","t":"Which statement about the open-book nature of the CFE exam is MOST useful strategically?","o":["The manual is not permitted","Open-book means the pass mark is higher","You can look up any question you are unsure of","At roughly 100 seconds per question, you can afford to research only a handful — it is a speed test, not a research test"],"a":3,"e":"With 100 questions in 2h45m, the average is <strong>~100 seconds per question</strong>. Time spent searching is time taken from questions you know. Reference the manual only for the few you have genuinely flagged — treat it as a safety net, not a strategy."}},"flashcards":[{"sec":"s1","q":"Skimming vs cash larceny?","a":"Skimming = theft of cash BEFORE recording (off-book, no trail). Cash larceny = theft AFTER recording (on-book, creates a discrepancy)."},{"sec":"s1","q":"Lapping","a":"Crediting one customer's account with a later customer's payment to conceal stolen receipts, rolling the shortfall forward. Classic receivables-skimming concealment."},{"sec":"s1","q":"Five financial-statement fraud families","a":"Fictitious revenue, timing differences, concealed liabilities, improper disclosures, improper asset valuation."},{"sec":"s1","q":"Bribery vs illegal gratuity","a":"Bribery = intent to INFLUENCE a future decision. Illegal gratuity = reward AFTER a decision, no prior agreement to influence."},{"sec":"s1","q":"Money-laundering stages","a":"Placement → Layering → Integration. (Structuring/smurfing is a placement technique.)"},{"sec":"s1","q":"FSF frequency vs cost","a":"Financial statement fraud = least frequent, highest median loss. Asset misappropriation = most frequent, lowest median loss. Corruption in between."},{"sec":"s1","q":"Shell vs pass-through billing","a":"Shell = bills for goods/services never delivered. Pass-through = actually buys goods then resells to employer at inflated markup."},{"sec":"s1","q":"Check kiting","a":"Exploiting the float (clearing delay) between accounts/banks to create artificial balances from insufficient funds."},{"sec":"s1","q":"Ponzi vs pyramid","a":"Ponzi = returns paid from new investors' money. Pyramid = income chiefly from recruitment, not product sales."},{"sec":"s1","q":"Tax evasion vs avoidance","a":"Evasion = illegal, willful intent to defeat tax. Avoidance = lawful minimization of tax."},{"sec":"s2","q":"Fraud theory approach","a":"Analyze data → create hypothesis (worst-case) → test hypothesis → refine. General to specific; least- to most-culpable."},{"sec":"s2","q":"Predication","a":"Totality of circumstances leading a reasonable, trained professional to believe fraud occurred/is occurring/will occur. Required before any examination."},{"sec":"s2","q":"Burden of proof ladder","a":"Beyond a reasonable doubt (criminal) > clear and convincing > preponderance of evidence ('more likely than not', civil)."},{"sec":"s2","q":"Four elements of fraud","a":"Material false statement, knowledge of falsity, reliance by victim, resulting damages."},{"sec":"s2","q":"Direct vs circumstantial evidence","a":"Direct proves a fact without inference (eyewitness). Circumstantial requires an inference (fingerprints). Fraud cases are mostly circumstantial — and that's valid."},{"sec":"s2","q":"Chain of custody","a":"Unbroken documented record of who held evidence and when. A gap can make evidence inadmissible."},{"sec":"s2","q":"Hash value in digital forensics","a":"A matching hash (MD5/SHA) proves a forensic image is bit-for-bit identical to the original and unaltered. Always work on the image, never the original."},{"sec":"s2","q":"Interview question sequence","a":"Introductory → Informational → Closing → Assessment → Admission-seeking. Last two only when warranted."},{"sec":"s2","q":"Alternative question","a":"Admission-seeking technique offering two incriminating choices, one more face-saving, to move the subject toward confession."},{"sec":"s2","q":"Net worth method","a":"Asset increases + living expenses − income from known sources = likely illicit/unreported funds. Headline indirect tracing method."},{"sec":"s2","q":"Benford's Law scope","a":"Applies to natural numbers (invoice/payment amounts), NOT assigned numbers (phone, account, ID). Leading digit 1 ≈ 30.1%."},{"sec":"s2","q":"Testifying limit","a":"A fraud examiner must NOT opine on the legal guilt/innocence of the accused — that's for the trier of fact. Opine only within expertise."},{"sec":"s3","q":"Fraud Triangle","a":"Pressure + Opportunity + Rationalization (Cressey). The foundational fraud concept. Fraud Diamond adds Capability."},{"sec":"s3","q":"Occupational fraud categories","a":"Asset misappropriation (most frequent, least costly) → Corruption → Financial statement fraud (least frequent, most costly)."},{"sec":"s3","q":"COSO five components","a":"Control environment, Risk assessment, Control activities, Information & communication, Monitoring activities."},{"sec":"s3","q":"Segregation of duties","a":"Separate authorization, recording, and custody of assets. Its absence is the most-cited control weakness."},{"sec":"s3","q":"Who owns internal controls?","a":"Management — not auditors. Management is primarily responsible for preventing/detecting fraud. Auditors give reasonable (not absolute) assurance."},{"sec":"s3","q":"Inherent vs residual risk","a":"Inherent = risk before controls. Residual = risk remaining after mitigating controls. Assess inherent first."},{"sec":"s3","q":"#1 fraud detection method","a":"Tips. This is why reporting hotlines are among the most effective anti-fraud controls."},{"sec":"s3","q":"Two tested CFE Code duties","a":"(1) Never opine on legal guilt/innocence. (2) Obtain evidence giving a reasonable basis for any opinion rendered."},{"sec":"s1","q":"Competitive intelligence vs espionage?","a":"The METHOD, not the value. Public sources = lawful intelligence. Deception, trespass, bribery, interception = espionage."},{"sec":"s1","q":"Three elements of a trade secret?","a":"(1) Independent economic value from secrecy, (2) not readily ascertainable, (3) owner took REASONABLE MEASURES to protect it. Element 3 is where claims die."},{"sec":"s1","q":"Synthetic identity theft — why so hard to detect?","a":"There is NO real victim to complain. Built from real fragments + fabricated details. Nurtured, then busted out."},{"sec":"s1","q":"Criminal identity theft?","a":"Thief gives victim's name to police on arrest. Victim finds out via warrant or failed background check."},{"sec":"s1","q":"Linked financing?","a":"Large deposit offered to a bank ON CONDITION it makes a loan to a designated party. Deposit = bait, bad loan = payoff."},{"sec":"s1","q":"Daisy chain?","a":"Conspirators pass an asset among themselves at escalating prices to inflate value before pledging it. Tell = velocity between related parties, no improvement to asset."},{"sec":"s1","q":"Air loan?","a":"No property, no borrower, no collateral. Entirely fabricated file."},{"sec":"s1","q":"Equity skimming?","a":"Take title, collect the rents, never service the mortgage, let it foreclose."},{"sec":"s1","q":"Howey test — the decisive element?","a":"Profits derived predominantly from the EFFORTS OF OTHERS. If the investor's own labour drives the return, it is not a security."},{"sec":"s1","q":"Ponzi vs pyramid?","a":"Ponzi = passive investors paid from LATER INVESTORS' PRINCIPAL. Pyramid = investors paid for RECRUITING. Mechanism differs; both unsustainable."},{"sec":"s1","q":"Pyramid vs lawful MLM?","a":"Does the money come from RETAIL SALES to real end users (lawful) or from RECRUITMENT + inventory loading (unlawful pyramid)?"},{"sec":"s1","q":"Churning (securities)?","a":"Broker over-trades a controlled account to generate commissions. Needs control + trading excessive for client's objectives."},{"sec":"s1","q":"Front running?","a":"Broker trades AHEAD of a large client order it knows is coming."},{"sec":"s1","q":"Forged maker vs forged endorsement?","a":"Forged MAKER = the DRAWER's signature is fake. Forged ENDORSEMENT = cheque genuinely signed, but the PAYEE's signature is fake."},{"sec":"s1","q":"Cheque kiting — the quantitative tell?","a":"Average daily FLOAT greatly exceeds average LEDGER BALANCE. Matched cheques between 2+ banks against uncollected funds."},{"sec":"s1","q":"Card bust-out?","a":"Build a good payment record to raise limits → max every line → disappear. The good history IS the investment phase."},{"sec":"s1","q":"Merchant factoring?","a":"A complicit merchant runs another (unauthorised) merchant's card transactions through its own account for a fee."},{"sec":"s1","q":"Is crypto anonymous?","a":"NO — PSEUDONYMOUS. Blockchain is a permanent public ledger. Investigative leverage is at the exchange on/off ramps (KYC)."},{"sec":"s1","q":"Premium diversion?","a":"Agent collects premium and never remits it to the insurer. Most common agent fraud — discovered only at claim time."},{"sec":"s1","q":"Churning vs twisting vs sliding (insurance)?","a":"CHURNING = replace policy within SAME insurer for commission. TWISTING = misrepresent to induce switch to ANOTHER insurer. SLIDING = charge for coverage client never agreed to."},{"sec":"s1","q":"Owner give-up?","a":"Owner arranges the theft/destruction of their OWN insured vehicle to claim proceeds."},{"sec":"s1","q":"Workers' comp PREMIUM fraud — who commits it?","a":"The EMPLOYER. Understates payroll, misclassifies workers into low-risk codes, misstates claims history to cut premium."},{"sec":"s1","q":"Upcoding vs unbundling?","a":"UPCODING = bill a HIGHER-LEVEL service than performed. UNBUNDLING = bill SEPARATELY for parts of one bundled procedure."},{"sec":"s1","q":"Ping-ponging?","a":"Referring a patient among practitioners in the same clinic so each can bill, without clinical need."},{"sec":"s1","q":"DRG creep?","a":"Institutional upcoding — systematically coding admissions into higher-reimbursing diagnosis groups."},{"sec":"s1","q":"Why is waiving patient co-pays a red flag?","a":"It removes the patient's only price signal and acts as an inducement to accept unnecessary services."},{"sec":"s1","q":"Reloading?","a":"Returning to an ALREADY-DEFRAUDED victim for a second bite (often as a 'recovery service'). Knowing the loss details = evidence of CONNECTION, not legitimacy."},{"sec":"s1","q":"Bust-out (bankruptcy)?","a":"Build credit → order huge inventory on credit → sell below cost for cash → divert proceeds → file bankruptcy. Detectable moment = the SURGE, not the failure."},{"sec":"s1","q":"Most COMMON bankruptcy fraud?","a":"CONCEALMENT OF ASSETS (omitting from schedules, transferring to relatives/shells). Bust-out is the most TESTED, but concealment is the most FREQUENT."},{"sec":"s1","q":"Tax avoidance vs evasion?","a":"AVOIDANCE = lawful arrangement. EVASION = unlawful concealment. Evasion needs: tax due + AFFIRMATIVE ACT + WILFULNESS."},{"sec":"s1","q":"Net worth method?","a":"(Assets − Liabilities) change + living expenses − known reported income = imputed unreported income. Indirect method; used when direct evidence is unavailable."},{"sec":"s1","q":"Virus vs worm?","a":"VIRUS needs a host file AND user action. WORM needs NEITHER — self-replicating, self-propagating. Overnight network-wide spread = worm."},{"sec":"s1","q":"Logic bomb?","a":"Dormant code triggered by a CONDITION (a date, or the author's payroll record vanishing). Classic disgruntled-privileged-insider weapon."},{"sec":"s1","q":"DDoS — what does it attack?","a":"AVAILABILITY. It denies service. It does NOT exfiltrate data. Beware options saying 'steals data by flooding the server'."},{"sec":"s1","q":"Salami technique?","a":"Slicing tiny amounts (rounding fractions) from many accounts. Individually invisible, collectively large."},{"sec":"s1","q":"Bid tailoring vs bid rigging — WHEN?","a":"TAILORING = PRESOLICITATION phase (specs written for one vendor). RIGGING = SOLICITATION/EVALUATION phase. The exam distinguishes by WHEN."},{"sec":"s1","q":"The four bidder-collusion forms?","a":"COMPLEMENTARY (cover bids to fake competition — most common), ROTATION (take turns winning), SUPPRESSION (agree not to bid), MARKET DIVISION (carve up territories)."},{"sec":"s1","q":"Change-order abuse — detection pattern?","a":"Abnormally LOW winning bid + abnormally HIGH volume of change orders. The low bid was never the real price."},{"sec":"s1","q":"Product substitution vs defective pricing?","a":"SUBSTITUTION = deliver lower-grade goods, bill for specified grade. DEFECTIVE PRICING = submit cost/pricing data that isn't current, accurate, complete."},{"sec":"s1","q":"Conflict of interest — is a payment needed?","a":"NO. The UNDISCLOSED INTEREST is itself the violation. No bribe, no loss, no unfair price required."},{"sec":"s1","q":"Occupational fraud — frequency vs cost?","a":"FREQUENCY: asset misappropriation > corruption > financial statement fraud. MEDIAN LOSS: exactly REVERSED. The commonest is cheapest; the rarest is dearest."},{"sec":"s1","q":"Fraud triangle — which element can the org control?","a":"OPPORTUNITY. Pressure and rationalisation live in the fraudster's head; internal controls attack opportunity."},{"sec":"s1","q":"'Skimming' — the two meanings?","a":"CASH RECEIPTS: off-book theft BEFORE recording (no trail). IDENTITY THEFT: a card-data capture DEVICE. Unrelated schemes, same word."},{"sec":"s1","q":"Exam time budget?","a":"100 questions / 2h45m = ~100 seconds each. Open-book is a SAFETY NET for a handful of flagged items, not a research strategy."}]}</script>
