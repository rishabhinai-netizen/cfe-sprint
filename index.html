build the provider's implied working day, compare each provider against peer norms for the same specialty, and the outliers surface themselves. Chasing individual claim forms will never find it."},{"h":"Detection"},{"ul":["Provider billings far exceeding peer norms for the specialty; impossible service volumes per day.","A high proportion of claims at the highest-value code (upcoding tells).","Routine waiver of co-pays; patients who cannot recall receiving the billed service.","Diagnosis inconsistent with the patient's demographics or history.","Corporate compliance programme absent, or existing only on paper."]},{"eye":"Examiner's eye: the giveaway phrase for <em>upcoding</em> is 'billed at a higher level than the service provided'. The giveaway for <em>unbundling</em> is 'billed separately for components normally reimbursed as one'. Do not let them blur."}]},"g8":{"sec":"s1","title":"Consumer fraud & scams","day":33,"body":[{"h":"The essentials"},{"p":"This chapter is a taxonomy. The ACFE tests whether you can put a described scam in the right named box. Learn the names."},{"h":"The scheme catalogue"},{"ul":["<strong>Advance-fee scheme</strong> — a payment demanded up front for a loan, prize, inheritance, or windfall that never materialises. The umbrella under which many others sit.","<strong>Nigerian / 419 letter</strong> — the classic advance-fee variant: help move a fortune, pay the 'transfer fee'.","<strong>Pyramid & Ponzi</strong> — as under securities fraud; when sold to retail consumers they appear here too.","<strong>Chain letter</strong> — a pyramid stripped of any product.","<strong>Multi-level marketing (MLM)</strong> — <em>lawful</em> where compensation flows from genuine retail sales to end users; becomes an unlawful pyramid where it flows from recruitment and inventory loading.","<strong>Telemarketing fraud</strong> — high-pressure phone sales; <em>reloading</em> is the key term: returning to a <em>known prior victim</em> for a second bite, often posing as a recovery agent.","<strong>Recovery-room / reload scheme</strong> — offering, for a fee, to recover the money the victim lost in an earlier scam. Victim lists are a traded commodity.","<strong>Travel & vacation scams</strong> — free-holiday certificates with escalating hidden fees; phantom timeshares.","<strong>Home-improvement / repair fraud</strong> — the itinerant contractor, the unnecessary repair, the vanishing deposit.","<strong>Debt consolidation & credit-repair fraud</strong> — a fee for services that are free, or for illegal 'file segregation' (creating a new credit identity).","<strong>Work-at-home / employment schemes</strong> — a fee for materials, kits, or 'certification'; the reshipping and money-mule variants make the victim an unwitting launderer.","<strong>Romance / relational fraud</strong> — a cultivated relationship, then a crisis requiring money. Now among the highest-loss consumer frauds.","<strong>Charity fraud</strong> — solicitation for a non-existent or misrepresented cause, spiking after disasters."]},{"key":"<strong>Reloading</strong> is the term to remember: the fraudster returns to an <em>already-defrauded</em> victim. Victims of one scam are the most valuable prospects for the next — which is why 'sucker lists' are bought and sold."},{"h":"The tactics"},{"ul":["Artificial urgency and a closing deadline.","Demand for an irrevocable payment method — wire, gift card, crypto, cash courier.","An appeal to secrecy: 'don't tell your bank/family, they'll try to stop you'.","Reciprocity: a small gift, sample, or 'prize' that creates obligation.","Social proof and manufactured authority — fake reviews, forged credentials, spoofed caller ID."]},{"h":"Common victims"},{"p":"The ACFE's data does <em>not</em> support the folk belief that the elderly are universally the most victimised. The elderly suffer <em>higher losses per incident</em> (they hold more assets and are targeted for it), but younger, more online-active consumers report fraud <em>more frequently</em>. If an option says 'the elderly are the most frequently victimised group', treat it with suspicion — frequency and severity are different measures."},{"case":"<strong>Case file — the second theft.</strong> A retiree loses 40,000 to a fake investment. Four months later she is telephoned by a 'fraud recovery bureau' that knows the exact amount she lost and the name of the fake firm — proof, she thinks, of legitimacy. They require a 3,000 'court filing fee'. She pays. It is the <em>same organisation</em>, working its own victim list. The knowledge of her loss was never evidence of authenticity; it was evidence of <em>identity</em>. Anyone contacting a victim already knowing the details of the original fraud should be presumed connected to it."},{"eye":"Examiner's eye: for pyramid-vs-MLM questions, ask a single question — <em>does the money come from selling a real product to real end users, or from recruiting?</em> Inventory loading (recruits forced to buy stock they cannot sell) is the tell for an unlawful pyramid."}]},"g9":{"sec":"s1","title":"Bankruptcy fraud","day":34,"body":[{"h":"The essentials"},{"p":"Bankruptcy fraud is fraud <em>using</em> the insolvency process — either to hide assets from creditors, or to loot a business behind the shield of the proceeding."},{"h":"Key parties — learn who does what"},{"ul":["<strong>Debtor</strong> — the person or entity that owes.","<strong>Creditor</strong> — secured or unsecured; priority determines who gets paid first.","<strong>Trustee</strong> — administers the estate, <em>collects and liquidates</em> assets, and investigates the debtor's affairs. The trustee is the fraud examiner's natural ally.","<strong>Examiner</strong> — appointed where fraud or mismanagement is suspected; investigates but does not administer.","<strong>Debtor in possession</strong> — in a reorganisation, the debtor retains control of the business, with fiduciary duties to creditors."]},{"h":"Types of filing"},{"ul":["<strong>Liquidation</strong> (US: Chapter 7) — assets sold, proceeds distributed, debts discharged.","<strong>Reorganisation</strong> (US: Chapter 11) — the business continues and restructures its debts.","<strong>Adjustment of debts</strong> (US: Chapter 13) — an individual with regular income repays over a plan period."]},{"h":"The schemes"},{"ul":["<strong>Concealment of assets</strong> — <em>by far the most common</em> bankruptcy fraud. Assets transferred to relatives or shells, or simply omitted from the schedules.","<strong>Bust-out</strong> — the signature scheme: a business builds credit, orders large inventory on credit, sells it fast (often below cost, for cash), diverts the proceeds, then files for bankruptcy leaving suppliers unpaid. <em>Planned insolvency from the outset.</em>","<strong>Petition mills</strong> — a 'service' purporting to help distressed tenants or debtors, which instead files bankruptcy on their behalf and strips fees.","<strong>Multiple filings</strong> — the same debtor files in several jurisdictions, or under variant identities, to delay creditors.","<strong>Credit-card bust-out</strong> — max the lines, then file.","<strong>Fraudulent transfers / preferences</strong> — moving assets out, or paying favoured creditors, in the period before filing.","<strong>Embezzlement by the trustee or fiduciary</strong> — rare but severely punished.","<strong>False statements / perjury in the schedules</strong> — the charge that most bankruptcy fraud actually gets prosecuted under."]},{"key":"<strong>Bust-out</strong>: build credit → load up on inventory bought on credit → liquidate it for cash → divert the cash → file for bankruptcy. If a fact pattern shows a sudden surge of credit purchases followed shortly by insolvency, it is a bust-out."},{"h":"Red flags"},{"ul":["A sharp, unexplained increase in credit purchases shortly before filing.","Inventory sold well below cost, or for cash, or to related parties.","Recent transfers of property to family members or newly formed entities.","Books and records 'lost', destroyed, or unavailable.","A change of business name, location, or management shortly before filing.","Lifestyle of the principals unaffected by the claimed insolvency."]},{"case":"<strong>Case file — the wholesaler who ordered too well.</strong> An electronics distributor with a five-year record of steady, modest ordering suddenly triples its purchases across eleven suppliers within a single quarter, all on 60-day terms. Goods move out at 60% of cost through a cash-only outlet. Two weeks after the last delivery, it files. Directors' bank accounts show corresponding deposits. Every element of the bust-out is present: <em>the credit history was the asset being spent</em>. The distributor spent five years building the very trust it was about to liquidate — which is why the surge, not the failure, is the detectable moment."},{"eye":"Examiner's eye: <em>concealment of assets</em> is the most common bankruptcy fraud; <em>bust-out</em> is the most tested. Do not confuse the two — concealment hides what exists, bust-out manufactures the insolvency."}]},"g10":{"sec":"s1","title":"Tax fraud","day":35,"body":[{"h":"The essentials"},{"p":"The whole chapter turns on one distinction."},{"key":"<strong>Tax avoidance</strong> = lawfully arranging affairs to minimise tax. <strong>Tax evasion</strong> = unlawfully concealing or misrepresenting to escape tax. The difference is <em>legality and intent</em>, not the size of the saving."},{"h":"Elements of evasion"},{"p":"To prove evasion you generally need: (1) an <strong>additional tax due and owing</strong>, (2) an <strong>affirmative act</strong> of evasion — not mere omission — and (3) <strong>wilfulness</strong>, a voluntary and intentional violation of a known legal duty. Negligence, a genuine mistake, or a good-faith misunderstanding of a complex provision is not evasion, because wilfulness fails."},{"h":"Evasion schemes"},{"ul":["<strong>Understating income</strong> — omitting cash receipts, skimming before the books, unreported side businesses.","<strong>Overstating deductions</strong> — fictitious expenses, personal costs claimed as business, inflated charitable valuations.","<strong>Fictitious dependants / false credits</strong>.","<strong>Improper allocation of income</strong> — shifting income to a lower-taxed entity, jurisdiction, or family member without substance.","<strong>Offshore concealment</strong> — undisclosed foreign accounts, nominee and shell structures.","<strong>False books, two sets of records, destruction of records</strong>.","<strong>Transfer pricing abuse</strong> — mispricing intra-group transactions to move profit to low-tax jurisdictions.","<strong>Payroll tax fraud</strong> — withholding employee tax and never remitting it; treating employees as contractors."]},{"h":"Schemes targeting taxpayers"},{"ul":["<strong>Refund fraud / stolen-identity refund fraud</strong> — filing a return in the victim's name to capture their refund. The victim discovers it when their genuine return is rejected as a duplicate.","<strong>Preparer fraud</strong> — a preparer inflates deductions (often without the client's knowledge), or diverts the refund to their own account.","<strong>Impersonation scams</strong> — callers posing as the tax authority demanding immediate payment by irrevocable means. A real revenue authority does not demand gift cards."]},{"h":"Proving it"},{"p":"Because direct evidence of unreported income is rare, examiners rely on <strong>indirect methods</strong> — the same ones in the Tracing Assets chapter: the <em>net worth method</em> (assets − liabilities, adjusted for known income and living expenses; an unexplained increase implies unreported income), the <em>expenditures method</em>, and the <em>bank deposits method</em>. Expect at least one question linking tax evasion to the net worth method."},{"case":"<strong>Case file — a lifestyle that didn't add up.</strong> A restaurateur declares annual income of 30,000. Over four years his net worth rises by 480,000 — two properties, no mortgage, and school fees of 60,000 a year. He has no inheritance, no loans, no gifts. The <em>net worth method</em> imputes the unreported income: the increase in wealth plus living expenses, less known reported sources, is income he must explain. He need not confess; the arithmetic is the evidence. Note the affirmative act required for evasion — here, the maintenance of a second set of till records made it wilful, not merely careless."},{"eye":"Examiner's eye: if a fact pattern stresses that the taxpayer used an <em>aggressive but disclosed</em> structure, the answer is avoidance. If it stresses <em>concealment, false documents, or a second set of books</em>, the answer is evasion. Look for the affirmative act."}]},"g11":{"sec":"s1","title":"Cyberfraud","day":36,"body":[{"h":"The essentials"},{"p":"For the exam, cyberfraud is a <em>vocabulary</em> chapter. You do not need to be a technologist; you need to attach the right name to the right described behaviour."},{"h":"Malware — the taxonomy that gets tested"},{"ul":["<strong>Virus</strong> — attaches to a host file and requires <em>user action</em> to execute and spread.","<strong>Worm</strong> — <em>self-replicating and self-propagating</em>; needs no host file and no user action. This virus/worm distinction is a near-certain question.","<strong>Trojan horse</strong> — masquerades as legitimate software; does not self-replicate.","<strong>Ransomware</strong> — encrypts data and demands payment for the key.","<strong>Spyware / keylogger</strong> — covertly records activity or keystrokes.","<strong>Rootkit</strong> — conceals the intruder's presence at a deep system level.","<strong>Logic bomb</strong> — dormant code that triggers on a <em>condition</em> (a date, or the deletion of the author's payroll record — the classic disgruntled-insider weapon).","<strong>Botnet</strong> — a network of compromised machines under a single controller; the engine behind DDoS and spam.","<strong>Scareware</strong> — false warnings inducing the purchase of bogus 'security' software."]},{"key":"<strong>Virus needs a host and a user. A worm needs neither.</strong> If the fact pattern says it spread across the network without anyone opening anything, it is a worm."},{"h":"Intrusion & attack methods"},{"ul":["<strong>Social engineering</strong> — still the most effective intrusion vector. Technology is not the weak point; people are.","<strong>Phishing / spear phishing / whaling</strong> — mass, targeted, and executive-targeted respectively.","<strong>SQL injection</strong> — malicious input exploiting an unsanitised database query.","<strong>Cross-site scripting (XSS)</strong>; <strong>buffer overflow</strong>.","<strong>Man-in-the-middle</strong> — interception and possible alteration of communications in transit.","<strong>DoS / DDoS</strong> — exhausting capacity to deny service; note this is <em>disruption</em>, not data theft.","<strong>Brute force</strong> and <strong>credential stuffing</strong> (reusing breached passwords elsewhere).","<strong>Zero-day</strong> — exploiting a vulnerability before a patch exists.","<strong>Pharming</strong> — DNS poisoning that redirects a correctly typed address to a spoofed site.","<strong>Spoofing</strong> — falsifying the origin of an email, IP, or caller ID.","<strong>Salami technique</strong> — slicing tiny amounts (rounding fractions) from many accounts; individually invisible, collectively large."]},{"h":"Insider threats"},{"p":"The insider is the hardest cyber threat because access is <em>legitimate</em>. Watch for: privilege creep (access accumulating across role changes and never revoked), shared or generic administrator accounts (which destroy attribution), after-hours access without business reason, and access by employees under notice of termination."},{"case":"<strong>Case file — the logic bomb.</strong> A systems administrator, aware he is about to be made redundant, plants code that checks the payroll database nightly for his own employee ID. If the ID is absent, the code begins deleting production servers. He is terminated on a Friday; the servers fail on the following Wednesday. Note the anti-fraud control that would have stopped it and was absent: <em>immediate revocation of privileged access at termination, and code review with segregation of duties</em>. The single most dangerous person in an organisation is a privileged technical employee with a grievance and continuing access."},{"eye":"Examiner's eye: DoS/DDoS is about <em>availability</em>, not confidentiality — no data is stolen. If an option describes 'stealing data by overwhelming a server with traffic', it is wrong on the mechanism."}]},"g12":{"sec":"s1","title":"Government, public sector & procurement fraud","day":37,"body":[{"h":"The essentials"},{"p":"You already know the corruption chapter. This one puts it inside a <em>contracting process</em>. The exam wants you to place the scheme at the correct <strong>phase</strong> of that process."},{"h":"The procurement phases"},{"ul":["<strong>Presolicitation</strong> — the need is identified and specifications are written. <em>Schemes here: need recognition fraud (an unnecessary purchase is manufactured), and bid tailoring / specification fraud (specs written so that only one favoured vendor can qualify).</em>","<strong>Solicitation</strong> — the request goes out and bids are invited. <em>Schemes here: bid manipulation, bid rigging, leaking of bid data.</em>","<strong>Bid evaluation & award</strong> — <em>Schemes here: bid rigging via a corrupt evaluator, manipulation of scoring, unjustified sole-source award.</em>","<strong>Post-award / performance</strong> — <em>Schemes here: product substitution, defective pricing, cost mischarging, change-order abuse.</em>"]},{"key":"Phase matters. <strong>Bid tailoring</strong> happens <em>before</em> the tender is issued (in the specifications). <strong>Bid rigging</strong> happens <em>during</em> solicitation and evaluation. The exam distinguishes them by <em>when</em>."},{"h":"Collusion among bidders — the four named forms"},{"ul":["<strong>Complementary bidding</strong> (cover / courtesy bidding) — competitors submit deliberately high or unacceptable bids to create the <em>appearance</em> of competition. The most common form.","<strong>Bid rotation</strong> — the conspirators take turns being the low bidder, on a schedule.","<strong>Bid suppression</strong> — competitors agree to withdraw, or not to bid at all.","<strong>Market division</strong> — competitors carve up territories or customers and do not bid against each other."]},{"h":"Contractor-side schemes after award"},{"ul":["<strong>Product substitution</strong> — delivering goods of lower quality or non-conforming specification while billing for the specified item.","<strong>Defective pricing</strong> — submitting cost or pricing data that is not current, accurate, or complete, to inflate a negotiated price.","<strong>Cost mischarging</strong> — charging costs to the wrong contract (typically a cost-plus contract) or claiming unallowable costs.","<strong>Change-order abuse</strong> — a low bid wins, then the price is recovered through a stream of inflated change orders. Detect via: <em>the winner bid unusually low, then generated abnormally many changes</em>.","<strong>Progress-payment fraud</strong> — billing for a stage of completion not reached."]},{"h":"Government-specific schemes"},{"ul":["<strong>Grant fraud</strong> — funds diverted from the stated purpose; false progress reports.","<strong>Benefit / entitlement fraud</strong> — payments claimed for ineligible or non-existent recipients (ghost beneficiaries).","<strong>Payroll & ghost employees</strong> in the public body itself.","<strong>Bribery of officials</strong>; <strong>bid-data leakage</strong> by an insider.","<strong>Conflict of interest</strong> — an official with an undisclosed interest in a bidder. Note: <em>a conflict of interest need not involve any payment</em> — the undisclosed interest is itself the violation.","<strong>Revolving-door abuse</strong> — an official steering a contract to a future employer."]},{"case":"<strong>Case file — the cover bids.</strong> Over three years a municipality awards eleven road contracts. In every tender the same four firms bid; the winner rotates in a near-perfect cycle; and the losing bids are consistently 18–22% above the winner — too uniform to be the product of independent estimating. One losing bid contains a spreadsheet with the winner's letterhead in the document metadata. This is <strong>complementary bidding plus bid rotation</strong>. The statistical tell came first and the document evidence second: <em>the losing margins were too consistent</em>. Genuine competitors' estimates scatter; conspirators' do not."},{"h":"Detection signals"},{"ul":["The same firms always bid, and the same firm always wins — or wins in rotation.","Losing bids cluster at a consistent percentage above the winner.","Specifications match one vendor's product catalogue unusually closely.","Unusually short bidding windows; frequent use of sole-source or emergency justification.","A winning bid far below the others, followed by a stream of change orders.","An official's lifestyle, or an undisclosed relationship with a vendor."]},{"eye":"Examiner's eye: <em>complementary bidding</em> is the answer whenever the fact pattern says competitors submitted bids they never intended to win. The purpose is to manufacture the appearance of competition — the losing bidders are participants, not victims."}]}},"quizzes":{"q_d1":["s1q1","s1q5","s1q4","s1n4","s1n5","s1n7","s1q34","s1n26"],"q_d2":["s1q2","s1n6","s1q3","s1n24","s1q35"],"q_d3":["s1q6","s1q7","s1n3","s1q32","s1q8","s1q9","s1n1","s1q10"],"q_d4":["s1q11","s1q12","s1n2","s1q13","s1n28","s1q14","s1n27","s1q15","s1n9"],"q_d5":["s1q16","s1q17","s1n23","s1q18","s1q19","s1n11","s1n10","s1n25","s1n12","s1q33"],"q_d6":["s1q20","s1n29","s1q21","s1n13","s1q22","s1n14","s1q23"],"q_d7":["s1q24","s1q25","s1n15","s1n16","s1q26","s1q27","s1n17"],"q_d8":["s1q28","s1n18","s1q29","s1n20","s1n19","s1q30","s1n21","s1q31","s1n22","s1n8"],"q_d9":["s2q1","s2n2","s2q2","s2n1","s2q3","s2n3","s2q4","s2n4"],"q_d10":["s2q5","s2n5","s2q6","s2n6","s2q7","s2n7","s2q29"],"q_d11":["s2q8","s2n8","s2n9","s1n29"],"q_d12":["s2q9","s2n10","s2q10","s2n11","s2q11","s2n28"],"q_d13":["s2q12","s2n13","s2q13","s2n14","s2q14","s2n15"],"q_d14":["s2q15","s2n16","s2q17","s2n17","s2q16","s2n18","s2n29"],"q_d15":["s2q18","s2n19","s2q19","s2n20","s2q20","s2n21"],"q_d16":["s2q21","s2n22","s2q22","s2n23","s2q23","s1n30"],"q_d17":["s2q24","s2n24","s2q25","s2q26","s2n25","s2q27","s2n26","s2q28","s2n30","s2q30","s2n27","s2n12"],"q_d18":["s3q1","s3n1","s3q2","s3n2","s3q3","s3n3","s3n21"],"q_d19":["s3q4","s3n4","s3n19","s3n15","s3q15"],"q_d20":["s3q5","s3n5","s3q6","s3n6","s3q7","s3n7"],"q_d21":["s3q8","s3n8","s3q9","s3n9","s3q10","s3n10","s3q11","s3n11","s3n12","s3n22"],"q_d22":["s3q12","s3n13","s3q13","s3n20","s3q14","s3n14","s3q16","s3n16","s3q17","s3n17","s3q18","s3n18"],"mock_s1":["s1q11","s1n21","s1q13","s1n24","s1q34","s1q29","s1q23","s1n5","s1n11","s1q30","s1q1","s1q25","s1q2","s1q17","s1q32","s1q21","s1q12","s1n22","s1n29","s1n9","s1n13","s1n10","s1q22","s1n8","s1q31","s1q19","s1n23","s1q18","s1n12","s1n17"],"mock_s2":["s2n6","s2q26","s2q14","s2n8","s2q4","s2q13","s2n11","s2q28","s2q17","s2n12","s2q1","s2n22","s2n1","s2q7","s2n16","s2q18","s2q25","s2n27","s2q2","s2q30","s2n5","s2q9","s2n30","s2n19","s2q15","s2n25","s2n23","s2n24","s2n26","s2q23"],"mock_s3":["s3n21","s3q10","s3q7","s3n3","s3q2","s3n2","s3n6","s3n7","s3n1","s3q1","s3n4","s3n16","s3q4","s3q17","s3n17","s3q3","s3n10","s3q8","s3q13","s3q12","s3n18","s3n5","s3n12","s3n13"],"q_g1":["gq1","gq2","gq3","gq4","gq5","gx19"],"q_g2":["gq6","gq7","gq8","gq9","gx17","gx1"],"q_g3":["gq10","gq11","gq12","gq13","gq14","gq15","gx18"],"q_g4":["gq16","gq17","gq18","gq19","gq20","gq21","gq22","gq23","gx2"],"q_g5":["gq25","gq26","gq27","gq28","gq29","gq30","gq31","gq32","gq33","gx4"],"q_g6":["gq34","gq35","gq36","gq37","gq38","gq39","gq40","gq41","gx15"],"q_g7":["gq42","gq43","gq44","gq45","gq46","gq47","gq48","gx3","gx16"],"q_g8":["gq49","gq50","gq51","gq52","gq24"],"q_g9":["gq53","gq54","gq55","gq56","gq57"],"q_g10":["gq58","gq59","gq60","gq61"],"q_g11":["gq62","gq63","gq64","gq65","gq66","gq67","gx14"],"q_g12":["gq68","gq69","gq70","gq71","gq72","gq73","gq74","gq75","gq76","gx6","gx7","gx8"],"q_traps":["gx1","gx2","gx3","gx4","gx5","gx6","gx7","gx8","gx9","gx10","gx11","gx12","gx13","gx14","gx15","gx16","gx17","gx18","gx19","gx20"],"mock_full_s1":["s1n14","s1n21","gx18","gq72","gq19","gq73","gq48","gq32","gq21","s1n26","s1n1","gq60","gq12","s1q8","gq31","s1q7","gq25","gq76","gq52","s1q13","s1n27","gq41","gx1","gq1","gq44","gq68","s1q2","s1n7","s1q20","s1q4","gq16","gq43","gq46","gx16","gq70","s1q29","gq38","s1n24","gq53","gq27","s1n15","s1q15","gq15","s1n28","gq33","gq61","s1q22","s1n12","s1q6","s1q35","s1n13","gq54","gq62","gx11","gq45","gq74","s1n8","gx20","s1q28","s1q21","gq42","s1n29","gq39","gq36","gq37","s1q3","gq66","gq64","s1n3","gq17","s1q14","gq63","gq75","s1q30","s1q9","gq11","gq28","gq26","gx12","gq57","s1q5","gq58","gq56","gq67","gq13","s1n10","s1n9","gq24","gq23","s1q24","gq2","s1n23","s1q25","gq9","gq5","s1n25","s1n4","gx19","s1n17","gx5"]},"questions":{"s1q1":{"sec":"s1","t":"Under accrual accounting, when is revenue properly recognized?","o":["When cash is received from the customer","When it is earned, regardless of when cash changes hands","At the end of the fiscal year","When the invoice is mailed"],"a":1,"e":"Accrual accounting recognizes revenue when it is <strong>earned</strong> and expenses when incurred, independent of cash timing. Most financial-statement fraud abuses this earned-vs-cash gap to book revenue prematurely."},"s1q2":{"sec":"s1","t":"A company records December sales in November to hit a quarterly target. Which financial-statement fraud family is this?","o":["Fictitious revenue","Timing differences","Concealed liabilities","Improper asset valuation"],"a":1,"e":"Recording real transactions in the wrong period is a <strong>timing difference</strong> (premature recognition). Fictitious revenue involves fake/phantom customers; here the sales are real but mis-timed."},"s1q3":{"sec":"s1","t":"Which occupational-fraud category has the LOWEST frequency but the HIGHEST median loss?","o":["Asset misappropriation","Corruption","Financial statement fraud","Payroll fraud"],"a":2,"e":"<strong>Financial statement fraud</strong> is the rarest category but causes the largest median losses. Asset misappropriation is the inverse — most frequent, smallest median loss."},"s1q4":{"sec":"s1","t":"An analyst expresses each income-statement line as a percentage of total sales to spot anomalies. This is:","o":["Horizontal analysis","Vertical analysis","Ratio analysis","Benford's Law"],"a":1,"e":"<strong>Vertical analysis</strong> states each line as a percent of a base (sales for the income statement, total assets for the balance sheet). Horizontal analysis compares percent change across periods."},"s1q5":{"sec":"s1","t":"Aggressive-but-legal accounting becomes fraud when it crosses which line?","o":["When auditors disagree with it","When it is material AND made with intent to deceive users","When it reduces reported taxes","When it uses estimates"],"a":1,"e":"The dividing line is <strong>material misstatement plus intent to deceive</strong> users who rely on the statements. Estimates and aggressive choices alone are not fraud without that intent and materiality."},"s1q6":{"sec":"s1","t":"An employee rings 'no sale' and pockets a customer's cash. No entry is ever made. This is:","o":["Cash larceny","Skimming","Register disbursement","Billing scheme"],"a":1,"e":"Theft of cash <strong>before</strong> it enters the books is <strong>skimming</strong> (off-book). Because nothing was recorded, there's no direct audit trail — the defining feature versus larceny."},"s1q7":{"sec":"s1","t":"The key distinction between skimming and cash larceny is:","o":["The dollar amount involved","Whether the cash was recorded before being stolen","Whether a manager was involved","Whether it occurred at a register"],"a":1,"e":"<strong>Skimming = before recording (off-book); cash larceny = after recording (on-book).</strong> Larceny creates a discrepancy between records and cash on hand; skimming does not."},"s1q8":{"sec":"s1","t":"An employee steals Customer A's payment, then applies Customer B's later payment to A's account to hide it, rolling the shortfall forward. This is:","o":["Kiting","Lapping","Channel stuffing","Structuring"],"a":1,"e":"<strong>Lapping</strong> is the classic receivables-skimming concealment: crediting one customer with another's payment and continually rolling the gap forward."},"s1q9":{"sec":"s1","t":"Which is a common red flag specifically suggesting lapping?","o":["Rising gross margin","Customer complaints that payments were misapplied or late-posted","Increase in fixed assets","Higher advertising spend"],"a":1,"e":"Lapping produces <strong>misapplied/delayed customer payment postings</strong>, so customer complaints about their account status are a key tell. Independent reconciliation and confirmations help detect it."},"s1q10":{"sec":"s1","t":"Which control most directly prevents cash-receipts skimming?","o":["Annual budgeting","Segregation of duties between cash receipt, recording, and reconciliation","Capitalizing small assets","Quarterly press releases"],"a":1,"e":"<strong>Segregation of duties</strong> — the person who receives cash should not also record and reconcile it — is the core preventive control for receipts schemes."},"s1q11":{"sec":"s1","t":"Fraudulent disbursement schemes are best described as:","o":["Off-book thefts with no record","On-book schemes where company funds are paid out via fraudulent documentation","Only applicable to payroll","A form of financial statement fraud"],"a":1,"e":"Disbursements are <strong>on-book</strong>: the organization's funds leave through its own system using false documents (invoices, timesheets, expense claims, checks)."},"s1q12":{"sec":"s1","t":"A fake vendor that delivers no goods submits invoices that the colluding employee approves. This is a:","o":["Pass-through scheme","Shell-company billing scheme","Register disbursement","Expense reimbursement scheme"],"a":1,"e":"A <strong>shell company</strong> billing scheme bills for goods/services never delivered. A pass-through differs because it actually buys goods then resells to the employer at an inflated price."},"s1q13":{"sec":"s1","t":"Which disbursement scheme is unique because the fraudster physically prepares or alters the payment instrument itself?","o":["Billing","Payroll","Check & payment tampering","Expense reimbursement"],"a":2,"e":"<strong>Check/payment tampering</strong> involves preparing or altering the instrument (forged maker/endorsement, altered payee), distinguishing it from schemes that only falsify supporting documents."},"s1q14":{"sec":"s1","t":"A cashier records a false refund to justify removing cash from the register. This recorded transaction makes it:","o":["Skimming","A register disbursement scheme","Cash larceny","Lapping"],"a":1,"e":"A <strong>register disbursement</strong> (false refund/void) is a recorded fraudulent transaction used to remove cash — distinct from skimming, where nothing is recorded."},"s1q15":{"sec":"s1","t":"Ghost-employee schemes fall under which category?","o":["Billing schemes","Payroll schemes","Skimming","Corruption"],"a":1,"e":"A <strong>ghost employee</strong> (a fake or terminated person kept on payroll) is a classic <strong>payroll</strong> fraudulent-disbursement scheme."},"s1q16":{"sec":"s1","t":"Stacking empty boxes to make a warehouse look fully stocked during a count is:","o":["Lapping","Physical padding of inventory","A timing difference","Channel stuffing"],"a":1,"e":"<strong>Physical padding</strong> conceals inventory theft by faking the quantity on hand during a physical count."},"s1q17":{"sec":"s1","t":"The primary red flag for inventory theft is:","o":["High gross margin","Unexplained inventory shrinkage","Rising share price","Lower depreciation"],"a":1,"e":"<strong>Shrinkage</strong> — the unaccounted-for reduction in inventory — is the primary red flag. Fraudsters try to keep it within 'normal' ranges to avoid scrutiny."},"s1q18":{"sec":"s1","t":"A buyer rewards a vendor with a contract AFTER the award, with no prior agreement to influence the decision. This is:","o":["Bribery","An illegal gratuity","Economic extortion","A conflict of interest"],"a":1,"e":"An <strong>illegal gratuity</strong> rewards a decision already made, without a prior intent to influence. Bribery requires intent to <em>influence</em> a future decision."},"s1q19":{"sec":"s1","t":"An employee demands a payment from a vendor in exchange for favorable treatment. This is:","o":["Illegal gratuity","Economic extortion","A kickback","Conflict of interest"],"a":1,"e":"When the employee <strong>demands</strong> payment (the coercive, demand side), it is <strong>economic extortion</strong>. A kickback is typically initiated by the vendor returning part of an overbilling."},"s1q20":{"sec":"s1","t":"A conflict of interest becomes a fraud concern primarily when:","o":["The transaction is large","The employee's interest is undisclosed and harms the employer","A competitor is involved","It occurs in procurement"],"a":1,"e":"The fraud trigger is an <strong>undisclosed</strong> economic/personal interest that creates divided loyalty harming the employer. Disclosure is the dividing line."},"s1q21":{"sec":"s1","t":"A loan booked in a straw borrower's name for the real party's benefit is a:","o":["Reciprocal loan","Nominee (sham) loan","Construction draw fraud","Double-pledge"],"a":1,"e":"A <strong>nominee/sham loan</strong> uses a straw borrower to disguise the true beneficiary, often to evade lending limits or hide the real risk."},"s1q22":{"sec":"s1","t":"Inflating a property's value to support a larger mortgage is best classified as:","o":["Air loan","Appraisal fraud","Straw buyer scheme","Reciprocal loan"],"a":1,"e":"<strong>Appraisal fraud</strong> inflates the valuation to justify a larger loan — your ValuGuard domain. An 'air loan' is on a wholly nonexistent property/borrower."},"s1q23":{"sec":"s1","t":"Which body sets global prudential standards for sound banking risk management referenced in the manual?","o":["FATF","The Basel Committee on Banking Supervision","The Egmont Group","FINRA"],"a":1,"e":"The <strong>Basel Committee on Banking Supervision</strong> sets global prudential/risk-management standards for banks. FATF sets AML standards; Egmont links FIUs."},"s1q24":{"sec":"s1","t":"The correct order of the money-laundering stages is:","o":["Layering → Placement → Integration","Placement → Layering → Integration","Integration → Layering → Placement","Placement → Integration → Layering"],"a":1,"e":"<strong>Placement → Layering → Integration.</strong> Dirty cash enters the system, is obscured through complex transfers, then re-enters as apparently legitimate assets."},"s1q25":{"sec":"s1","t":"Breaking a large cash sum into multiple sub-threshold deposits to avoid reporting is:","o":["Layering","Structuring (smurfing)","Integration","Kiting"],"a":1,"e":"<strong>Structuring/smurfing</strong> is a placement-stage technique to evade currency-transaction reporting thresholds — exactly the self-transfer/sub-threshold signal your StaffLens flags."},"s1q26":{"sec":"s1","t":"Which organization issues the 40 Recommendations that form the global AML/CFT standard?","o":["Basel Committee","FATF","OECD","IOSCO"],"a":1,"e":"The <strong>Financial Action Task Force (FATF)</strong> issues the 40 Recommendations — the international AML/CFT benchmark adopted by national regimes (including India's PMLA framework)."},"s1q27":{"sec":"s1","t":"At which stage are 'clean' funds reintroduced into the economy as legitimate-looking assets?","o":["Placement","Layering","Integration","Structuring"],"a":2,"e":"<strong>Integration</strong> is the final stage, where laundered funds appear as legitimate wealth (real estate, businesses, luxury assets)."},"s1q28":{"sec":"s1","t":"Exploiting the float between two banks by writing checks against insufficient funds is:","o":["Lapping","Check kiting","Skimming","Structuring"],"a":1,"e":"<strong>Check kiting</strong> exploits the <em>float</em> (clearing delay) between accounts/banks to create artificial balances from non-existent funds."},"s1q29":{"sec":"s1","t":"An attacker impersonates a CFO by email to redirect a vendor payment to a fraudulent account. This is:","o":["Ransomware","Business email compromise (BEC)","Check kiting","Synthetic identity fraud"],"a":1,"e":"<strong>Business email compromise (BEC)</strong> uses impersonation of an executive/vendor to redirect payments — heavily emphasised in the 2026 cyberfraud blueprint."},"s1q30":{"sec":"s1","t":"Which best distinguishes a Ponzi scheme from a pyramid scheme?","o":["Ponzi pays earlier investors from new investors' funds; pyramids derive income chiefly from recruitment","They are identical","Ponzi schemes are legal","Pyramids never involve money"],"a":0,"e":"A <strong>Ponzi</strong> pays 'returns' from new investors' money (no real underlying returns). A <strong>pyramid</strong> generates income primarily from recruiting new participants rather than product sales."},"s1q31":{"sec":"s1","t":"Tax evasion differs from tax avoidance because evasion:","o":["Uses deductions","Requires willful intent to illegally escape tax","Is encouraged by authorities","Applies only to companies"],"a":1,"e":"<strong>Tax evasion is illegal and requires willful intent</strong> to defeat tax. Tax avoidance uses lawful means to minimize tax. The intent/legality line is the tested distinction."},"s1q32":{"sec":"s1","t":"A cashier removes cash that was already recorded as a sale, creating a drawer shortage. This is:","o":["Skimming","Cash larceny","Billing scheme","Illegal gratuity"],"a":1,"e":"Theft of <strong>already-recorded</strong> cash is <strong>cash larceny</strong> (on-book), evidenced here by the drawer shortage — the discrepancy skimming never produces."},"s1q33":{"sec":"s1","t":"Complementary (cover) bids, bid suppression, and bid rotation are forms of:","o":["Billing fraud","Bid-rigging in procurement","Skimming","Money laundering"],"a":1,"e":"These are collusive <strong>bid-rigging</strong> techniques in procurement fraud, undermining genuine competition."},"s1q34":{"sec":"s1","t":"Capitalizing a routine operating expense to boost current income is an example of:","o":["Fictitious revenue","Concealed liabilities / improper expense treatment","Lapping","Economic extortion"],"a":1,"e":"Improperly <strong>capitalizing an expense</strong> defers it off the income statement, understating expenses/liabilities and overstating income — a concealed-liabilities/asset-valuation manipulation."},"s1q35":{"sec":"s1","t":"Which is the MOST frequent occupational-fraud category overall?","o":["Financial statement fraud","Corruption","Asset misappropriation","Bribery"],"a":2,"e":"<strong>Asset misappropriation</strong> is the most frequent occupational fraud (though it has the lowest median loss). Corruption is mid-range; FSF is rarest but costliest."},"s2q1":{"sec":"s2","t":"A fraud examination differs from an audit primarily because it is:","o":["Recurring and general in scope","Specific, allegation-driven, and non-recurring","Performed only by external auditors","Limited to financial statements"],"a":1,"e":"A <strong>fraud examination</strong> resolves a specific allegation from inception to disposition; audits are recurring and general. Different purpose, scope, and methodology."},"s2q2":{"sec":"s2","t":"The proper sequence of the fraud theory approach is:","o":["Test → hypothesize → analyze → refine","Analyze data → create hypothesis → test hypothesis → refine","Interview → arrest → report","Hypothesize → report → analyze"],"a":1,"e":"<strong>Analyze available data → create a hypothesis (worst-case) → test it → refine.</strong> This iterative method underpins fraud examinations."},"s2q3":{"sec":"s2","t":"'The totality of circumstances that would lead a reasonable, trained professional to believe a fraud has occurred' defines:","o":["Materiality","Predication","Probable cause","Reasonable doubt"],"a":1,"e":"<strong>Predication</strong> is required before any examination begins. Without it, an inquiry is an improper 'fishing expedition.'"},"s2q4":{"sec":"s2","t":"When interviewing in a fraud examination, you should generally move:","o":["From most culpable to least culpable","From least culpable to most culpable","Randomly","Only interview the suspect"],"a":1,"e":"Interview <strong>least-culpable to most-culpable</strong>, and proceed from the general to the specific, so you reach the prime suspect armed with evidence."},"s2q5":{"sec":"s2","t":"The four common-law elements of fraud are a material false statement, knowledge of falsity, reliance, and:","o":["Intent to repay","Damages","A written contract","A government victim"],"a":1,"e":"The fourth element is <strong>damages</strong> — the victim suffered loss from relying on the material false statement made knowingly."},"s2q6":{"sec":"s2","t":"Which burden of proof applies in a criminal fraud prosecution?","o":["Preponderance of the evidence","Clear and convincing evidence","Beyond a reasonable doubt","Probable cause"],"a":2,"e":"Criminal cases require proof <strong>beyond a reasonable doubt</strong> — the highest standard. Civil cases use preponderance ('more likely than not')."},"s2q7":{"sec":"s2","t":"A civil fraud plaintiff must generally prove the case by:","o":["Beyond a reasonable doubt","Preponderance of the evidence","Clear and convincing in all cases","Probable cause"],"a":1,"e":"Most civil fraud actions use the <strong>preponderance of the evidence</strong> standard (more likely than not). Some specific civil fraud claims require clear and convincing — but preponderance is the general rule."},"s2q8":{"sec":"s2","t":"Which U.S. statute provides whistleblower protection and requires CEO/CFO certification of financial reports?","o":["RICO","Sarbanes-Oxley Act","FCPA","False Claims Act"],"a":1,"e":"<strong>Sarbanes-Oxley (SOX)</strong> mandates executive certification, strengthens governance, protects whistleblowers, and penalizes document destruction."},"s2q9":{"sec":"s2","t":"In most private-sector internal investigations, constitutional protections like the 5th Amendment:","o":["Fully apply to the employer","Primarily restrain government action, not private employers","Prohibit all interviews","Require Miranda warnings"],"a":1,"e":"Constitutional criminal protections generally restrain <strong>government</strong> action. Private employers have broader latitude, though employment law, contracts, and policies still apply."},"s2q10":{"sec":"s2","t":"Fingerprints found at a scene that require an inference to connect a suspect are an example of:","o":["Direct evidence","Circumstantial evidence","Hearsay","Demonstrative evidence"],"a":1,"e":"<strong>Circumstantial evidence</strong> requires an inference. Most fraud cases are built largely on valid circumstantial evidence. Direct evidence (an eyewitness) proves a fact without inference."},"s2q11":{"sec":"s2","t":"An unbroken record of who handled evidence and when is called:","o":["The work-product doctrine","Chain of custody","Predication","Materiality"],"a":1,"e":"<strong>Chain of custody</strong> documents every transfer and handler. A gap can render evidence inadmissible — a frequently tested point."},"s2q12":{"sec":"s2","t":"In digital forensics, you should analyze:","o":["The original device directly","A verified forensic image (copy), never the original","Only printed screenshots","The device after a factory reset"],"a":1,"e":"Always work on a <strong>verified forensic image</strong> using write-blockers; never alter the original. This preserves integrity and admissibility."},"s2q13":{"sec":"s2","t":"Matching hash values (e.g., SHA) before and after imaging a drive demonstrate that:","o":["The drive is encrypted","The forensic copy is identical to the original and unaltered","The suspect is guilty","The data is privileged"],"a":1,"e":"A matching <strong>hash value</strong> proves the image is bit-for-bit identical to the source and has not been altered — establishing integrity for court."},"s2q14":{"sec":"s2","t":"When collecting documentary evidence, the examiner should preferably obtain:","o":["Photocopies only","Originals where possible, documenting any exceptions","Summaries written by the suspect","Verbal descriptions"],"a":1,"e":"Obtain <strong>originals where possible</strong>; if only copies are available, document why. Preserve the document for forensic testing (ink, paper, indented writing)."},"s2q15":{"sec":"s2","t":"The correct general order of interview question types is:","o":["Admission-seeking → introductory → closing","Introductory → informational → closing → assessment → admission-seeking","Assessment → admission-seeking → informational","Closing → introductory → informational"],"a":1,"e":"<strong>Introductory → Informational → Closing → Assessment → Admission-seeking.</strong> Assessment and admission-seeking are used only when warranted."},"s2q16":{"sec":"s2","t":"An admission-seeking interview should be conducted only when:","o":["The subject requests it","There is reasonable certainty of the subject's guilt","At the start of every examination","The auditor is unavailable"],"a":1,"e":"Admission-seeking interviews require <strong>reasonable certainty of guilt</strong> and should be private. They are never the opening move."},"s2q17":{"sec":"s2","t":"A question that contains its own answer ('You were there that night, weren't you?') is a:","o":["Open question","Leading question","Assessment question","Double-negative question"],"a":1,"e":"A <strong>leading question</strong> suggests the answer and is used mainly to confirm known facts. Open questions invite a narrative."},"s2q18":{"sec":"s2","t":"In an admission-seeking interview, offering two incriminating choices ('Did you plan it, or did it just happen?') is the:","o":["Benchmark admission","Alternative question","Direct accusation","Rationalization"],"a":1,"e":"The <strong>alternative question</strong> presents two choices that both admit guilt, one more face-saving, to move the subject toward confession."},"s2q19":{"sec":"s2","t":"When a subject begins to issue a denial during an admission-seeking interview, the interviewer should:","o":["Let the denial be fully stated and recorded","Interrupt and prevent the denial from hardening","End the interview","Promise leniency"],"a":1,"e":"Skilled interviewers <strong>interrupt denials</strong> before they entrench, because a firmly stated denial is psychologically harder for the subject to retract."},"s2q20":{"sec":"s2","t":"A valid signed confession statement should:","o":["Be written by the examiner in legal language","Be in the subject's own words and acknowledge voluntariness","Promise no prosecution","Omit dollar amounts"],"a":1,"e":"A signed statement should be in the <strong>subject's own words</strong>, contain the key elements (who/what/when/how, intent, approximate amounts) and an acknowledgment that it was given voluntarily. Never promise leniency you can't deliver."},"s2q21":{"sec":"s2","t":"Which indirect method computes: asset increases + living expenses − known income = likely illicit funds?","o":["Bank deposits method","Net worth method","Expenditures method","Benford's Law"],"a":1,"e":"The <strong>net worth method</strong> infers unreported/illicit income from an unexplained increase in net worth plus living expenses, less funds from known legitimate sources."},"s2q22":{"sec":"s2","t":"Benford's Law is appropriately applied to:","o":["Telephone numbers","Sequential invoice ID numbers","Naturally occurring amounts such as payment/invoice values","Employee ID numbers"],"a":2,"e":"Benford's Law applies to <strong>natural numbers</strong> (amounts arising from underlying processes, like payment values), not to assigned/sequential numbers (phone, account, ID)."},"s2q23":{"sec":"s2","t":"Under Benford's Law, the leading digit 1 is expected to appear approximately:","o":["11.1% of the time","30.1% of the time","4.6% of the time","50% of the time"],"a":1,"e":"Leading digit 1 appears about <strong>30.1%</strong> of the time, decreasing to ~4.6% for 9. Large deviations from this distribution can flag manipulation."},"s2q24":{"sec":"s2","t":"In testimony, a fraud examiner should generally NOT:","o":["State findings within their expertise","Express an opinion on the defendant's legal guilt or innocence","Explain methodology","Identify documents"],"a":1,"e":"The examiner must <strong>not opine on legal guilt or innocence</strong> — that's for the trier of fact. Offer findings and opinions only within professional expertise."},"s2q25":{"sec":"s2","t":"The key difference between a lay witness and an expert witness is that an expert:","o":["Cannot be cross-examined","May offer opinions within their area of expertise","Is always paid by the court","Decides the verdict"],"a":1,"e":"An <strong>expert witness</strong>, once qualified, may give <strong>opinions</strong> within their expertise; a lay witness is generally limited to facts personally observed."},"s2q26":{"sec":"s2","t":"A common fraud-examination report mistake is:","o":["Including supporting exhibits","Stating legal conclusions or opinions on guilt","Describing the scope","Being timely"],"a":1,"e":"Reports must avoid <strong>legal conclusions and opinions on guilt</strong>, editorializing, and omission of exculpatory evidence. Report facts impartially; the report must withstand court scrutiny."},"s2q27":{"sec":"s2","t":"Civil and criminal cases arising from the same fraud proceeding at the same time are called:","o":["Double jeopardy","Parallel proceedings","Alternative dispute resolution","Discovery"],"a":1,"e":"<strong>Parallel proceedings</strong> run civil and criminal matters together; they require careful management (self-incrimination, discovery conflicts)."},"s2q28":{"sec":"s2","t":"You may NOT properly begin an admission-seeking interview without:","o":["A signed contract","Adequate predication and reasonable certainty of guilt","A court order","The suspect's lawyer present"],"a":1,"e":"Admission-seeking requires <strong>predication</strong> plus <strong>reasonable certainty of guilt</strong>. Starting without these violates examination standards."},"s2q29":{"sec":"s2","t":"'More likely than not' describes which standard, used in civil fraud cases?","o":["Beyond a reasonable doubt","Clear and convincing","Preponderance of the evidence","Probable cause"],"a":2,"e":"<strong>Preponderance of the evidence</strong> = 'more likely than not' (>50%), the general civil standard, lower than criminal 'beyond a reasonable doubt.'"},"s2q30":{"sec":"s2","t":"To preserve attorney-client privilege over an internal investigation, the work is best:","o":["Published widely","Conducted at the direction of legal counsel","Done without any documentation","Shared with the suspect"],"a":1,"e":"Running the investigation <strong>under counsel's direction</strong> helps preserve attorney-client privilege and work-product protection over investigative materials."},"s3q1":{"sec":"s3","t":"The three legs of the Fraud Triangle are pressure, opportunity, and:","o":["Capability","Rationalization","Greed","Collusion"],"a":1,"e":"Cressey's Fraud Triangle: <strong>pressure + opportunity + rationalization</strong>. Remove any leg and fraud becomes less likely. (Capability is the Fraud Diamond's added element.)"},"s3q2":{"sec":"s3","t":"Which model adds 'capability' to the Fraud Triangle?","o":["Fraud Scale","Fraud Diamond","Routine activity theory","Differential association"],"a":1,"e":"The <strong>Fraud Diamond</strong> adds <em>capability</em> — the individual's position, skills, and confidence to commit and conceal the fraud."},"s3q3":{"sec":"s3","t":"Sutherland's definition of white-collar crime emphasizes crime committed by:","o":["Organized criminal gangs","A person of respectability and high status in the course of their occupation","Only corporations","Government officials only"],"a":1,"e":"Edwin Sutherland defined <strong>white-collar crime</strong> as crime committed by a person of respectability and high social status in the course of their occupation."},"s3q4":{"sec":"s3","t":"According to ACFE research, the most common method by which occupational fraud is initially detected is:","o":["External audit","Tips","By accident","Law enforcement"],"a":1,"e":"<strong>Tips</strong> are consistently the #1 detection method, which is why reporting hotlines are among the most effective anti-fraud controls."},"s3q5":{"sec":"s3","t":"Primary responsibility for designing and maintaining internal controls rests with:","o":["External auditors","Management","The internal audit team only","Regulators"],"a":1,"e":"<strong>Management</strong> owns the design and operation of internal controls and is primarily responsible for preventing and detecting fraud. Auditors provide assurance, not the controls."},"s3q6":{"sec":"s3","t":"Which governance body most directly oversees financial reporting, internal control, and the external auditor?","o":["The marketing committee","The audit committee","The works council","The pension trustees"],"a":1,"e":"The <strong>audit committee</strong> (ideally independent directors) oversees financial reporting integrity, internal controls, and the external auditor relationship."},"s3q7":{"sec":"s3","t":"'Tone at the top' refers to:","o":["The volume of management meetings","The ethical climate set by leadership's example and messaging","The number of internal controls","Executive compensation levels"],"a":1,"e":"<strong>Tone at the top</strong> is the ethical climate established by leadership. A weak tone is the strongest cultural fraud-risk factor."},"s3q8":{"sec":"s3","t":"How many components are in the COSO Internal Control–Integrated Framework?","o":["Three","Four","Five","Seven"],"a":2,"e":"COSO has <strong>five</strong> components: control environment, risk assessment, control activities, information & communication, and monitoring activities."},"s3q9":{"sec":"s3","t":"Which is the foundational component of the COSO framework?","o":["Monitoring","Control environment","Control activities","Risk assessment"],"a":1,"e":"The <strong>control environment</strong> (integrity, ethical values, tone at the top, governance) is the foundation on which the other components rest."},"s3q10":{"sec":"s3","t":"Separating authorization, recording, and custody of assets is the control known as:","o":["Reconciliation","Segregation of duties","Monitoring","Risk assessment"],"a":1,"e":"<strong>Segregation of duties</strong> divides authorization, recording, and custody so no one person controls a whole transaction. Its absence is the most-cited control weakness."},"s3q11":{"sec":"s3","t":"An unqualified ('clean') external audit opinion means:","o":["No fraud exists in the company","Reasonable—not absolute—assurance the statements are free of material misstatement","All transactions were tested","Management is exonerated"],"a":1,"e":"An audit provides <strong>reasonable, not absolute, assurance</strong>. A clean opinion is not a guarantee that no fraud exists — a classic exam distractor."},"s3q12":{"sec":"s3","t":"In a fraud risk assessment, inherent risk is assessed:","o":["After considering controls","Before considering mitigating controls","Only for IT systems","Only by external auditors"],"a":1,"e":"Assess <strong>inherent risk first</strong> (before controls), then factor in mitigating controls to determine <strong>residual</strong> risk. Likelihood × significance drives prioritization."},"s3q13":{"sec":"s3","t":"A fraud risk assessment should be:","o":["A one-time annual checkbox","A periodic, ongoing process responsive to business changes","Performed only after a fraud occurs","Limited to the finance department"],"a":1,"e":"FRA is <strong>periodic and ongoing</strong>, updated as the business and risk environment change — not a single annual checkbox."},"s3q14":{"sec":"s3","t":"Managing vendor and customer fraud risk through due diligence and audit rights addresses:","o":["Internal payroll risk","Third-party fraud risk","Securities fraud","Tax avoidance"],"a":1,"e":"Due diligence, ongoing monitoring, and contractual audit rights manage <strong>third-party fraud risk</strong> — your VendorRecon/DMA-scoring territory."},"s3q15":{"sec":"s3","t":"Per ACFE research, which anti-fraud control is associated with faster detection and lower losses?","o":["Longer audit reports","A reporting hotline","Higher executive pay","More board meetings"],"a":1,"e":"<strong>Reporting hotlines</strong> are linked to faster detection and lower losses because tips are the leading detection method."},"s3q16":{"sec":"s3","t":"Under the ACFE Code of Professional Ethics, a CFE shall:","o":["Express an opinion on legal guilt when confident","Never express an opinion on the legal guilt or innocence of any person","Always testify for the prosecution","Keep all findings secret from the client"],"a":1,"e":"A core CFE Code duty: <strong>never express an opinion on the legal guilt or innocence</strong> of any person. Offer findings within expertise only."},"s3q17":{"sec":"s3","t":"The CFE Code requires that any opinion rendered be supported by:","o":["The client's preference","A reasonable evidential basis","Majority vote","The examiner's intuition"],"a":1,"e":"A CFE must obtain evidence providing a <strong>reasonable basis</strong> for any opinion. Unsupported or speculative opinions violate the Code."},"s3q18":{"sec":"s3","t":"Which statement about legality and ethics is correct?","o":["Anything legal is automatically ethical","An action can be legal yet still unethical","Ethics and law are identical","Only illegal acts are unethical"],"a":1,"e":"<strong>Legal does not always mean ethical.</strong> Fraud examiners must distinguish morality, ethics, and legality and apply professional ethical standards beyond the legal minimum."},"s1n1":{"sec":"s1","t":"Priya, an accounts-receivable clerk, steals a $4,000 check from Customer A. When Customer B pays $4,000 two weeks later, she posts B’s payment to A’s account, then covers B with Customer C. Which scheme and concealment is this?","o":["Cash larceny concealed by a forced balance","Skimming concealed by lapping","A billing scheme concealed by a shell company","Register disbursement concealed by a false void"],"a":1,"e":"The receivable was stolen before being fully accounted for and the shortfall is rolled customer-to-customer — the textbook signature of <strong>skimming concealed by lapping</strong>. A forced balance relates to register/cash counts, not receivables rolling."},"s1n2":{"sec":"s1","t":"Which of the following is the BEST example of a fraudulent disbursement rather than skimming?","o":["A waiter fails to ring up a cash sale and keeps the money","A clerk pockets cash from a recorded sale, creating a drawer shortage","An employee sets up a fake vendor and approves its invoices for payment","A cashier voids a legitimate sale and keeps the cash before recording it"],"a":2,"e":"A <strong>fake-vendor (shell company) billing scheme</strong> is an on-book fraudulent disbursement — company funds leave through the AP system on false documentation. The cash-sale options are skimming (unrecorded) or larceny."},"s1n3":{"sec":"s1","t":"TRUE or FALSE: Because skimming occurs before the transaction is recorded, it generally leaves a clear audit trail in the victim’s books.","o":["True","False"],"a":1,"e":"<strong>False.</strong> Skimming is off-book — the sale or receipt is never recorded, so it leaves <em>no</em> direct audit trail. That absence of a record is exactly what makes it hard to detect."},"s1n4":{"sec":"s1","t":"A controller capitalizes routine repair costs as fixed assets to inflate current-year earnings. This MOST directly results in:","o":["Understated assets and overstated expenses","Overstated assets and overstated net income","Understated revenue and overstated liabilities","No effect on the financial statements"],"a":1,"e":"Capitalizing an expense moves it off the income statement onto the balance sheet — <strong>assets are overstated and net income is overstated</strong> because the expense was improperly deferred."},"s1n5":{"sec":"s1","t":"Which financial-statement fraud scheme is committed by failing to record warranty or litigation reserves?","o":["Fictitious revenue","Timing differences","Concealed liabilities and expenses","Improper asset valuation"],"a":2,"e":"Omitting required reserves (warranties, litigation, returns) understates obligations — a <strong>concealed liabilities and expenses</strong> scheme. The company looks more solvent and profitable than it is."},"s1n6":{"sec":"s1","t":"Ravi ships goods to a distributor near period-end that the distributor has the unconditional right to return, and books the full sale immediately to hit targets. This is BEST described as:","o":["Channel stuffing (timing/fictitious revenue)","An illegal gratuity","A pass-through scheme","Economic extortion"],"a":0,"e":"Pushing product into a channel near period-end to recognize revenue that may be returned is <strong>channel stuffing</strong> — an improper timing/premature-revenue scheme. Right-of-return undermines the ‘earned’ criterion."},"s1n7":{"sec":"s1","t":"All of the following are red flags of financial statement fraud EXCEPT:","o":["Revenue growing faster than cash flow from operations","Receivables growing faster than sales","A dominant CEO who overrides controls","Consistent dividends paid from stable, growing operating cash flow"],"a":3,"e":"Stable, growing operating cash flow funding dividends is a sign of <strong>health</strong>, not fraud. The other three (revenue outpacing cash, receivables outpacing sales, control override) are classic FSF red flags."},"s1n8":{"sec":"s1","t":"An employee buys a personal laptop and submits it on an expense report disguised as ‘client supplies.’ This is which type of expense-reimbursement scheme?","o":["Overstated expense","Mischaracterized expense","Fictitious expense","Duplicate reimbursement"],"a":1,"e":"A genuine purchase that is personal but reported as business is a <strong>mischaracterized expense</strong>. Overstated inflates a real business cost; fictitious invents one; duplicate claims the same cost twice."},"s1n9":{"sec":"s1","t":"Which control would MOST effectively detect a ghost-employee scheme?","o":["Requiring two signatures on the bank account","Periodically distributing paychecks in person and reconciling to HR records","Rotating the company’s external auditor","Encrypting the payroll database"],"a":1,"e":"<strong>In-person paycheck distribution reconciled to HR/active-employee records</strong> exposes ghosts — no real person claims the check. Signature controls and encryption don’t reveal a fictitious payee."},"s1n10":{"sec":"s1","t":"Vendor Sigma overbills ABC Ltd by $50,000 and returns $20,000 to the purchasing manager who approved it. The $20,000 is BEST classified as:","o":["A bribe","A kickback","An illegal gratuity","Economic extortion"],"a":1,"e":"A vendor returning part of an inflated payment to the employee who steered the business is a <strong>kickback</strong> — a form of bribery tied to overbilling/contract steering."},"s1n11":{"sec":"s1","t":"The KEY element that distinguishes bribery from an illegal gratuity is:","o":["The dollar value of the payment","Whether intent existed to influence a decision before it was made","Whether the recipient is a government official","Whether the payment was in cash"],"a":1,"e":"<strong>Bribery requires intent to influence a decision (a quid pro quo before the act); an illegal gratuity rewards a decision already made</strong> with no prior agreement to influence. Value and form are irrelevant to the distinction."},"s1n12":{"sec":"s1","t":"Three competing vendors agree in advance who will submit the lowest bid on each upcoming contract, taking turns. This is:","o":["Bid rotation","Complementary bidding","Bid suppression","Market division by territory"],"a":0,"e":"Taking turns being the designated low bidder is <strong>bid rotation</strong>. Complementary (cover) bids are deliberately high to create an illusion of competition; suppression is agreeing not to bid."},"s1n13":{"sec":"s1","t":"In the ICICI HFC context, a borrower obtains a loan in his gardener’s name but takes the proceeds and makes the payments himself. This is a:","o":["Double-pledged collateral scheme","Nominee (straw borrower) loan","Construction draw fraud","Reciprocal loan arrangement"],"a":1,"e":"A loan booked in a straw borrower’s name for the true party’s benefit is a <strong>nominee/straw-borrower loan</strong>, often used to evade exposure limits or hide the real risk."},"s1n14":{"sec":"s1","t":"An appraiser, paid by the loan officer, values a property at ₹1.2 crore when comparable sales support ₹70 lakh, enabling a larger mortgage. The PRIMARY scheme is:","o":["Air loan","Appraisal (valuation) fraud","Property flipping by the borrower","Account takeover"],"a":1,"e":"Inflating the valuation to justify a larger loan is <strong>appraisal fraud</strong> — directly your ValuGuard domain. An air loan involves a wholly nonexistent property or borrower."},"s1n15":{"sec":"s1","t":"TRUE or FALSE: Under most AML regimes, structuring deposits to stay below a reporting threshold is itself a violation even if the underlying cash is from a legal source.","o":["True","False"],"a":0,"e":"<strong>True.</strong> Structuring (deliberately breaking deposits to evade reporting) is an offense in its own right regardless of the funds’ origin, because the intent is to defeat the reporting requirement."},"s1n16":{"sec":"s1","t":"A customer deposits large cash sums, immediately wires them to several offshore shell companies, which then route funds back to buy local real estate. The offshore wiring stage corresponds to:","o":["Placement","Layering","Integration","Smurfing"],"a":1,"e":"Moving funds through shells and cross-border wires to obscure their origin is <strong>layering</strong>. The initial cash deposit is placement; buying the real estate at the end is integration."},"s1n17":{"sec":"s1","t":"Which body issues the 40 Recommendations that serve as the global AML/CFT standard?","o":["The Basel Committee","The Financial Action Task Force (FATF)","The Egmont Group","IOSCO"],"a":1,"e":"<strong>FATF</strong> issues the 40 Recommendations. The Basel Committee handles prudential banking standards; the Egmont Group links national Financial Intelligence Units."},"s1n18":{"sec":"s1","t":"Mr. Khan writes checks between his accounts at two different banks to exploit clearing delays and create the illusion of funds. This is:","o":["Lapping","Check kiting","Structuring","Synthetic identity fraud"],"a":1,"e":"Exploiting the <strong>float</strong> between banks by passing checks against insufficient funds is <strong>check kiting</strong>."},"s1n19":{"sec":"s1","t":"A fraudster combines a real (stolen) Social Security/PAN number with a fabricated name and date of birth to open new credit. This is:","o":["Account takeover","Synthetic identity theft","True-name financial identity theft","Pretexting"],"a":1,"e":"Blending real and fabricated identifiers to create a new, fictitious identity is <strong>synthetic identity theft</strong> — distinct from account takeover (hijacking an existing account)."},"s1n20":{"sec":"s1","t":"An attacker emails an AP clerk posing as the CEO, urgently requesting a wire to a ‘new vendor account.’ This is MOST precisely:","o":["Ransomware","Business email compromise (BEC)","A pyramid scheme","Check kiting"],"a":1,"e":"Impersonating an executive by email to redirect a payment is <strong>business email compromise (BEC)</strong> — emphasized heavily in the 2026 cyberfraud blueprint."},"s1n21":{"sec":"s1","t":"An investment operator pays “returns” to early investors entirely out of money contributed by newer investors, with no real underlying profits. This is a:","o":["Pyramid scheme","Ponzi scheme","Pump-and-dump","Advance-fee scheme"],"a":1,"e":"Paying earlier investors from later investors’ funds with no genuine returns is a <strong>Ponzi scheme</strong>. A pyramid derives income chiefly from recruitment of new participants."},"s1n22":{"sec":"s1","t":"Which statement BEST captures the tax line that the CFE Exam tests?","o":["Avoidance and evasion are both illegal","Evasion is the legal minimization of tax; avoidance is illegal","Evasion is illegal and requires willful intent; avoidance is lawful","Only corporations can commit evasion"],"a":2,"e":"<strong>Tax evasion is illegal and requires willful intent</strong> to defeat tax; <strong>tax avoidance is the lawful</strong> arrangement of affairs to minimize tax. The willfulness/legality line is the tested point."},"s1n23":{"sec":"s1","t":"During a physical inventory count, an employee stacks empty cartons to disguise missing goods. This concealment is called:","o":["Forced balance","Physical padding","Shrinkage netting","Channel stuffing"],"a":1,"e":"Faking quantity-on-hand with empty containers during a count is <strong>physical padding</strong> of inventory."},"s1n24":{"sec":"s1","t":"Which occupational-fraud category typically shows the HIGHEST median loss despite the LOWEST frequency?","o":["Asset misappropriation","Corruption","Financial statement fraud","Expense reimbursement fraud"],"a":2,"e":"<strong>Financial statement fraud</strong> is rarest but most costly per case. Asset misappropriation is the inverse (most frequent, lowest median loss); corruption sits between."},"s1n25":{"sec":"s1","t":"A purchasing employee secretly owns the supplier she selects for a large contract and never discloses it. The PRIMARY issue is:","o":["Bribery","An undisclosed conflict of interest","Economic extortion","Bid suppression"],"a":1,"e":"An undisclosed personal/economic interest in a transaction the employee influences is a <strong>conflict of interest</strong>. Disclosure is the dividing line; the harm flows from divided loyalty."},"s1n26":{"sec":"s1","t":"Which analysis would MOST directly reveal that cost of goods sold was manipulated relative to sales across three years?","o":["Vertical (common-size) analysis of the income statement","A bank reconciliation","A chain-of-custody log","A Gantt chart"],"a":0,"e":"<strong>Vertical/common-size analysis</strong> expresses each line as a % of sales, making an abnormal COGS-to-sales shift visible. Horizontal analysis would also help; the other options are unrelated."},"s1n27":{"sec":"s1","t":"A cashier processes a fictitious refund to a customer who doesn’t exist and removes the cash. Because the refund IS recorded, this is:","o":["Skimming","A register disbursement scheme","Cash larceny by forced balance","A billing scheme"],"a":1,"e":"A recorded false refund/void used to justify removing cash is a <strong>register disbursement</strong> scheme — the recorded transaction distinguishes it from skimming."},"s1n28":{"sec":"s1","t":"TRUE or FALSE: A pass-through (turnaround) billing scheme involves the employee’s shell delivering no goods at all.","o":["True","False"],"a":1,"e":"<strong>False.</strong> In a <strong>pass-through</strong>, the employee’s intermediary actually buys real goods, then resells them to the employer at an inflated markup. A pure <em>shell</em> scheme is the one that delivers nothing."},"s1n29":{"sec":"s1","t":"Under the U.S. Foreign Corrupt Practices Act (FCPA), which is prohibited?","o":["Paying foreign income tax","Bribing a foreign official to obtain or retain business","Hiring a local sales agent","Maintaining a foreign bank account"],"a":1,"e":"The FCPA prohibits <strong>bribing foreign officials</strong> to obtain or retain business and requires accurate books and records and adequate internal accounting controls."},"s1n30":{"sec":"s1","t":"Which set of numbers is MOST appropriate for a Benford’s Law test?","o":["Sequential invoice ID numbers","Employee badge numbers","Disbursement/payment dollar amounts","Telephone numbers"],"a":2,"e":"Benford’s Law applies to <strong>naturally occurring amounts</strong> such as payment/disbursement values. Assigned/sequential numbers (IDs, badges, phone numbers) do not follow Benford’s distribution."},"s2n1":{"sec":"s2","t":"An examiner begins testing a hypothesis, then revises it as new evidence emerges. Which step of the fraud theory approach is being applied?","o":["Analyzing available data","Creating a hypothesis","Testing the hypothesis","Refining and amending the hypothesis"],"a":3,"e":"Adjusting the working theory as facts develop is the <strong>refine/amend</strong> step. The full cycle: analyze data → create hypothesis → test → refine."},"s2n2":{"sec":"s2","t":"Which is the BEST statement of why a fraud examination differs from an audit?","o":["Examinations are recurring; audits are one-time","Examinations are allegation-specific and seek to resolve a particular issue; audits are general and recurring","Audits require predication; examinations do not","Only audits may be used in court"],"a":1,"e":"A <strong>fraud examination is specific and allegation-driven</strong> (inception to disposition), whereas an audit is recurring and general in scope. Examinations — not audits — require predication."},"s2n3":{"sec":"s2","t":"An anonymous tip alleges a manager is taking kickbacks, supported by unusual vendor patterns. A reasonable, trained professional would believe fraud may have occurred. This threshold is called:","o":["Probable cause","Predication","Materiality","Reasonable doubt"],"a":1,"e":"<strong>Predication</strong> is the totality of circumstances that would lead a reasonable, professionally trained person to believe a fraud has/ is/ will occur. No examination should begin without it."},"s2n4":{"sec":"s2","t":"In planning interview order for a suspected procurement fraud ring, the examiner should generally interview:","o":["The prime suspect first to get a confession quickly","Neutral and least-culpable witnesses first, moving toward the most culpable last","All parties simultaneously","Only the suspect"],"a":1,"e":"Move from <strong>least culpable to most culpable</strong> (and general to specific), so you reach the prime suspect last — armed with corroborated evidence."},"s2n5":{"sec":"s2","t":"Which combination correctly lists the four common-law elements of fraud?","o":["Intent, motive, opportunity, concealment","Material false statement, knowledge of falsity, reliance, damages","Predication, materiality, causation, remedy","Duty, breach, causation, harm"],"a":1,"e":"The four elements: a <strong>material false statement</strong>, <strong>knowledge of its falsity</strong>, victim <strong>reliance</strong>, and resulting <strong>damages</strong>."},"s2n6":{"sec":"s2","t":"A prosecutor must prove a criminal fraud charge to what standard?","o":["Preponderance of the evidence","Clear and convincing evidence","Beyond a reasonable doubt","Probable cause"],"a":2,"e":"Criminal matters require proof <strong>beyond a reasonable doubt</strong> — the highest burden. Civil fraud generally uses preponderance (‘more likely than not’)."},"s2n7":{"sec":"s2","t":"Rank the three burdens from LOWEST to HIGHEST.","o":["Beyond a reasonable doubt < clear and convincing < preponderance","Preponderance < clear and convincing < beyond a reasonable doubt","Clear and convincing < preponderance < beyond a reasonable doubt","Preponderance < beyond a reasonable doubt < clear and convincing"],"a":1,"e":"From lowest to highest: <strong>preponderance of the evidence → clear and convincing → beyond a reasonable doubt</strong>. This ladder is one of the most-tested Law items."},"s2n8":{"sec":"s2","t":"Which U.S. statute targets a ‘pattern of racketeering activity’ and offers both criminal and powerful civil remedies?","o":["Sarbanes-Oxley Act","RICO","The False Claims Act","The Securities Act of 1933"],"a":1,"e":"<strong>RICO</strong> (Racketeer Influenced and Corrupt Organizations Act) addresses a pattern of racketeering activity and provides criminal penalties and treble-damages civil actions."},"s2n9":{"sec":"s2","t":"Under the False Claims Act, a private whistleblower who sues on the government’s behalf brings what kind of action?","o":["A class action","A qui tam action","A derivative action","An interpleader"],"a":1,"e":"A <strong>qui tam</strong> action lets a private ‘relator’ sue for fraud against the government and share in any recovery — a hallmark of the False Claims Act."},"s2n10":{"sec":"s2","t":"TRUE or FALSE: In a private-sector internal investigation in the U.S., the employer must give Miranda warnings before interviewing an employee suspect.","o":["True","False"],"a":1,"e":"<strong>False.</strong> Miranda applies to <em>custodial interrogation by government</em>. Private employers are not required to give Miranda warnings, though employment law and policies still apply."},"s2n11":{"sec":"s2","t":"An eyewitness testifies she personally saw the defendant alter the ledger. This is:","o":["Circumstantial evidence","Direct evidence","Hearsay","Demonstrative evidence"],"a":1,"e":"Testimony of something <strong>personally perceived</strong> that proves a fact without inference is <strong>direct evidence</strong>. Circumstantial evidence requires an inference."},"s2n12":{"sec":"s2","t":"A chart the examiner prepares to help the jury visualize the flow of stolen funds is which type of evidence?","o":["Real evidence","Testimonial evidence","Demonstrative evidence","Documentary evidence"],"a":2,"e":"Illustrative aids (charts, diagrams, models) that explain other evidence are <strong>demonstrative evidence</strong>."},"s2n13":{"sec":"s2","t":"During seizure of a suspect laptop, the examiner should FIRST:","o":["Boot the original and browse for files","Create a verified forensic image and work only on the copy","Delete temporary files to save space","Email the hard drive contents to counsel"],"a":1,"e":"Always <strong>image the drive (with a write-blocker) and analyze the copy</strong>, never the original — preserving integrity and admissibility."},"s2n14":{"sec":"s2","t":"Why does an examiner compute and compare hash values when imaging digital media?","o":["To compress the data","To prove the image is identical to the original and unaltered","To encrypt the evidence","To recover the password"],"a":1,"e":"A matching <strong>hash (e.g., SHA-256)</strong> demonstrates the forensic image is bit-for-bit identical to the source and has not been altered — establishing integrity."},"s2n15":{"sec":"s2","t":"All of the following help preserve documentary evidence EXCEPT:","o":["Obtaining originals where possible","Maintaining an evidence/chain-of-custody log","Highlighting and annotating directly on the original document","Handling the document minimally to preserve forensic features"],"a":2,"e":"<strong>Writing on the original</strong> destroys its evidentiary integrity (alters the item, masks indented writing/forensic features). The other three are sound preservation practices."},"s2n16":{"sec":"s2","t":"Place these interview question types in their proper sequence: assessment, introductory, admission-seeking, informational, closing.","o":["Introductory → informational → closing → assessment → admission-seeking","Informational → introductory → assessment → closing → admission-seeking","Introductory → assessment → informational → admission-seeking → closing","Assessment → intr
